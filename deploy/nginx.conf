# Serve the production build (the contents of dist/) from the root of a host, e.g. https://vfq-review.<company>.com/
server {
  listen 80;
  server_name vfq-review.example.internal;   # your internal hostname
  root /var/www/vfq-dxp-app;                # where dist/ was copied
  index index.html;

  # Single-page app: any path that is not a real file falls back to index.html (client-side routing).
  location / {
    try_files $uri /index.html;
  }

  # Hashed build assets can be cached for a year; index.html and the JSON data must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(config|mock-data)/ {
    add_header Cache-Control "no-cache";
  }
}
