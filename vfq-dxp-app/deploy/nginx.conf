# Serve the production build at https://vfq-review.<company>.com/.
server {
  listen 80;
  server_name vfq-review.example.internal;   # your internal hostname
  root /var/www/vfq-dxp-app;                 # copy dist/ here
  index index.html;

  # Single-page app: unknown routes fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached for a year; index.html and the JSON data must not be.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/(config|mock-data|news)/ {
    add_header Cache-Control "no-cache";
  }
}
