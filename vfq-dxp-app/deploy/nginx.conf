# Serve the production build at https://vfq-review.<company>.com/vfq-dxp-app/.
server {
  listen 80;
  server_name vfq-review.example.internal;   # your internal hostname
  root /var/www;                             # copy dist/ to /var/www/vfq-dxp-app/
  index index.html;

  location = /vfq-dxp-app {
    return 302 /vfq-dxp-app/;
  }

  # Single-page app: unknown routes under the mount point fall back to its index.
  location /vfq-dxp-app/ {
    try_files $uri $uri/ /vfq-dxp-app/index.html;
  }

  # Hashed build assets can be cached for a year; index.html and the JSON data must not be.
  location /vfq-dxp-app/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /vfq-dxp-app/index.html {
    add_header Cache-Control "no-cache";
  }
  location ~ ^/vfq-dxp-app/(config|mock-data|news)/ {
    add_header Cache-Control "no-cache";
  }
}
