<meta charset="utf-8">
<title>Mobile Postpaid Activation — Process Flow</title>
<style>
:root{
  --charcoal:#25282b; --charcoal-2:#1a1c1e;
  --panel:#ffffff; --line:#d8d8d8; --ink2:#4a4d4e; --accent:#e60000;
  --ink:#111; --mute:#5A5A66; --navy:#2A1B9E;
  --radius-button:2px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:90;
  background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));
  color:#f4f4f4;padding:var(--space-5) var(--space-6) var(--space-4)}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hgroup{display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.h1main{font-size:24px;font-weight:800;color:#fff;line-height:1.25}
.h1sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.72);line-height:1.3;margin-top:1px}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.arow{display:flex;align-items:center;gap:var(--space-2)}
.btn,.phaseselect{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:var(--radius-button);padding:var(--space-2) var(--space-3);
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover,.phaseselect:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.phaseselect{min-width:190px;padding-right:22px}
.searchctrl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius-button);padding:0 var(--space-3);height:31px}
.searchctrl input{border:0;outline:0;font-size:12px;font-weight:600;color:var(--ink2);
  width:200px;font-family:inherit;background:none}
.searchctrl.no-match input{color:var(--accent)}
.hits{font-size:11px;font-weight:700;color:var(--mute);min-width:52px;text-align:right}
.expwrap{position:relative}
.expmenu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-button);box-shadow:0 18px 44px rgba(0,0,0,.22);display:none;z-index:120;min-width:180px}
.expmenu.open{display:block}
.expmenu button{display:block;width:100%;text-align:left;border:0;background:none;
  padding:9px 14px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.expmenu button:hover{background:#f2f2f2;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:rgba(255,255,255,.76);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
i{width:13px;height:13px;display:inline-block;flex:none}
.dot{border-radius:50%}
.dia{background:#fff;border:2px solid #2A1B9E;transform:rotate(45deg);width:10px;height:10px}
.ring{border-radius:50%;background:#0F9B8E;box-shadow:0 0 0 2px var(--charcoal-2) inset,0 0 0 3px #0F9B8E}
.sq{border-radius:4px;background:#7A2BD6}
.dash{height:0;border-top:2px dashed #3B7DD8;width:18px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.chipd{background:none;border:1px dashed rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.scroll{overflow-x:auto;overflow-y:hidden;padding:0 0 28px}
.scroll svg{display:block}
#printdoc{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.printing>header,body.printing>.scroll{display:none!important}
  body.printing #printdoc{display:block}
  /* one printed sheet per slice: fixed page box, SVG letterboxes itself inside it */
  .pg{break-after:page;page-break-after:always;
      height:100vh;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pgcap{flex:none}
  .pg svg{flex:1;min-height:0;width:100%;height:100%}
  .pgcap{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9pt;color:#333;border-bottom:1px solid #ccc;
    padding-bottom:2mm;margin-bottom:3mm}
  .pgcap b{font-weight:800}
}
</style>
<header>
  <div class="hrow">
    <div class="hgroup">
      <div class="eyebrow">BPMN Process Flow</div>
      <div class="h1main">Mobile Postpaid Activation</div>
      <div class="h1sub">Process Flow</div>
    </div>
    <div class="actions">
      <div class="arow">
        <select class="phaseselect" id="phaseSel" aria-label="Jump to phase"></select>
        <div class="expwrap">
          <button class="btn primary" id="expBtn">Export</button>
          <div class="expmenu" id="expMenu">
            <button data-fmt="svg">Export as SVG (vector)</button>
            <button data-fmt="png">Export as PNG</button>
            <button data-fmt="pdf">Export as PDF (paginated)</button>
          </div>
        </div>
      </div>
      <div class="arow">
        <span class="hits" id="hits"></span>
        <div class="searchctrl" id="searchCtrl">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#6f7375" stroke-width="1.8">
            <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search node…" autocomplete="off">
        </div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#2A1B9E"></i> Primary-path step</span>
    <span><i class="dia"></i> Decision / validation</span>
    <span><i class="ring"></i> Milestone</span>
    <span><i class="dot" style="background:#F01010"></i> Error / rejection — journey ends</span>
    <span><i class="dot" style="background:#C07800"></i> Recovery, retry or side flow</span>
    <span><i class="sq"></i> Escalation / approval task</span>
    <span><i class="dot" style="background:#12A038"></i> Happy-path branch label</span>
    <span><i class="dash"></i> Data flow</span>
    <span><i class="chip"></i> System / actor tag</span>
  </div>
</header>
<div class="scroll" id="scroll">

text><text x="14260.0" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Not in Collections</text><path d="M 14460 233 L 14460.0 583" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="14449" y="408.0" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 14449 408.0)" text-anchor="middle">Exceeds threshold</text><path d="M 14460.0 583 L 14460 233" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="14449.0" y="408.0" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 14449.0 408.0)" text-anchor="middle">Re-check after settlement</text><text x="14662.0" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Within threshold</text><path d="M 15260 233 L 15260.0 582.0" fill="none" stroke="#7A2BD6" stroke-width="2.2" marker-end="url(#ahv)"/><text x="15249" y="407.5" font-size="11" font-weight="700" fill="#7A2BD6" transform="rotate(-90 15249 407.5)" text-anchor="middle">Ceiling reached</text><path d="M 15260.0 608.0 L 15260.0 798" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><path d="M 15260.0 822 L 15260.0 1007" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><path d="M 15260.0 1007 L 15260.0 579.0999999999999 L 15660 579.0999999999999 L 15660 229" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="15249.0" y="618.0" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 15249.0 618.0)" text-anchor="middle">Approved</text><path d="M 15260.0 1043 L 15260.0 1228" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="15249.0" y="1135.5" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 15249.0 1135.5)" text-anchor="middle">Rejected</text><text x="15462.0" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Within limit</text><path d="M 18860 233 L 18860 215.4 L 16860 215.4 L 16860 201" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="18849" y="217.0" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 18849 217.0)" text-anchor="middle">Payment validation failed</text><text x="19058.5" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Validated</text><path d="M 24860 229 L 24860.0 583" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="24849" y="406.0" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 24849 406.0)" text-anchor="middle">If unconsumed after 72h</text><path d="M 26860 233 L 26860.0 582" fill="none" stroke="#F01010" stroke-width="2.2" marker-end="url(#ahr)"/><text x="26849" y="407.5" font-size="11" font-weight="700" fill="#F01010" transform="rotate(-90 26849 407.5)" text-anchor="middle">Mandatory validation fails</text><path d="M 26860.0 582 L 26860 233" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="26849.0" y="407.5" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 26849.0 407.5)" text-anchor="middle">Corrective action taken</text><text x="27058.5" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">All validations pass</text><path d="M 30060 233 L 30060.0 583" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="30049" y="408.0" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 30049 408.0)" text-anchor="middle">Payment fails</text><path d="M 30060.0 583 L 30060 233" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="30049.0" y="408.0" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 30049.0 408.0)" text-anchor="middle">Retry</text><text x="30262.0" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Payment succeeds</text><g id="hl"></g>

<script>
const NODES=[{"id": "start", "x": 60, "y": 215, "r": 22, "lb": "Customer / Interaction Arrives", "t": "1 customer / interaction arrives a customer engages a channel (retail, telesales, fulfillment, direct sale/mass market) to begin a mobile postpaid activation journey. trigger / channel"}, {"id": "jsm01", "x": 460, "y": 215, "r": 24, "lb": "Agent Access & Authorization", "t": "2 agent access & authorization mpar_001_jsm_01 1. system shall authenticate the agent using configured identity and access management services before granting access to any journey, validate credentials, and deny access when authentication fails.\n\n2. system shall authorize journey initiation and control view, edit and submit permissions based on assigned roles and privileges, \n\n3. system shall restrict agents without the required privilege, based on role and access from initiating a journey. retail agent"}, {"id": "jsm02", "x": 860, "y": 215, "r": 20, "lb": "Maintain Agent Session", "t": "3 maintain agent session mpar_001_jsm_02 system shall maintain agent session details including agent id, channel id and login timestamp. retail agent"}, {"id": "jsm03", "x": 1260, "y": 215, "r": 20, "lb": "Receive Channel & Queue Context", "t": "4 receive channel & queue context mpar_001_jsm_03 1. system shall receive journey details from qnomy, cti calls and email interactions before journey initiation; \n\n2. associate the q-ticket number, service type and available interaction attributes with the journey and tracking record; \n\n3. system shall continue journey processing using configured fallback rules when qnomy is unavailable. trigger / channel"}, {"id": "jsm04", "x": 1660, "y": 215, "r": 20, "lb": "Create Tracking Record", "t": "5 create tracking record mpar_001_jsm_04 1. system shall automatically create a tracking record upon successful journey initiation, generate a unique tracking reference number, and populate mandatory attributes including journey reference, agent id, channel, service type and timestamp.\n\n2. system shall permit resolution only after all mandatory journey validations are complete and automatically close the tracking record after successful journey completion and downstream processing.\n\n3. system shall maintain a complete audit history of tracking-record changes. dxp / crm journey"}, {"id": "jsm05", "x": 2060, "y": 215, "r": 24, "lb": "Save Milestone as Draft Order", "t": "6 save milestone as draft order mpar_001_jsm_05 the system shall persist the journey milestone as a draft order on each successful stage validation so that the journey can be resumed without re entering captured data. dxp / crm journey"}, {"id": "kyc01", "x": 2460, "y": 215, "r": 20, "lb": "Scan Identity Document", "t": "7 scan identity document mpar_001_kyc_01 \u00b7 br-002 1. the system shall allow an authorised agent to select a supported identity-document type and capture the required document images, including front, back images, optional liveliness check (selfi of the customer) where the customer consents and through bar code reader\n\n2. the system shall submit the images, extract all available identity attributes - id type, id number, first name, last name, date of birth, nationality and id expiry date from the scanned document.\n\n3. the system shall display the captured images and extracted attributes to the agent and store the images, attributes and capture outcome as identity evidence in the customer journey context. retail agent"}, {"id": "kyc01_type_check", "x": 2860, "y": 215, "r": 24, "lb": "Supported ID Document Type?", "t": "8 supported id document type? br-002 \u00b7 br-010 the scanned document's id type is checked against the permitted set for this journey (br-002: qid, diplomatic id permitted for postpaid; br-010: gcc id and passport are prepaid-only, not postpaid-eligible). an unsupported/ineligible document type for a postpaid activation is rejected here rather than being allowed to proceed into verification. retail agent"}, {"id": "kyc03_capture_check", "x": 3260, "y": 215, "r": 24, "lb": "Capture Complete & Successful?", "t": "9 capture complete & successful? mpar_001_kyc_03 \u00b7 br-003 1. the system shall prevent journey progression when a required image or identity attribute is missing, or when image capture or automated extraction is unsuccessful.\n\n2. the system shall allow the agent to re-scan the identity document after an unsuccessful capture or extraction attempt and retain the latest successful images and attributes.\n\n3. when automated verification is unavailable or remains unsuccessful after the permitted attempts, the system shall allow an authorised agent to capture the identity information manually under the configured fallback conditions. retail agent"}, {"id": "kyc04_age", "x": 3660, "y": 215, "r": 24, "lb": "Age \u2265 18?", "t": "10 age \u2265 18? mpar_001_kyc_04 the system shall execute age verification from the date of birth field & reject if the customer age is below 18 years. retail agent"}, {"id": "kyc05_moi", "x": 4060, "y": 215, "r": 20, "lb": "Reconcile Attributes with MOI", "t": "11 reconcile attributes with moi mpar_001_kyc_05 \u00b7 br-004 1. the system shall compare each captured identity attribute with the corresponding id verification system attribute and store the attribute-level results and overall reconciliation result.\n\n2. the system shall evaluate the identity status and permit journey progression only when the status is acceptable; \n\n3. journey progression shall be permitted only when all mandatory identity attributes satisfy the configured reconciliation criteria and \n\n4. the system shall allow the journey based on identity status if acceptable, allow the agent to re-scan the document or terminate the journey according to the permitted actions.\n\n5. following identity re-capture, the system shall submit the latest identity information for verification and reconciliation again while retaining previous attempts in the audit history. id verification (moi)"}, {"id": "kyc05_status", "x": 4460, "y": 215, "r": 24, "lb": "Identity Status Acceptable?", "t": "12 identity status acceptable? br-004 id verification system (moi) validation applies to passport, qid and diplomatic id (excluded/skipped for gcc, which continues the journey). reconciliation requires a 100% match between captured and moi-validated attributes. status handling: active allows all journeys; expired qid permits modification only; expired passport, gcc id or diplomatic id is not allowed for any journey; a passport linked to a qid with the journey initiated on passport is not allowed to progress. id verification (moi)"}, {"id": "kyc06_moi_lookup", "x": 4860, "y": 215, "r": 20, "lb": "MOI Lookup & Nationality-Risk Status", "t": "13 moi lookup & nationality-risk status mpar_001_kyc_06 \u00b7 br-005 1. the system shall preserve the captured images and attributes reconciled with moi attributes.\n\n2. the system shall derive and store the applicable nationality-risk indicator using the authoritative nationality returned by moi and the active nationality-risk configuration id verification (moi)"}, {"id": "kyc02", "x": 5260, "y": 215, "r": 20, "lb": "Capture Optional MADA ID", "t": "14 capture optional mada id mpar_001_kyc_02 the system shall accept mada id optionally (to be considered for special discount)  retail agent"}, {"id": "kyc07_display", "x": 5660, "y": 215, "r": 20, "lb": "Display MOI Attributes to Agent", "t": "15 display moi attributes to agent mpar_001_kyc_07 the system shall display id type, id number, date of birth, the five name fields, last name, nationality, salutation and id expiry date, moi validation timestamp returned by moi on the customer verification screen. retail agent"}, {"id": "kyc08_moi_avail", "x": 6060, "y": 215, "r": 24, "lb": "MOI Available / Responds in Time?", "t": "16 moi available / responds in time? mpar_001_kyc_08 \u00b7 br-006 1. when moi is unavailable or does not respond within the configured period, preserve the captured identity information, and save the journey as pending government verification or draft.\n\n2. final order submission shall remain blocked until moi verification is completed successfully.\n\n3. the system shall support automatic retry of moi verification during order submission for the pending journey, if the automatic 3 retry fails, then the system shall fetch the data from local moi data\n\n4. if successfully verified, update the result and allow the journey to continue subject to all other validations. id verification (moi)"}, {"id": "kyc09_expiry", "x": 6460, "y": 215, "r": 20, "lb": "Capture Interim Expiry from MOI", "t": "17 capture interim expiry from moi mpar_001_kyc_09 the system shall capture id expiry date from moi even if id verification system return the data retail agent"}, {"id": "kyc10_rep", "x": 6860, "y": 215, "r": 24, "lb": "Representative Restriction Check", "t": "18 representative restriction check mpar_001_kyc_10 the system shall not permit a postpaid or prepaid connection to be taken by a representative acting on behalf of the customer. retail agent"}, {"id": "cam01", "x": 7260, "y": 215, "r": 20, "lb": "Customer Search & Matching", "t": "19 customer search & matching mpar_001_cam_01 modification flow:\n1. the system shall provide the agent with a customer-search function.\n2. the system shall support contact number, msisdn, account id,qid, passport number,gcc id and diplomatic id as a customer-search criterion.\n3.  the system shall display an error message when customer-search results cannot be retrieved.\n4. the system shall allow the agent to clear the selected criterion and entered search value.\n5. the system shall allow the agent to select exactly one customer record from the multiple records retrieved search results.\n\nactivation flow:\n1. the system shall provide the agent with a customer details after matching the ids (qid, passport number,gcc id and diplomatic id).\n2. the system shall create a new customer incase there is no match with the id type, id number and nationality\n- qid to be used as unique identifier\n- for passport - passport number and nationality to be used as unique identifier dxp / crm journey"}, {"id": "cam01_match", "x": 7660, "y": 215, "r": 24, "lb": "Existing Customer Matched?", "t": "20 existing customer matched? activation flow matches by id (qid, passport number, gcc id, diplomatic id); if no match on id type, id number and nationality, a new customer is created (qid as unique identifier, or passport number + nationality for passport holders). dxp / crm journey"}, {"id": "cam02", "x": 8060, "y": 215, "r": 20, "lb": "Overwrite Attributes from Latest MOI", "t": "21 overwrite attributes from latest moi mpar_001_cam_02 the system shall overwrite any attribute on an existing customer record from the moi response from the latest retriveal of moi data. dxp / crm journey"}, {"id": "cam03", "x": 8460, "y": 215, "r": 20, "lb": "Identify Existing Contact", "t": "22 identify existing contact mpar_001_cam_03 the system shall identify an existing contact using id type and id number before creating a new contact. dxp / crm journey"}, {"id": "cam04", "x": 8860, "y": 215, "r": 24, "lb": "Lock Verified Attributes (Non-Editable)", "t": "23 lock verified attributes (non-editable) mpar_001_cam_04 the system shall render id number, id type, the five name fields, date of birth, nationality, id expiry date and salutation as non editable following successful moi validation dxp / crm journey"}, {"id": "cam05", "x": 9260, "y": 215, "r": 20, "lb": "Capture Editable Address Attributes", "t": "24 capture editable address attributes mpar_001_cam_05 the system shall present the address returned by moi as editable covering building number, street number, zone and apartment, villa or flat number. retail agent"}, {"id": "cam06", "x": 9660, "y": 215, "r": 20, "lb": "Mandatory Account Attributes", "t": "25 mandatory account attributes mpar_001_cam_06 \u00b7 br-007 the system shall require account type, customer category and segment to be populated before the customer account can be created. dxp / crm journey"}, {"id": "cam07", "x": 10060, "y": 215, "r": 20, "lb": "Derive Category & Segment from Nationality", "t": "26 derive category & segment from nationality mpar_001_cam_07 the system shall derive customer category and segment automatically from customer nationality using the configured nationality to customer type matrix. dxp / crm journey"}, {"id": "cam08", "x": 10460, "y": 215, "r": 20, "lb": "Create Default Primary Contact", "t": "27 create default primary contact mpar_001_cam_08 the system shall create a default primary contact for the customer account using the verified customer identity information. dxp / crm journey"}, {"id": "cam09", "x": 10860, "y": 215, "r": 20, "lb": "Populate Default Credit Limit", "t": "28 populate default credit limit mpar_001_cam_09 the system shall populate the default credit limit on the customer account based on the customer segment. dxp / crm journey"}, {"id": "cam10", "x": 11260, "y": 215, "r": 20, "lb": "Agent-Overridable Attributes", "t": "29 agent-overridable attributes mpar_001_cam_10 the system shall allow the agent to override email address, language and alternate phone number on the customer account. retail agent"}, {"id": "cam11", "x": 11660, "y": 215, "r": 20, "lb": "HRN Advance Payment Message", "t": "30 hrn advance payment message mpar_001_cam_11 \u00b7 br-008 the system shall display the configured advance payment message on the customer creation page where the customer is flagged as high risk nationality. dxp / crm journey"}, {"id": "cam12", "x": 12060, "y": 215, "r": 20, "lb": "Multiple Contacts per Customer", "t": "31 multiple contacts per customer mpar_001_cam_12 \u00b7 br-009 the system shall allow multiple contacts to be associated with a single customer account. dxp / crm journey"}, {"id": "cam13", "x": 12460, "y": 215, "r": 20, "lb": "Assign Contact Role", "t": "32 assign contact role mpar_001_cam_13 the system shall allow a role to be assigned to each contact created against the customer account. \na customer (with unique national id) can assume different responsibilities and relations with vfq (personal account or spoc for enterprise account). the contact should have a custom field to indicate that relation. retail agent"}, {"id": "cam14", "x": 12860, "y": 215, "r": 20, "lb": "Capture & Verify Email", "t": "33 capture & verify email mpar_001_cam_14 the system shall allow the agent to capture the customer email address (multiple e-mail address can be added to an account) and to verify it through the email verification service, marking the address as verified on success. retail agent"}, {"id": "ecc01", "x": 13260, "y": 215, "r": 24, "lb": "Connection Type Eligibility by ID Type", "t": "34 connection type eligibility by id type mpar_001_ecc_01 \u00b7 br-010 the system shall determine eligibility for postpaid and prepaid connection types based on the customer id type in accordance with business rule. dxp / crm journey"}, {"id": "ecc03", "x": 13660, "y": 215, "r": 24, "lb": "Blacklist Check", "t": "35 blacklist check mpar_001_ecc_03 new customers: \n1. the system shall perform blacklist validation for new customers. \n2. the system shall receive blacklist validation results from credit control and store  information in customer blacklist repository. \n\nblacklist status check:\n3. the system shall prevent/permit customer onboarding or transaction completion depending on the blacklist status.  credit / collections"}, {"id": "ecc04", "x": 14060, "y": 215, "r": 24, "lb": "In Collections?", "t": "36 in collections? mpar_001_ecc_04 the system shall block journey progression where the customer status is returned as in collections. credit / collections"}, {"id": "ecc05", "x": 14460, "y": 215, "r": 24, "lb": "Outstanding Dues \u2264 Threshold?", "t": "37 outstanding dues \u2264 threshold? mpar_001_ecc_05 the system shall retrieve the customer outstanding balance and shall block journey progression where the balance exceeds the configured threshold. credit / collections"}, {"id": "ecc07", "x": 14860, "y": 215, "r": 20, "lb": "Retrieve Active Line Count", "t": "38 retrieve active line count mpar_001_ecc_07 \u00b7 br-011 the system shall retrieve the total number of active mobile voice connections associated with the customer. credit / collections"}, {"id": "ecc08", "x": 15260, "y": 215, "r": 24, "lb": "Line Count Ceiling Reached?", "t": "39 line count ceiling reached? mpar_001_ecc_08 the system shall display a validation message where the line count ceiling is reached and shall permit the retail agent to proceed, subject to the approval task. credit / collections"}, {"id": "ecc12", "x": 15660, "y": 215, "r": 20, "lb": "Assign Initial Credit Limit", "t": "40 assign initial credit limit mpar_001_ecc_12 \u00b7 br-012 1.the system shall determine and assign the initial account-level credit limit based on the business-configured credit limit matrix using customer segment.\n2.the system shall display the current credit limit maintained at customer account level.  dxp / crm journey"}, {"id": "ecc13", "x": 16060, "y": 215, "r": 20, "lb": "Credit Limit Not Amendable at Activation", "t": "41 credit limit not amendable at activation mpar_001_ecc_13 the system shall not permit credit limit enhancement within the new activation journey because the capability applies only to the modification and add on journeys. dxp / crm journey"}, {"id": "milestone1", "x": 16460, "y": 215, "r": 27, "lb": "Milestone: Customer Created & Eligibility Captured", "t": "42 milestone: customer created & eligibility captured #5. first milestone \u2014 customer created or existing customer identified, and product offer eligibility captured. dxp / crm journey"}, {"id": "bam01", "x": 16860, "y": 215, "r": 20, "lb": "Create Billing Account & Payment Profile", "t": "43 create billing account & payment profile mpar_001_bam_01 \u00b7 br-013 1. the system shall allow agent to create a new billing account or select an existing account for eligible customers.\n2. the system shall allow agent to capture billing information \n- contatct (primary & secondary)\n- preferred invoice recipient contact\n- new or existing billing address\n- bill cycle\n- payment profile, validate payment profile, update payment profile\n3. the system shall allow the retail agent to capture payment profile details covering payment method, payment type and billing frequency. the system should only allow credit card & debit card for auto debit.\n4. the system shall validate the captured payment details and shall update the payment profile only following successful validation. the system shall capture last 4 digit of card & token number generated from payment gateway in the payment profile. retail agent"}, {"id": "bam02", "x": 17260, "y": 215, "r": 20, "lb": "Select Existing Billing Account", "t": "44 select existing billing account mpar_001_bam_02 the system shall allow the retail agent to select an existing billing account in the cart during a plan purchase, where one or more already exist against the customer. retail agent"}, {"id": "bam03", "x": 17660, "y": 215, "r": 20, "lb": "One Billing Account per Line in Cart", "t": "45 one billing account per line in cart mpar_001_bam_03 the system shall permit exactly one billing account to be associated with a line/plan (in case there multiple connection & corresponding plans are purchased together in a single cart, each connection should be associated with a specific billing account). dxp / crm journey"}, {"id": "bam04", "x": 18060, "y": 215, "r": 20, "lb": "Multiple Payment Profiles per Account", "t": "46 multiple payment profiles per account mpar_001_bam_04 the system shall allow a billing account to hold multiple payment profiles. dxp / crm journey"}, {"id": "bam05", "x": 18460, "y": 215, "r": 24, "lb": "Add Billing Account During Validation", "t": "47 add billing account during validation mpar_001_bam_05 the system shall allow the retail agent to add a billing account holding an active payment profile at the cart validation stage where none is present. retail agent"}, {"id": "bam06", "x": 18860, "y": 215, "r": 24, "lb": "Payment Validation Failed?", "t": "48 payment validation failed? mpar_001_bam_06 the system shall return the retail agent to the payment profile capture screen where payment validation fails so that the details can be recaptured. retail agent"}, {"id": "milestone2", "x": 19260, "y": 215, "r": 27, "lb": "Milestone: Bill Profile Created", "t": "49 milestone: bill profile created #7. second milestone \u2014 customer bill profile created (postpaid only). dxp / crm journey"}, {"id": "qpc01", "x": 19660, "y": 215, "r": 20, "lb": "Present Eligible Base Plans", "t": "50 present eligible base plans mpar_001_qpc_01 the system shall present only those base plans for which the customer is eligible, determined by customer segment and connection type. dxp / crm journey"}, {"id": "qpc02", "x": 20060, "y": 215, "r": 20, "lb": "Present Eligible Add-Ons", "t": "51 present eligible add-ons mpar_001_qpc_02 the system shall present only those add ons that are eligible for the selected base plan and shall prevent selection of an ineligible add on. dxp / crm journey"}, {"id": "qpc03", "x": 20460, "y": 215, "r": 20, "lb": "Enforce Add-On Cardinality", "t": "52 enforce add-on cardinality mpar_001_qpc_03 the system shall enforce the configured add on cardinality rules covering minimum quantity, maximum quantity and default quantity. dxp / crm journey"}, {"id": "qpc04", "x": 20860, "y": 215, "r": 20, "lb": "Present Eligible Discounts", "t": "53 present eligible discounts mpar_001_qpc_04 the system shall present only those discounts that are eligible for the selected base plan and shall prevent selection of an ineligible discount. dxp / crm journey"}, {"id": "qpc05", "x": 21260, "y": 215, "r": 20, "lb": "Create Cart", "t": "54 create cart mpar_001_qpc_05 the system shall allow the retail agent to create a cart containing the selected base plan, add ons and discounts. retail agent"}, {"id": "qpc06", "x": 21660, "y": 215, "r": 20, "lb": "Amend Cart Before Submission", "t": "55 amend cart before submission mpar_001_qpc_06 the system shall allow the retail agent to review, amend and remove selected plans, add ons and discounts at any point before order submission. retail agent"}, {"id": "qpc07", "x": 22060, "y": 215, "r": 20, "lb": "Recalculate Cart Pricing", "t": "56 recalculate cart pricing mpar_001_qpc_07 the system shall recalculate one time charges, recurring charges and discounts whenever a product is added to, amended within, or removed from the cart. dxp / crm journey"}, {"id": "qpc08", "x": 22460, "y": 215, "r": 20, "lb": "Apply Latest Discount Version", "t": "57 apply latest discount version mpar_001_qpc_08 the system shall apply the latest effective version of an eligible discount to the cart. dxp / crm journey"}, {"id": "qpc09", "x": 22860, "y": 215, "r": 20, "lb": "Display Bill Limit", "t": "58 display bill limit mpar_001_qpc_09 the system shall display the bill limit associated with the selected base plan on the cart. dxp / crm journey"}, {"id": "qpc10", "x": 23260, "y": 215, "r": 24, "lb": "MADA Discount \u2014 Supporting Document Required", "t": "59 mada discount \u2014 supporting document required mpar_001_qpc_10 the system shall require the mada identity document to be uploaded as a supporting document where a special discount is added to the cart (captured in kyc processs along with mandatory ids). retail agent"}, {"id": "num01", "x": 23660, "y": 215, "r": 20, "lb": "Retrieve & Auto-Populate Reserved Numbers", "t": "60 retrieve & auto-populate reserved numbers mpar_001_num_01 the system shall retrieve and auto-populate customer reserved numbers which are eligible for the journey product, number & sim systems"}, {"id": "num02", "x": 24060, "y": 215, "r": 20, "lb": "Select Number (Free / Star / Fixed Line)", "t": "61 select number (free / star / fixed line) mpar_001_num_02 the system shall allow agent to search and select free numbers, star number or fixed line numbers based on the journey or customer choice retail agent"}, {"id": "num03", "x": 24460, "y": 215, "r": 24, "lb": "Star Number Validation", "t": "62 star number validation mpar_001_num_03 \u00b7 br-014 the system shall validate star number eligibility based on business rules. product, number & sim systems"}, {"id": "num04", "x": 24860, "y": 215, "r": 20, "lb": "Reserve Number", "t": "63 reserve number mpar_001_num_04 the system shall reserve selected number during order processing and release the number if draft order is expired or cancelled product, number & sim systems"}, {"id": "num06", "x": 25260, "y": 215, "r": 20, "lb": "Display Number & Upfront Charges", "t": "64 display number & upfront charges mpar_001_num_06 the system shall display selected number details, upfront charges and commitment period to agent for customer confirmation before submission. retail agent"}, {"id": "sim01", "x": 25660, "y": 215, "r": 20, "lb": "Select SIM Type", "t": "65 select sim type mpar_001_sim_01 1. the system shall allow agent to select appropriate sim type during journey initiation.\n2. the system shall allow agent to capture physical sim/printed esim details.\n3. the system shall assign sim to the customer service.\n4. the system shall generate virtual esim and deliver virtual esim information to the customer through email or sms after order fulfillment retail agent"}, {"id": "sim02", "x": 26060, "y": 215, "r": 20, "lb": "SIM / eSIM Validation & Inventory Reservation", "t": "66 sim / esim validation & inventory reservation mpar_001_sim_02 1. the system shall validate sim serial number, iccid, status and availability and throw and error to agent in case of any issue\n2. the system shall reserve the sim from the inventory and mark it consumed after fulfillment\n- esim and virtual sim must be depleted from uim inventory\n- physical sim must be depleted from wincash and uim inventory product, number & sim systems"}, {"id": "sim03", "x": 26460, "y": 215, "r": 20, "lb": "Add SIM as Order Line Item", "t": "67 add sim as order line item mpar_001_sim_03 the system shall add the allocated sim to the order as a line item and shall reserve that sim in inventory until order completion. dxp / crm journey"}, {"id": "cvc01", "x": 26860, "y": 215, "r": 24, "lb": "Cart Validation, Review & Payment Preparation", "t": "68 cart validation, review & payment preparation mpar_001_cvc_01 \u00b7 br-015 1. the system shall validate customer eligibility -customer account status, billing profile availability and completeness , payment profile availability and completeness  prior to checkout.\n2.the system shall validate that the selected assets are eligible for modification, migration, suspension, resumption, or termination.\n3. the system shall execute compatibility validations and quantity validations for products included in the cart.\n4. the system shall validate that the requested msisdn and simor esim is available for allocation.\n5. the system shall validate the availability of requested equipment and devices included in the order.\n6. the system shall validate that all mandatory appointment requirements have been fulfilled for fulfilment-related orders.\n7. the system shall calculate applicable recurring and non-recurring charges, deposits and advance payments, penalties and termination charges.\n8. the system shall present an itemized order and payment summary before confirmation.\n9.the system shall prevent checkout if any mandatory validation returns a failure status and corresponding corrective actions to be displayed to the user before order submission. dxp / crm journey"}, {"id": "milestone3", "x": 27260, "y": 215, "r": 27, "lb": "Milestone: Cart Checked Out", "t": "69 milestone: cart checked out #10. third milestone \u2014 cart checked out. dxp / crm journey"}, {"id": "caf01", "x": 27660, "y": 215, "r": 20, "lb": "Generate Key Information for CAF", "t": "70 generate key information for caf mpar_001_caf_01 1. the system shall generate and display key information before caf submission to the agent and customer.\n2. the key information shall include the connection type, service type, selected product, associated resources, selected plan, plan lock-in period, star number, star number lock-in period, device instalment details, and device instalment lock-in period, as applicable as per the cart of the journey.\n3. the system shall refresh the displayed key information whenever the agent adds, removes, or amends an item in the cart, key information must be consistent with the final validated cart. dxp / crm journey"}, {"id": "caf02", "x": 28060, "y": 215, "r": 20, "lb": "Generate, Sign & Distribute CAF", "t": "71 generate, sign & distribute caf mpar_001_caf_02 1. the system shall use the applicable caf template using the configured mapping for journey, product type, service type, agent role, and channel and generate the caf related to the ongoing journey with all information like customer, account, service, product, resources.\n2. the system shall prevent caf generation where mandatory caf information is unavailable.\n3. the system shall allow the authorised agent to select the applicable digital signature-capture method - 1. customer-facing touchpad and 2. touch-screen device options.\n4. the system shall display the complete caf to the customer on the selected customer-facing device, customer shall be able to review the caf before signature capture.\n5. the system shall capture the customer signature through the selected signature device, captured signature must be embedded in caf, signed caf should be visible to agent.\n6. the system shall detect and report signature-capture failure, shall allow for recapturing if required, system shall allow to proceed until caf submission is completed.\n7. the system shall allow an agent to upload a manually signed caf during caf submission, acceptable format is pdf or jpg limited of 2 mb maximum size of a document. retail agent"}, {"id": "caf03", "x": 28460, "y": 215, "r": 20, "lb": "Upload Supporting Documents", "t": "72 upload supporting documents mpar_001_caf_03 the system shall allow the retail agent to attach supporting documents required for the activation in pdf or jpg format with a maximum file size of two megabytes per document. retail agent"}, {"id": "caf04", "x": 28860, "y": 215, "r": 20, "lb": "View & Download Supporting Documents", "t": "73 view & download supporting documents mpar_001_caf_04 the system shall display uploaded documents in a dedicated section of the user interface and shall allow the retail agent to view and download each document. retail agent"}, {"id": "milestone4", "x": 29260, "y": 215, "r": 27, "lb": "Milestone: Signed CAF", "t": "74 milestone: signed caf #12. fourth milestone \u2014 signed caf. dxp / crm journey"}, {"id": "pay01", "x": 29660, "y": 215, "r": 20, "lb": "Display Payment Summary", "t": "75 display payment summary mpar_001_pay_01 the system shall display a consolidated payment summary showing all applicable charges prior to payment confirmation.\n- hrn advance\n- star number charges\n- credit limit enhancement charges\n- plan downgrade penalty\n- plan commitment breakin penalty\n- migration charges\n- sim card charges\n- plan and add-on charges\n- additional device charges retail agent"}, {"id": "pay02", "x": 30060, "y": 215, "r": 24, "lb": "Process Payment", "t": "76 process payment mpar_001_pay_02 1. the system shall create and send a payment request to the payment collection system for all applicable order charges\n2. the system shall prevent duplicate payment collection for the same chargeable event.\n3. the system shall validate payment status returned by the payment collection system before continuing order processing.\n4. the system shall handle payment failures\n5. the system should hold the order and does not allow submission untill the payment is completed\n6. the system shall generate a payment receipt after successful payment collection even for the zero payments payment collection system"}, {"id": "pay04", "x": 30460, "y": 215, "r": 20, "lb": "Post Bill Payment", "t": "77 post bill payment mpar_001_pay_04 the system shall post captured bill payments to the billing system. payment collection system"}, {"id": "pay05", "x": 30860, "y": 215, "r": 20, "lb": "Deplete Physical SIM Inventory", "t": "78 deplete physical sim inventory mpar_001_pay_05 the system shall deplete a physical sim or a printed esim from stock through payment collection system on payment completion. payment collection system"}, {"id": "pay06", "x": 31260, "y": 215, "r": 20, "lb": "Virtual eSIM Depletion at Fulfilment", "t": "79 virtual esim depletion at fulfilment mpar_001_pay_06 since virtual esim is not allocated to store & the inventory is not mainatained at payment collection system, esim depletion will happen at order fulfilment stage.  fulfilment & notification"}, {"id": "milestone5", "x": 31660, "y": 215, "r": 27, "lb": "Milestone: Order Submitted", "t": "80 milestone: order submitted #14. final milestone \u2014 order submitted. dxp / crm journey"}, {"id": "ord01", "x": 32060, "y": 215, "r": 20, "lb": "Order Visibility & Status Management", "t": "81 order visibility & status management mpar_001_ord_01 1. the system shall submit the order once the payment is succesful, in case of payment failure system save the order in draft\n2. the system shall receive the order status and display it within the customer 360\n3. the system shall mark the order status based on the response from fullfillment system\n4. the system shall display error reasons in case of order failure fulfilment & notification"}, {"id": "ord02", "x": 32460, "y": 215, "r": 20, "lb": "Communicate Activation Service Level", "t": "82 communicate activation service level mpar_001_ord_02 the system shall display the four business hour postpaid activation service level to the retail agent so that it can be communicated to the customer following successful order confirmation. retail agent"}, {"id": "ord03", "x": 32860, "y": 215, "r": 20, "lb": "Resolve Tracking Record", "t": "83 resolve tracking record mpar_001_ord_03 the system shall set the tracking record status to resolved once the order status is completed in crm and shall record the order number in the record detail. dxp / crm journey"}, {"id": "ord04", "x": 33260, "y": 215, "r": 24, "lb": "Mandatory Fields on Resolution", "t": "84 mandatory fields on resolution mpar_001_ord_04 the system shall require the configured mandatory fields to be populated before the tracking record can be set to resolved. dxp / crm journey"}, {"id": "not01", "x": 33660, "y": 215, "r": 20, "lb": "Notification Trigger, Template & Channel", "t": "85 notification trigger, template & channel mpar_001_not_01 1.the system shall support configuration of notification events, templates, recipients, languages and channels.\n2.the system shall trigger the applicable communication template based on the notification event type .\n3.the system shall determine the communication language and delivery based on customer preference.\n4.the system shall populate dynamic template attributes using transaction, customer, account, and service data.\n5.the system shall record communication delivery status updates including sent, delivered, failed, and pending statuses.\n6.the system shall maintain a notification history for customer communications generated as part of the transaction lifecycle. fulfilment & notification"}, {"id": "not04", "x": 34060, "y": 215, "r": 20, "lb": "Notify All MSISDNs on QID", "t": "86 notify all msisdns on qid mpar_001_not_04 the system shall send the activation notification to every active msisdn registered against the customer qid in accordance with the cra requirement. fulfilment & notification"}, {"id": "not06", "x": 34460, "y": 215, "r": 20, "lb": "Trigger Feedback Survey", "t": "87 trigger feedback survey mpar_001_not_06 the system shall send the customer feedback survey request to \"customer survey\" system once the tracking record is set to resolved.\n fulfilment & notification"}, {"id": "end", "x": 34860, "y": 215, "r": 27, "lb": "End of Order Capture Journey", "t": "88 end of order capture journey #16. end of order capture journey. fulfilment & notification"}, {"id": "jsm01_deny", "x": 460.0, "y": 595, "r": 19, "lb": "Access Denied", "t": "access denied authentication fails or the agent lacks the required role/privilege; journey initiation is restricted. retail agent"}, {"id": "jsm06", "x": 1760.0, "y": 595, "r": 18, "lb": "Resume Draft Order", "t": "resume draft order mpar_001_jsm_06 the system shall allow the retail agent to view and resume the list of draft orders initiated by the same agent and system shall re-apply all the validation before proceeding ahead retail agent"}, {"id": "jsm07", "x": 2060.0, "y": 595, "r": 18, "lb": "Re-Assign Draft to Different Agent", "t": "re-assign draft to different agent mpar_001_jsm_07 the system shall allow supervisor to assign the draft order to different agent, so that the same can be picked by the agent supervisor / approver"}, {"id": "jsm08", "x": 2360.0, "y": 595, "r": 18, "lb": "Draft Order Expiry (30 Days)", "t": "draft order expiry (30 days) mpar_001_jsm_08 \u00b7 br-001 the system shall expire a draft order that has not been submitted within the configured retention period and shall release all reservations held by that draft. dxp / crm journey"}, {"id": "kyc01_reject", "x": 2860.0, "y": 595, "r": 19, "lb": "Reject Unsupported Document Type", "t": "reject unsupported document type br-002 \u00b7 br-010 \u00b7 ecc-02 the system rejects continuation of a postpaid activation on an id type not permitted for postpaid (per br-002/br-010, e.g. gcc id or passport, which br-010 routes to prepaid only) and, per mpar_001_ecc_02, displays a distinct validation message identifying this specific eligibility-failure condition so the agent can communicate the reason to the customer. retail agent"}, {"id": "kyc03_rescan", "x": 3260.0, "y": 595, "r": 24, "lb": "Re-scan (max 4 attempts) / Manual Capture Fallback", "t": "re-scan (max 4 attempts) / manual capture fallback br-003 the agent may re-scan after an unsuccessful capture, retaining the latest successful images/attributes; the maximum number of capture attempts is configurable (currently 4). if automated verification remains unsuccessful after the permitted attempts, an authorised agent may capture identity information manually, which raises an approval task. retail agent"}, {"id": "kyc03_manual_approval", "x": 3260.0, "y": 810, "r": 19.0, "lb": "Manual Capture Approval Task", "t": "manual capture approval task br-003 a task is raised for approval when identity information is captured manually under the configured fallback conditions. supervisor / approver"}, {"id": "kyc04_reject", "x": 3660.0, "y": 595, "r": 19, "lb": "Reject \u2014 Underage", "t": "reject \u2014 underage journey rejected because the derived customer age (from date of birth) is below 18 years. retail agent"}, {"id": "kyc08_pending", "x": 6060.0, "y": 595, "r": 19.0, "lb": "Pending Government Verification (Draft)", "t": "pending government verification (draft) br-006 identity information is preserved and the journey is saved as pending government verification/draft. final order submission is blocked until moi verification succeeds. automatic retry is attempted (re-triggered if order not submitted within 30 minutes); after 3 failed automatic retries, the system falls back to local moi data. id verification (moi)"}, {"id": "kyc08_resume", "x": 6060.0, "y": 810, "r": 18, "lb": "MOI Verified \u2014 Resume Journey", "t": "moi verified \u2014 resume journey once successfully verified, the result is updated and the journey continues subject to all other validations. id verification (moi)"}, {"id": "kyc10_reject", "x": 6860.0, "y": 595, "r": 19, "lb": "Reject \u2014 Representative Not Permitted", "t": "reject \u2014 representative not permitted a postpaid or prepaid connection may not be taken by a representative acting on behalf of the customer. retail agent"}, {"id": "ecc02", "x": 13260.0, "y": 595, "r": 19, "lb": "Display Eligibility Failure Message", "t": "display eligibility failure message mpar_001_ecc_02 the system shall display a distinct validation message on the user interface for each eligibility failure condition so that the agent can communicate the reason to the customer. retail agent"}, {"id": "ecc06", "x": 14460.0, "y": 595, "r": 18, "lb": "Settle Dues & Re-check", "t": "settle dues & re-check mpar_001_ecc_06 the system shall allow the agent to direct the customer to settle outstanding dues and shall re evaluate the outstanding balance before permitting the journey to continue. retail agent"}, {"id": "ecc09", "x": 15260.0, "y": 595, "r": 19.0, "lb": "Credit Approval Task (3rd\u20135th Line)", "t": "credit approval task (3rd\u20135th line) mpar_001_ecc_09 the system shall create an approval task for the credit team where an expatriate customer requests a third, fourth or fifth postpaid connection. credit / collections"}, {"id": "ecc10", "x": 15260.0, "y": 810, "r": 18, "lb": "Hold Order Pending Approval", "t": "hold order pending approval mpar_001_ecc_10 the system shall allow the agent to capture the order and hold it, and shall permit submission only once the associated approval task has been approved. dxp / crm journey"}, {"id": "ecc10_decision", "x": 15260.0, "y": 1025, "r": 24, "lb": "Approval Task Outcome", "t": "approval task outcome the held order awaits the credit team's decision on the approval task. supervisor / approver"}, {"id": "ecc11", "x": 15260.0, "y": 1240, "r": 18, "lb": "Cancel Held Order (Rejected)", "t": "cancel held order (rejected) mpar_001_ecc_11 the system shall allow the agent to cancel the held order where the associated approval task is rejected. retail agent"}, {"id": "num05", "x": 24860.0, "y": 595, "r": 18, "lb": "Release Reservation After 72 Hours", "t": "release reservation after 72 hours mpar_001_num_05 the system shall release a reserved msisdn back to the available pool where it has not been consumed by the same customer within seventy two hours of reservation. product, number & sim systems"}, {"id": "cvc01_reject", "x": 26860.0, "y": 595, "r": 19, "lb": "Checkout Blocked \u2014 Corrective Action Required", "t": "checkout blocked \u2014 corrective action required checkout is prevented if any mandatory validation returns a failure status; corresponding corrective actions are displayed to the user before order submission. retail agent"}, {"id": "pay03", "x": 30060.0, "y": 595, "r": 18, "lb": "Retry Payment (max 4 attempts)", "t": "retry payment (max 4 attempts) mpar_001_pay_03 \u00b7 br-016 1. the system shall allow agent to retry the payment during the payment failures\n2. the system shall enforce a configurable limit on failed payment attempts.\n3. the system shall capture all payment requests, responses, retries, cancellations, and refunds to be retained in the audit history. retail agent"}], PHASES=[{"n": "Initiate Customer Interaction", "x": 0}, {"n": "Initiate Customer Verification", "x": 2260.0}, {"n": "Customer Information / Account", "x": 7060.0}, {"n": "Eligibility & Credit Control", "x": 13060.0}, {"n": "Bill Profile (Postpaid)", "x": 16660.0}, {"n": "Product, Number & SIM Selection", "x": 19460.0}, {"n": "Checkout & Contract (CAF)", "x": 26660.0}, {"n": "Payment & Order Submission", "x": 29460.0}, {"n": "Fulfilment & Notification", "x": 31860.0}];
const scroll=document.getElementById('scroll'), hl=document.getElementById('hl'),
      q=document.getElementById('q'), sc=document.getElementById('searchCtrl'),
      hits=document.getElementById('hits'), sel=document.getElementById('phaseSel');

/* ---- Jump to phase ---- */
sel.innerHTML='<option value="">Jump to phase…</option>'+
  PHASES.map((p,i)=>`<option value="${p.x}">${i} · ${p.n}</option>`).join('');
sel.onchange=()=>{ if(sel.value!=='') scroll.scrollTo({left:+sel.value,behavior:'smooth'}); };

/* ---- Search ---- */
let matches=[], cur=-1;
const SVGNS='http://www.w3.org/2000/svg';
function ring(n,strong){
  const c=document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',n.r);
  c.setAttribute('fill','none'); c.setAttribute('stroke','#e60000');
  c.setAttribute('stroke-width',strong?4:2.5); c.setAttribute('opacity',strong?1:.55);
  hl.appendChild(c);
}
function paint(){
  hl.textContent='';
  matches.forEach((n,i)=>ring(n,i===cur));
}
function goto_(i){
  if(!matches.length) return;
  cur=(i+matches.length)%matches.length;
  const n=matches[cur];
  scroll.scrollTo({left:Math.max(0,n.x-scroll.clientWidth/2),behavior:'smooth'});
  paint(); hits.textContent=`${cur+1} / ${matches.length}`;
}
function run(){
  const t=q.value.trim().toLowerCase();
  if(t.length<2){ matches=[]; cur=-1; hl.textContent=''; hits.textContent='';
                  sc.classList.remove('no-match'); return; }
  matches=NODES.filter(n=>n.t.includes(t));
  sc.classList.toggle('no-match',matches.length===0);
  if(!matches.length){ hl.textContent=''; hits.textContent='0'; cur=-1; return; }
  cur=-1; goto_(0);
}
let deb; q.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(run,180);});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault(); matches.length?goto_(cur+(e.shiftKey?-1:1)):run();}
  if(e.key==='Escape'){q.value='';run();}
});

/* ---- Paginated PDF via the browser's own print-to-PDF (no external library, works offline) ---- */
function exportPDF(){
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  const SLICE=Math.round(H*1.50);                 // A4-landscape printable aspect
  const n=Math.ceil(W/SLICE);
  const doc=document.createElement('div'); doc.id='printdoc';
  for(let i=0;i<n;i++){
    const pg=document.createElement('div'); pg.className='pg';
    const cap=document.createElement('div'); cap.className='pgcap';
    cap.innerHTML='<b>Mobile Postpaid Activation — Process Flow</b>'+
                  '<span>Page '+(i+1)+' of '+n+'</span>';
    const c=el.cloneNode(true);
    const h=c.querySelector('#hl'); if(h) h.textContent='';
    c.removeAttribute('id'); c.removeAttribute('width'); c.removeAttribute('height');
    c.setAttribute('viewBox',(i*SLICE)+' 0 '+SLICE+' '+H);
    pg.appendChild(cap); pg.appendChild(c); doc.appendChild(pg);
  }
  document.body.appendChild(doc);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');doc.remove();
                  window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{window.print(); setTimeout(done,1500);},150);
}

/* ---- Export ---- */
const expBtn=document.getElementById('expBtn'), expMenu=document.getElementById('expMenu');
expBtn.onclick=e=>{e.stopPropagation();expMenu.classList.toggle('open');};
document.addEventListener('click',()=>expMenu.classList.remove('open'));
function svgBlob(){
  const el=document.getElementById('flow').cloneNode(true);
  el.querySelector('#hl').textContent='';
  el.setAttribute('xmlns',SVGNS);
  return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(el)],
                  {type:'image/svg+xml;charset=utf-8'});
}
function save(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
expMenu.onclick=e=>{
  const fmt=e.target.dataset&&e.target.dataset.fmt; if(!fmt) return;
  expMenu.classList.remove('open');
  const base='vfq-mobile-postpaid-activation-brsd-v1-3-process-flow';
  if(fmt==='svg') return save(svgBlob(),base+'.svg');
  if(fmt==='pdf') return exportPDF();
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  /* a very wide canvas at 1x can exceed browser canvas limits, so PNG renders at 0.5x */
  const k=0.5, img=new Image(), url=URL.createObjectURL(svgBlob());
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=W*k; cv.height=H*k;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{save(b,base+'.png');URL.revokeObjectURL(url);},'image/png');
  };
  img.onerror=()=>{alert('PNG export failed in this browser — use Export as SVG.');URL.revokeObjectURL(url);};
  img.src=url;
};
</script>
