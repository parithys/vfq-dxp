<meta charset="utf-8">
<title>VFQ General (Agent-Agnostic) Journey — Requirements Register</title>
<style>
:root{
  --charcoal:#25282b; --charcoal-2:#1a1c1e;
  --panel:#ffffff; --line:#d8d8d8; --ink2:#4a4d4e; --accent:#e60000;
  --ink:#111; --mute:#5A5A66; --navy:#2A1B9E;
  --radius-button:2px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:90;
  background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));
  color:#f4f4f4;padding:var(--space-5) var(--space-6) var(--space-4)}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hgroup{display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.h1main{font-size:24px;font-weight:800;color:#fff;line-height:1.25}
.h1sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.72);line-height:1.3;margin-top:1px}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.arow{display:flex;align-items:center;gap:var(--space-2)}
.btn,.phaseselect{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:var(--radius-button);padding:var(--space-2) var(--space-3);
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover,.phaseselect:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.phaseselect{min-width:190px;padding-right:22px}
.searchctrl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius-button);padding:0 var(--space-3);height:31px}
.searchctrl input{border:0;outline:0;font-size:12px;font-weight:600;color:var(--ink2);
  width:200px;font-family:inherit;background:none}
.searchctrl.no-match input{color:var(--accent)}
.hits{font-size:11px;font-weight:700;color:var(--mute);min-width:52px;text-align:right}
.expwrap{position:relative}
.expmenu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-button);box-shadow:0 18px 44px rgba(0,0,0,.22);display:none;z-index:120;min-width:180px}
.expmenu.open{display:block}
.expmenu button{display:block;width:100%;text-align:left;border:0;background:none;
  padding:9px 14px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.expmenu button:hover{background:#f2f2f2;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:rgba(255,255,255,.76);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
i{width:13px;height:13px;display:inline-block;flex:none}
.dot{border-radius:50%}
.dia{background:#fff;border:2px solid #2A1B9E;transform:rotate(45deg);width:10px;height:10px}
.ring{border-radius:50%;background:#0F9B8E;box-shadow:0 0 0 2px var(--charcoal-2) inset,0 0 0 3px #0F9B8E}
.sq{border-radius:4px;background:#7A2BD6}
.dash{height:0;border-top:2px dashed #3B7DD8;width:18px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.chipd{background:none;border:1px dashed rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.scroll{overflow-x:auto;overflow-y:hidden;padding:0 0 28px}
.scroll svg{display:block}
#printdoc{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.printing>header,body.printing>.scroll{display:none!important}
  body.printing #printdoc{display:block}
  /* one printed sheet per slice: fixed page box, SVG letterboxes itself inside it */
  .pg{break-after:page;page-break-after:always;
      height:100vh;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pgcap{flex:none}
  .pg svg{flex:1;min-height:0;width:100%;height:100%}
  .pgcap{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9pt;color:#333;border-bottom:1px solid #ccc;
    padding-bottom:2mm;margin-bottom:3mm}
  .pgcap b{font-weight:800}
}
</style>
<header>
  <div class="hrow">
    <div class="hgroup">
      <div class="eyebrow">BPMN Process Flow</div>
      <div class="h1main">VFQ General (Agent-Agnostic) Journey</div>
      <div class="h1sub">Requirements Register</div>
    </div>
    <div class="actions">
      <div class="arow">
        <select class="phaseselect" id="phaseSel" aria-label="Jump to phase"></select>
        <div class="expwrap">
          <button class="btn primary" id="expBtn">Export</button>
          <div class="expmenu" id="expMenu">
            <button data-fmt="svg">Export as SVG (vector)</button>
            <button data-fmt="png">Export as PNG</button>
            <button data-fmt="pdf">Export as PDF (paginated)</button>
          </div>
        </div>
      </div>
      <div class="arow">
        <span class="hits" id="hits"></span>
        <div class="searchctrl" id="searchCtrl">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#6f7375" stroke-width="1.8">
            <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search node…" autocomplete="off">
        </div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#2A1B9E"></i> Primary-path step</span>
    <span><i class="dia"></i> Decision / validation</span>
    <span><i class="ring"></i> Milestone</span>
    <span><i class="dot" style="background:#F01010"></i> Error / rejection — journey ends</span>
    <span><i class="dot" style="background:#C07800"></i> Recovery, retry or side flow</span>
    <span><i class="sq"></i> Escalation / approval task</span>
    <span><i class="dot" style="background:#12A038"></i> Happy-path branch label</span>
    <span><i class="dash"></i> Data flow</span>
    <span><i class="chip"></i> System / actor tag</span>
  </div>
</header>

-end="url(#aha)"/><text x="12049" y="215.0" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 12049 215.0)" text-anchor="middle">Validation failed / corrective action -&gt; agent amends cart</text><path d="M 13660 233 L 13660.0 582" fill="none" stroke="#F01010" stroke-width="2.2" marker-end="url(#ahr)"/><text x="13649" y="407.5" font-size="11" font-weight="700" fill="#F01010" transform="rotate(-90 13649 407.5)" text-anchor="middle">Payment failure / retry</text><text x="13860.0" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Payment successful</text><path d="M 13660.0 582 L 13660 233" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="13649.0" y="407.5" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 13649.0 407.5)" text-anchor="middle">Retry payment</text><text x="14262.0" y="204" font-size="11" font-weight="700" fill="#12A038" text-anchor="middle">Order submitted</text><path d="M 14060 233 L 14060 213.2 L 13660 213.2 L 13660 197" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="14049" y="215.0" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 14049 215.0)" text-anchor="middle">Payment failed -&gt; save Draft</text><g id="hl"></g>

<script>
const NODES=[{"id": "start", "x": 60, "y": 215, "r": 22, "lb": "Agent Initiates Journey", "t": "1 agent initiates journey agent begins a customer journey (retail, telesales, fulfillment, or direct sale/mass market channel). agent"}, {"id": "jsm_001", "x": 460, "y": 215, "r": 20, "lb": "Agent Access Management", "t": "2 agent access management agn_gen_seq_001 1. system shall authenticate the agent using configured identity and access management services before granting access to any journey, validate credentials, and deny access when authentication fails.\n\n2. system shall authorize journey initiation and control view, edit and submit permissions based on assigned roles and privileges, \n\n3. system shall restrict agents without the required privilege, based on role and access from initiating a journey. agent"}, {"id": "jsm_002", "x": 860, "y": 215, "r": 20, "lb": "Agent Access Management", "t": "3 agent access management agn_gen_seq_002 system shall maintain agent session details including agent id, channel id and login timestamp. system (vfq platform)"}, {"id": "jsm_003", "x": 1260, "y": 215, "r": 20, "lb": "Channel and Queue Context", "t": "4 channel and queue context agn_gen_seq_003 1. system shall receive journey context from qnomy, cti calls and email interactions before journey initiation; \n\n2. associate the q-ticket number, service type and available interaction attributes with the journey and tracking record; \n\n3. system shall continue journey processing using configured fallback rules when qnomy is unavailable. system (vfq platform)"}, {"id": "jsm_004", "x": 1660, "y": 215, "r": 20, "lb": "Tracking Record Management", "t": "5 tracking record management agn_gen_seq_004 1. system shall automatically create a tracking record upon successful journey initiation, generate a unique tracking reference number, and populate mandatory attributes including journey reference, agent id, channel, service type and timestamp.\n\n2. system shall permit resolution only after all mandatory journey validations are complete and automatically close the tracking record after successful journey completion and downstream processing.\n\n3. system shall maintain a complete audit history of tracking-record changes. system (vfq platform)"}, {"id": "cam_001", "x": 2060, "y": 215, "r": 20, "lb": "Customer Search and Matching", "t": "6 customer search and matching agn_gen_seq_005 modification flow:\n1. the system shall provide the agent with a customer-search function.\n2. the system shall support contact number, msisdn, account id,qid, passport number,gcc id and diplomatic id as a customer-search criterion.\n3.  the system shall display an error message when customer-search results cannot be retrieved.\n4. the system shall allow the agent to clear the selected criterion and entered search value.\n5. the system shall allow the agent to select exactly one customer record from the multiple records retrieved search results.\n\nactivation flow:\n1. the system shall provide the agent with a customer details after matching the ids (qid, passport number,gcc id and diplomatic id).\n2. the system shall create a new customer incase there is no match with the id type, id number and nationality agent"}, {"id": "cam_002", "x": 2460, "y": 215, "r": 20, "lb": "Navigation to Customer 360", "t": "7 navigation to customer 360 agn_gen_seq_006 1. the system shall enable navigation to customer 360 only after a customer record has been selected.\n2. the system shall open customer 360 for the active selected-customer context.\n3. the system shall display the following customer account information for the selected customer in customer 360:\na. contact information\nb. customer-segmentation information \nc.service information associated \n4. the system shall allow the agent to refresh customer 360 page to fetch the latest information for the active selected customer. agent"}, {"id": "cam_003", "x": 2860, "y": 215, "r": 20, "lb": "Account Hierarchy", "t": "8 account hierarchy agn_gen_seq_007 1. the system shall retrieve the account hierarchy associated with the selected customer.\n2. the system shall display the account hierarchy in tree structure for the selected customer as customer  accounts -> billing account -> service account. \n3. the system shall allow the agent to expand , navigate and collapse to an account-hierarchy node.\n4. the system shall display information applicable to the active hierarchy level.\n5. the system shall display an error message when the account hierarchy cannot be retrieved. agent"}, {"id": "kyc_001", "x": 3260, "y": 215, "r": 20, "lb": "Identity Capture", "t": "9 identity capture agn_gen_seq_008 1. the system shall allow an authorised agent to select a supported identity-document type and capture the required document images, including front, back images, optional liveliness check (selfi of the customer) where the customer consents.\n\n2. the system shall submit the images, extract all available identity attributes - id type, id number, first name, last name, date of birth, nationality and id expiry date from the scanned document.\n\n3. the system shall display the captured images and extracted attributes to the agent and store the images, attributes and capture outcome as identity evidence in the customer journey context. agent"}, {"id": "kyc_002", "x": 3660, "y": 215, "r": 24, "lb": "Identity Capture", "t": "10 identity capture agn_gen_seq_009 1. the system shall prevent journey progression when a required image or identity attribute is missing, or when image capture or automated extraction is unsuccessful.\n\n2. the system shall allow the agent to re-scan the identity document after an unsuccessful capture or extraction attempt and retain the latest successful images and attributes.\n\n3. when automated verification is unavailable or remains unsuccessful after the permitted attempts, the system shall allow an authorised agent to capture the identity information manually under the configured fallback conditions. agent"}, {"id": "kyc_003", "x": 4060, "y": 215, "r": 24, "lb": "Government Identity Verification and Reconciliation", "t": "11 government identity verification and reconciliation agn_gen_seq_010 1. the system shall compare each captured identity attribute with the corresponding id verification system attribute and store the attribute-level results and overall reconciliation result.\n\n\n2. the system shall evaluate the identity status and permit journey progression only when the status is acceptable; \n\n3. journey progression shall be permitted only when all mandatory identity attributes satisfy the configured reconciliation criteria and \n\n4. the system shall allow the journey based on identity status if acceptable, allow the agent to re-scan the document or terminate the journey according to the permitted actions.\n\n5. following identity re-capture, the system shall submit the latest identity information for verification and reconciliation again while retaining previous attempts in the audit history. external systems"}, {"id": "kyc_004", "x": 4460, "y": 215, "r": 20, "lb": "Government Identity Verification and Reconciliation", "t": "12 government identity verification and reconciliation agn_gen_seq_011 1. the system shall preserve the captured images and attributes reconciled with moi attributes.\n\n2. the system shall derive and store the applicable nationality-risk indicator using the authoritative nationality returned by moi and the active nationality-risk configuration external systems"}, {"id": "kyc_005", "x": 4860, "y": 215, "r": 24, "lb": "Government Identity Verification and Reconciliation", "t": "13 government identity verification and reconciliation agn_gen_seq_012 1. when moi is unavailable or does not respond within the configured period, preserve the captured identity information, and save the journey as pending government verification or draft.\n\n2. final order submission shall remain blocked until moi verification is completed successfully.\n\n3. the system shall support automatic retry of moi verification during order submission for the pending journey.\n\n4. if successfully verified, update the result and allow the journey to continue subject to all other validations. external systems"}, {"id": "ecc_001", "x": 5260, "y": 215, "r": 20, "lb": "Blacklist Management", "t": "14 blacklist management agn_gen_seq_013 existing customers:\n1. the system shall receive blacklist customer data from data warehouse system through the configured batch interface for existing customers. blacklist feed is received and processed successfully. invalid records are logged.\n2. the system shall insert and update blacklist customer information received from data warehouse system into the customer blacklist repository. \n3. the system shall retain historical blacklist information including changes to status, source and reason. historical records remain available for audit purposes.\n4. the system shall validate existing customers against the customer blacklist repository during customer retrieval and transaction initiation. repository lookup is performed prior to transaction continuation.\n5. the system shall receive and record blacklist information generated through collections processing due to non-payment in colllections state.\n6. the system shall allow fraud team users to create blacklist entries, capturing the source, reason, user, date and time for audit purposes. external systems"}, {"id": "ecc_002", "x": 5660, "y": 215, "r": 24, "lb": "Blacklist Management", "t": "15 blacklist management agn_gen_seq_014 new customers: \n1. the system shall perform blacklist validation for new customers. \n2. the system shall receive blacklist validation results from credit control and store  information in customer blacklist repository. \n\nblacklist status check:\n3. the system shall prevent/permit customer onboarding or transaction completion depending on the blacklist status. external systems"}, {"id": "ecc_003", "x": 6060, "y": 215, "r": 20, "lb": "Blacklist Management", "t": "16 blacklist management agn_gen_seq_015 1. the system shall associate every blacklist record with a blacklist reason code, originating source, description ,effective date. system (vfq platform)"}, {"id": "ecc_004", "x": 6460, "y": 215, "r": 20, "lb": "Credit Limit Management", "t": "17 credit limit management agn_gen_seq_016 1.the system shall determine and assign the initial account-level credit limit based on the business-configured credit limit matrix using customer segment.\n2.the system shall display the current credit limit maintained at customer account level. system (vfq platform)"}, {"id": "ecc_005", "x": 6860, "y": 215, "r": 24, "lb": "Credit Limit Management", "t": "18 credit limit management agn_gen_seq_017 1.the system shall allow an authorized credit and collections user to override the determined credit limit within the user\u2019s configured authority. \n2.an authorized user can submit an override within the applicable threshold; unauthorized or above-threshold changes are prevented or routed for approval.\n3.the system shall initiate an approval workflow when the requested credit limit exceeds the requestor\u2019s authority threshold. the limit is not applied until an authorized approver approves the request; rejection records the approver and reason.\n4.the system shall maintain an audit trail for credit limit creation, modification, approval, rejection, and synchronization. the audit record captures the account, previous value, requested value, applied value, action, user, date and time, reason, and outcome. agent"}, {"id": "ecc_006", "x": 7260, "y": 215, "r": 20, "lb": "Credit Limit Management", "t": "19 credit limit management agn_gen_seq_018 1. the system shall support an applicable credit limit increase based on a confirmed advance payment from customer . the additional limit is applied only after advance payment confirmation and is associated with the relevant account.\n\n2. the system shall send an approved credit limit to the billing platform and update the account with the processing outcome. billing confirms successful processing and the account displays the approved value; external systems"}, {"id": "ecc_007", "x": 7660, "y": 215, "r": 24, "lb": "Commitment Break Penalty Calculation", "t": "20 commitment break penalty calculation agn_gen_seq_019 1.the system shall validate active commitments such as  plan lock-in conditions,star number lock in conditions and device lock in conditions  before processing a migration, downgrade  or termintaion request.\n2.the system shall determine the remaining commitment duration by comparing the commitment end date with the requested transaction date.\n3.the system shall evaluate whether the requested transaction qualifies for a commitment break penalty based on product and contract.\n4.the system shall calculate the commitment break penalty using configurable business rules and tariff-specific formulas. system (vfq platform)"}, {"id": "ecc_008", "x": 8060, "y": 215, "r": 20, "lb": "Commitment Break Penalty Calculation", "t": "21 commitment break penalty calculation agn_gen_seq_020 1.the system shall display the calculated penalty amount to the agent to customer  for each respective committement break (plan lock in , star number lock in , device lock in)prior to order confirmation. agent"}, {"id": "bam_001", "x": 8460, "y": 215, "r": 20, "lb": "Billing Account and Payment Profile Management", "t": "22 billing account and payment profile management agn_gen_seq_021 1. the system shall allow agent to create a new billing account or select an existing account for eligible customers.\n2. the system shall allow agent to capture billing information \n- contatct (primary & secondary)\n- preferred invoice recipient contact\n- new or existing billing address\n- bill cycle\n- payment profile, validate payment profile, update payment profile\n3. the system shall allow the retail agent to capture payment profile details covering payment method, payment type and billing frequency. the system should only allow credit card & debit card for auto debit.\n4. the system shall validate the captured payment details and shall update the payment profile only following successful validation. the system shall capture last 4 digit of card & token number generated from payment gateway in the payment profile. agent"}, {"id": "bam_002", "x": 8860, "y": 215, "r": 24, "lb": "Billing Account and Payment Profile Management", "t": "23 billing account and payment profile management agn_gen_seq_022 the system shall validate if the billing account and payment profile selected meets the order journey rules else throw relevant error to agent system (vfq platform)"}, {"id": "num_001", "x": 9260, "y": 215, "r": 20, "lb": "Number Discovery and Qualification", "t": "24 number discovery and qualification agn_gen_seq_023 the system shall retrieve and auto-populate customer reserved numbers which are eligible for the journey system (vfq platform)"}, {"id": "num_002", "x": 9660, "y": 215, "r": 20, "lb": "Number Discovery and Qualification", "t": "25 number discovery and qualification agn_gen_seq_024 the system shall allow agent to search and select free numbers, star number or fixed line numbers based on the journey or customer choice agent"}, {"id": "num_003", "x": 10060, "y": 215, "r": 24, "lb": "Number Discovery and Qualification", "t": "26 number discovery and qualification agn_gen_seq_025 the system shall validate star number eligibility based on business rules. system (vfq platform)"}, {"id": "num_004", "x": 10460, "y": 215, "r": 20, "lb": "Number Reservation", "t": "27 number reservation agn_gen_seq_026 the system shall reserve selected number during order processing and release the number if draft order is expired or cancelled system (vfq platform)"}, {"id": "num_005", "x": 10860, "y": 215, "r": 20, "lb": "Number Reservation", "t": "28 number reservation agn_gen_seq_027 the system shall display selected number details, upfront charges and commitment period to agent for customer confirmation before submission. agent"}, {"id": "sim_001", "x": 11260, "y": 215, "r": 20, "lb": "SIM and eSIM Lifecycle Management", "t": "29 sim and esim lifecycle management agn_gen_seq_028 1. the system shall allow agent to select appropriate sim type during journey initiation.\n2. the system shall allow agent to capture physical sim/printed esim details.\n3. the system shall assign sim to the customer service.\n4. the system shall generate virtual esim and deliver virtual esim information to the customer through email or sms after order fulfillment agent"}, {"id": "sim_002", "x": 11660, "y": 215, "r": 24, "lb": "SIM and eSIM Lifecycle Management", "t": "30 sim and esim lifecycle management agn_gen_seq_029 1. the system shall validate sim serial number, iccid, status and availability and throw and error to agent in case of any issue\n2. the system shall reserve the sim from the inventory and mark it consumed after fulfillment\n- esim and virtual sim must be depleted from uim inventory\n- physical sim must be depleted from wincash and uim inventory system (vfq platform)"}, {"id": "cvc_001", "x": 12060, "y": 215, "r": 24, "lb": "Cart Validation, Review and Payment Preparation", "t": "31 cart validation, review and payment preparation agn_gen_seq_030 1. the system shall validate customer eligibility -customer account status, billing profile availability and completeness , payment profile availability and completeness  prior to checkout.\n2.the system shall validate that the selected assets are eligible for modification, migration, suspension, resumption, or termination.\n3. the system shall execute compatibility validations and quantity validations for products included in the cart.\n4. the system shall validate that the requested msisdn and simor esim is available for allocation.\n5. the system shall validate the availability of requested equipment and devices included in the order.\n6. the system shall validate that all mandatory appointment requirements have been fulfilled for fulfilment-related orders.\n7. the system shall calculate applicable recurring and non-recurring charges, deposits and advance payments, penalties and termination charges.\n8. the system shall present an itemized order and payment summary before confirmation.\n9.the system shall prevent checkout if any mandatory validation returns a failure status and corresponding corrective actions to be displayed to the user before order submission. system (vfq platform)"}, {"id": "caf_001", "x": 12460, "y": 215, "r": 20, "lb": "Key Information Management", "t": "32 key information management agn_gen_seq_031 1. the system shall generate and display key information before caf submission to the agent and customer.\n2. the key information shall include the connection type, service type, selected product, associated resources, selected plan, plan lock-in period, star number, star number lock-in period, device instalment details, and device instalment lock-in period, as applicable as per the cart of the journey.\n3. the system shall refresh the displayed key information whenever the agent adds, removes, or amends an item in the cart, key information must be consistent with the final validated cart. agent"}, {"id": "caf_002", "x": 12860, "y": 215, "r": 20, "lb": "Contract Generation, Signature and Distribution", "t": "33 contract generation, signature and distribution agn_gen_seq_032 1. the system shall use the applicable caf template using the configured mapping for journey, product type, service type, agent role, and channel and generate the caf related to the ongoing journey with all information like customer, account, service, product, resources.\n\n2. the system shall prevent caf generation where mandatory caf information is unavailable.\n\n3. the system shall allow the authorised agent to select the applicable digital signature-capture method - 1. customer-facing touchpad and 2. touch-screen device options.\n\n4. the system shall display the complete caf to the customer on the selected customer-facing device, customer shall be able to review the caf before signature capture.\n\n5. the system shall capture the customer signature through the selected signature device, captured signature must be embedded in caf, signed caf should be visible to agent.\n\n6. the system shall detect and report signature-capture failure, shall allow for recapturing if required, system shall allow to proceed until caf submission is completed.\n\n7. the system shall allow an agent to upload a manually signed caf during caf submission, acceptable format is pdf or jpg limited of 2 mb maximum size of a document. customer"}, {"id": "pay_001", "x": 13260, "y": 215, "r": 20, "lb": "Payment Summary, Processing and Receipt Management", "t": "34 payment summary, processing and receipt management agn_gen_seq_033 the system shall display a consolidated payment summary showing all applicable charges prior to payment confirmation.\n- hrn advance\n- star number charges\n- credit limit enhancement charges\n- plan downgrade penalty\n- plan commitment breakin penalty\n- migration charges\n- sim card charges\n- plan and add-on charges\n- additional device charges agent"}, {"id": "pay_002", "x": 13660, "y": 215, "r": 24, "lb": "Payment Summary, Processing and Receipt Management", "t": "35 payment summary, processing and receipt management agn_gen_seq_034 1. the system shall create and send a payment request to the payment collection system for all applicable order charges\n2. the system shall prevent duplicate payment collection for the same chargeable event.\n3. the system shall validate payment status returned by the payment collection system before continuing order processing.\n4. the system shall handle payment failures\n5. the system should hold the order and does not allow submission untill the payment is completed\n6. the system shall generate a payment receipt after successful payment collection even for the zero payments external systems"}, {"id": "ord_001", "x": 14060, "y": 215, "r": 24, "lb": "Order Visibility and Status Management", "t": "36 order visibility and status management agn_gen_seq_036 1. the system shall submit the order once the payment is succesful, in case of payment failure system save the order in draft\n2. the system shall receive the order status and display it within the customer 360\n3. the system shall mark the order status based on the response from fullfillment system\n4. the system shall display error reasons in case of order failure external systems"}, {"id": "not_001", "x": 14460, "y": 215, "r": 20, "lb": "Notification Trigger, Template and Channel Management", "t": "37 notification trigger, template and channel management agn_gen_seq_037 1.the system shall support configuration of notification events, templates, recipients, languages and channels.\n2.the system shall trigger the applicable communication template based on the notification event type .\n3.the system shall determine the communication language and delivery based on customer preference.\n4.the system shall populate dynamic template attributes using transaction, customer, account, and service data.\n5.the system shall record communication delivery status updates including sent, delivered, failed, and pending statuses.\n6.the system shall maintain a notification history for customer communications generated as part of the transaction lifecycle. external systems"}, {"id": "not_002", "x": 14860, "y": 215, "r": 20, "lb": "Feedback Management", "t": "38 feedback management agn_gen_seq_038 1.the system shall send the customer feedback survey request to \"customer survey\" system once the ticket associated with the respective journey is resolved. external systems"}, {"id": "end_success", "x": 15260, "y": 215, "r": 27, "lb": "Journey Completed", "t": "39 journey completed order submitted to fulfillment, feedback survey requested; journey lifecycle complete. external systems"}, {"id": "pay_003", "x": 13660.0, "y": 595, "r": 19, "lb": "Payment Summary, Processing and Receipt Management", "t": "payment summary, processing and receipt management agn_gen_seq_035 1. the system shall allow agent to retry the payment during the payment failures\n2. the system shall enforce a configurable limit on failed payment attempts.\n3. the system shall capture all payment requests, responses, retries, cancellations, and refunds to be retained in the audit history. agent"}, {"id": "end_terminated", "x": 4060.0, "y": 595, "r": 18, "lb": "Journey Terminated", "t": "journey terminated journey terminated due to unacceptable identity status or blacklist status per permitted actions. agent"}], PHASES=[{"n": "Journey and Session Management", "x": 0}, {"n": "Customer Account Management", "x": 1860.0}, {"n": "Customer Identification and Verification", "x": 3060.0}, {"n": "Eligibility and Credit Control", "x": 5060.0}, {"n": "Billing and Account Management", "x": 8260.0}, {"n": "Number Management", "x": 9060.0}, {"n": "SIM Management", "x": 11060.0}, {"n": "Cart Validation and Check Out", "x": 11860.0}, {"n": "CAF Generation and Signature Capture", "x": 12260.0}, {"n": "Payment and Inventory", "x": 13060.0}, {"n": "Order Submission", "x": 13860.0}, {"n": "Notification and Feedback", "x": 14260.0}];
const scroll=document.getElementById('scroll'), hl=document.getElementById('hl'),
      q=document.getElementById('q'), sc=document.getElementById('searchCtrl'),
      hits=document.getElementById('hits'), sel=document.getElementById('phaseSel');

/* ---- Jump to phase ---- */
sel.innerHTML='<option value="">Jump to phase…</option>'+
  PHASES.map((p,i)=>`<option value="${p.x}">${i} · ${p.n}</option>`).join('');
sel.onchange=()=>{ if(sel.value!=='') scroll.scrollTo({left:+sel.value,behavior:'smooth'}); };

/* ---- Search ---- */
let matches=[], cur=-1;
const SVGNS='http://www.w3.org/2000/svg';
function ring(n,strong){
  const c=document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',n.r);
  c.setAttribute('fill','none'); c.setAttribute('stroke','#e60000');
  c.setAttribute('stroke-width',strong?4:2.5); c.setAttribute('opacity',strong?1:.55);
  hl.appendChild(c);
}
function paint(){
  hl.textContent='';
  matches.forEach((n,i)=>ring(n,i===cur));
}
function goto_(i){
  if(!matches.length) return;
  cur=(i+matches.length)%matches.length;
  const n=matches[cur];
  scroll.scrollTo({left:Math.max(0,n.x-scroll.clientWidth/2),behavior:'smooth'});
  paint(); hits.textContent=`${cur+1} / ${matches.length}`;
}
function run(){
  const t=q.value.trim().toLowerCase();
  if(t.length<2){ matches=[]; cur=-1; hl.textContent=''; hits.textContent='';
                  sc.classList.remove('no-match'); return; }
  matches=NODES.filter(n=>n.t.includes(t));
  sc.classList.toggle('no-match',matches.length===0);
  if(!matches.length){ hl.textContent=''; hits.textContent='0'; cur=-1; return; }
  cur=-1; goto_(0);
}
let deb; q.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(run,180);});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault(); matches.length?goto_(cur+(e.shiftKey?-1:1)):run();}
  if(e.key==='Escape'){q.value='';run();}
});

/* ---- Paginated PDF via the browser's own print-to-PDF (no external library, works offline) ---- */
function exportPDF(){
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  const SLICE=Math.round(H*1.50);                 // A4-landscape printable aspect
  const n=Math.ceil(W/SLICE);
  const doc=document.createElement('div'); doc.id='printdoc';
  for(let i=0;i<n;i++){
    const pg=document.createElement('div'); pg.className='pg';
    const cap=document.createElement('div'); cap.className='pgcap';
    cap.innerHTML='<b>VFQ General (Agent-Agnostic) Journey — Requirements Register</b>'+
                  '<span>Page '+(i+1)+' of '+n+'</span>';
    const c=el.cloneNode(true);
    const h=c.querySelector('#hl'); if(h) h.textContent='';
    c.removeAttribute('id'); c.removeAttribute('width'); c.removeAttribute('height');
    c.setAttribute('viewBox',(i*SLICE)+' 0 '+SLICE+' '+H);
    pg.appendChild(cap); pg.appendChild(c); doc.appendChild(pg);
  }
  document.body.appendChild(doc);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');doc.remove();
                  window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{window.print(); setTimeout(done,1500);},150);
}

/* ---- Export ---- */
const expBtn=document.getElementById('expBtn'), expMenu=document.getElementById('expMenu');
expBtn.onclick=e=>{e.stopPropagation();expMenu.classList.toggle('open');};
document.addEventListener('click',()=>expMenu.classList.remove('open'));
function svgBlob(){
  const el=document.getElementById('flow').cloneNode(true);
  el.querySelector('#hl').textContent='';
  el.setAttribute('xmlns',SVGNS);
  return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(el)],
                  {type:'image/svg+xml;charset=utf-8'});
}
function save(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
expMenu.onclick=e=>{
  const fmt=e.target.dataset&&e.target.dataset.fmt; if(!fmt) return;
  expMenu.classList.remove('open');
  const base='vfq-general-brsd-v1-0-process-flow';
  if(fmt==='svg') return save(svgBlob(),base+'.svg');
  if(fmt==='pdf') return exportPDF();
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  /* a very wide canvas at 1x can exceed browser canvas limits, so PNG renders at 0.5x */
  const k=0.5, img=new Image(), url=URL.createObjectURL(svgBlob());
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=W*k; cv.height=H*k;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{save(b,base+'.png');URL.revokeObjectURL(url);},'image/png');
  };
  img.onerror=()=>{alert('PNG export failed in this browser — use Export as SVG.');URL.revokeObjectURL(url);};
  img.src=url;
};
