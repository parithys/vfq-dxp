<style>
:root{
 /* ---- Vodafone Design System tokens ----------------------------------------------
    Variable NAMES are kept as-is (--pg, --sys, --ext, etc.) to avoid rewriting every
    var() reference across this file; only VALUES are remapped. Full rationale for every
    mapping — including which node types use official Vodafone tokens vs. retained or
    derived hues where Vodafone provides no equivalent — is in reference/DESIGN_SYSTEM.md. */

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
 color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* header */
/* Header/diagram gutter alignment: .top and .wrap previously used two different horizontal
   paddings (26px / 12px, later reconciled to 24px each after the tab bar sat between them
   using its own third value) — the header title and the diagram-shell border below it didn't
   line up on either edge, so the diagram looked "inset" relative to the header above it. Both
   now share one CONTENT_GUTTER (24px) so every horizontal edge on the page — header text,
   and the diagram-shell's own left/right border — sits on the same vertical grid line. (A tab
   strip and a toolbar row both used to sit between the two and each needed its own matching
   gutter; both have since been removed entirely, so only .top and .wrap remain in this
   alignment.) */
.top{background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));color:#f4f4f4;padding:18px 24px 14px;
 display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
/* Happy Flow and Export both live in the header now, aligned to the top-right corner as a
   group. Reset used to sit here too (between Happy Flow and Export), simply re-running the
   same width-first fit; it has been removed entirely, since with pan/zoom/drag all already
   removed there was nothing left for it to reset FROM — it was pure dead weight, even though
   harmless. Export used to sit in the diagram toolbar (alongside Reset, at the end); that
   toolbar has since been removed entirely (see the ".toolbar" comment further down), so this
   header group is the ONLY place any of these buttons live. flex-shrink:0 keeps the group
   from being compressed if the title is long. */
.top .header-actions{flex:none;display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;color:#fff;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ai);box-shadow:0 0 0 3px rgba(23,138,134,.25)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:9px;
 padding:7px 12px;min-width:96px}
.kpi b{display:block;font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.wrap{padding:18px 24px 60px}
/* .toolbar (Flow-type filter buttons + View Labels toggle) has been removed entirely — every
   connector kind is unconditionally visible with no filter UI (see the header-actions comment
   above), and connector labels are now always shown by default with no toggle either (see
   below). The diagram-section has no toolbar row above the canvas any more at all. */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:2px;
 padding:7px 11px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.exportwrap{position:relative;display:inline-block}
.exportmenu{position:absolute;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line);
 border-radius:6px;box-shadow:var(--shadow-raised);display:none;flex-direction:column;min-width:150px;z-index:60;overflow:hidden;padding:4px}
.exportmenu.open{display:flex}
.exportmenu button{padding:8px 12px;border:none;background:none;text-align:left;cursor:pointer;font-size:12.5px;
 color:var(--ink);border-radius:4px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.exportmenu button:hover{background:var(--accent);color:#fff}
.exportmenu button:hover .fmt-hint{color:rgba(255,255,255,.75)}
.exportmenu .fmt-hint{font-size:10.5px;color:var(--muted)}
/* .chip and the Flows filter it labelled have both been removed entirely — every connector
   kind is now unconditionally visible, with no toggle UI at all. */
/* diagram */
/* The shell's height is a fallback only — sizeHost()/fit() below drive it from the live
   viewport. Sizing is WIDTH-FIRST: scale = max(width-fill, height-fill), so the canvas
   always consumes 100% of the horizontal space available inside this container and can
   never be letterboxed. A wide model still overflows and scrolls horizontally; a tall one
   grows the shell vertically instead of shrinking to fit a fixed height. */
/* No outer wrapper framing: border, border-radius, background fill (the ruled-paper gradient
   plus solid panel colour), and box-shadow have all been removed — the shell used to read as
   a distinct bordered "card" sitting on the page; now only the individual lanes and their
   content are visible, with no enclosing box drawn around them at all. overflow-x/overflow-y
   are functional (they're what makes horizontal scroll and vertical growth work — see the
   comment above) and stay; everything else here was purely decorative framing. */
.diagram-shell{position:relative;width:100%;box-sizing:border-box;
 height:74vh;overflow-x:auto;overflow-y:hidden}
/* height above is only the pre-JS fallback — sizeHost() drives the real height from the live
   viewport so the shell can grow to keep a width-filled diagram's aspect ratio intact. */
#svgHost{width:100%;height:100%;display:block}
/* No frozen rows or columns: the lane gutter (left-hand lane names/hints) and the phase header
   (top row of phase badges) both scroll and pan naturally with the rest of the diagram, same
   as every node and connector — neither pins to an edge while the canvas moves beneath it. A
   prior version duplicated both as separate `position:sticky` HTML overlays layered on top of
   the SVG (true CSS sticky doesn't apply to child shapes inside an <svg> the way it does to
   HTML block elements, so pinning either one meant building an HTML twin of SVG content that
   already existed) — `#svgLaneGutter` and `#svgPhaseHeader`, both drawn once as part of the
   ordinary SVG content, are now simply left visible (no longer hidden behind `opacity:0` in
   favour of an HTML overlay) and there is no more sticky positioning, sync-on-pan/zoom JS, or
   HTML duplication of either one anywhere in this file. Both were already rendered exactly
   this way for exported files (which never had the sticky overlay to begin with); the live
   view now matches that same non-frozen behaviour instead of diverging from it. */
/* The legend footer is intentionally NOT part of this change — it stays sticky. It isn't a
   row or column of the diagram grid at all (unlike the lane gutter and phase header above,
   which ARE literally a frozen column and a frozen row); it's a floating UI footer, and
   leaving it inside the pannable/zoomable content would let a tall multi-lane diagram's
   "fit-to-height" scale shrink it to a near-illegible sliver (a 22-unit-tall row at 0.67x
   scale renders ~15px tall). #legendLayer (the SVG-drawn version) stays hidden live and is
   restored for exports, same pattern lane-gutter/phase-header used to follow before this
   change — the difference is the legend has a genuine reason to stay fixed at a readable size
   regardless of scroll or zoom, and the diagram's own rows/columns don't. */
/* Legend readability pass: font bumped 11px -> 12.5px (the smallest text on the whole canvas
   was previously the one piece of UI every reader depends on to decode the diagram), items are
   grouped into labelled clusters (Node types / Connector types) instead of one undifferentiated
   run, each on its OWN row rather than sharing one — a prior version used a flex-row container
   with inline-flex groups, so "Node types" and "Connector types" sat side by side whenever they
   both fit the available width, only stacking once genuinely overflowing; the spec calls for
   always-separate rows regardless of available width, so the container is now a flex COLUMN
   with each group as its own full-width flex row (items within a group still wrap onto
   additional lines if that one group alone needs more room than the canvas has). */
.legend-sticky{position:sticky;left:0;bottom:0;z-index:6;display:flex;flex-direction:column;
 gap:8px;background:rgba(255,255,255,.97);border-top:1px solid #eeeeee;
 padding:10px 14px;pointer-events:none}
.legend-sticky .lgd-item{display:inline-flex;align-items:center;gap:6px;font:600 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#333333;white-space:nowrap}
.legend-sticky .lgd-group{display:flex;align-items:center;flex-wrap:wrap;row-gap:6px;column-gap:16px}
.legend-sticky .lgd-cat{font:800 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--muted);
 text-transform:uppercase;letter-spacing:.08em;margin-right:2px;white-space:nowrap}
.legend-sticky svg{flex:none}
.node{cursor:pointer}
.node .box{stroke-width:1.5;transition:stroke .12s var(--ease-standard),stroke-width .12s var(--ease-standard),filter .12s var(--ease-standard)}
/* Selection uses the Vodafone brand-red accent (--accent, #e60000) rather than the signal-blue
   identity colour — the identity blue is already used pervasively for 'agent' node fill/stroke
   and portfolio-lane tints, so a selected node in that same hue had low figure/ground contrast
   against its own type colour and against nearby agent nodes. Brand red is reserved on this
   canvas almost exclusively for selection/selected-path emphasis and the header/phase-badge
   accents, so it reads immediately as "the thing that's active" rather than blending into the
   diagram's own colour vocabulary. Stroke width and glow radius are both increased over the
   previous blue treatment for stronger visual prominence at any zoom level.
   NOTE: DESIGN_SYSTEM.md previously documented this as a magenta stroke; that was aspirational
   and never matched the shipped engine (which used --pg blue). Brand-red is now the actual and
   documented behaviour — see DESIGN_SYSTEM.md "Node types" for the corrected spec. */
.node.selected .box{stroke:var(--accent) !important;stroke-width:4px !important;filter:drop-shadow(0 0 6px rgba(230,0,0,.65)) drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.node.selected{opacity:1 !important}
.node text{font-family:"Inter","Segoe UI",system-ui,sans-serif;pointer-events:none}
/* Minimum 14px font-size across the diagram canvas (nodes, connectors, lane gutter, phase
   headers, legend) for readability — every diagram-canvas text size that was previously below
   14px (node sub-labels at 9.5px, lane hints at 9px, edge labels at 9.5px, phase badge numbers
   at 9px, legend category captions at 9.5px, etc.) is now 14px. This does trade away the prior
   visual hierarchy some of these had (a node's own label and its smaller "sub" caption used to
   read at clearly different sizes; now both read at the same 14px) — that trade-off is the
   explicit, accepted cost of the minimum-size requirement, not an oversight. Node/shape
   dimensions in build_model.py's `sizes` dict were NOT enlarged to compensate: the existing
   measurement-driven wrap/truncate/fold logic (wrapTextPx(), truncatePx()) already adapts
   correctly to whatever font it's given, so nothing overflows a shape's boundary — a small
   node (a circle, a decision diamond) may now truncate its label more aggressively than before
   simply because the same physical space holds less 14px text than it held 9.5-11.5px text.
   That's an inherent, unavoidable consequence of enforcing a larger minimum inside fixed-size
   shapes, not a rendering defect. */
.node .lbl{font-size:14px;font-weight:600;fill:var(--ink)}
/* .node .sub (the reference/requirement-code caption under a node's label) has been removed
   entirely, along with the JS that rendered it — see the NODES.forEach loop. */
.edge{fill:none;stroke-linejoin:round;transition:opacity .15s var(--ease-standard),filter .15s var(--ease-standard)}
.edge.seq{stroke:var(--sys);stroke-width:1.7}
.edge.data{stroke:var(--pg);stroke-width:1.5;stroke-dasharray:5 4}
.edge.cond{stroke:var(--dec);stroke-width:1.6;stroke-dasharray:2 4}
.edge.esc{stroke:var(--esc);stroke-width:2}
.edge.err{stroke:var(--err);stroke-width:1.8;stroke-dasharray:4 4}
/* Connector labels went through two changes in successive rounds. A prior version carried a
   4.5px white stroke halo (via paint-order:stroke) as a background/pill effect to keep small
   text legible against whatever it crossed; that halo was then removed entirely (no stroke,
   no paint-order) in favour of italic, regular weight (not the original bold), reading as
   lighter, more unobtrusive annotation — but with the explicit, accepted trade-off that a
   label could now visually cross a connector line or another element behind it with nothing
   separating them. That trade-off was then reversed: the white background is back
   (`paint-order:stroke;stroke:#fff`), restoring legibility against crossed content, while the
   italic/regular-weight/dark-grey styling from the round in between is KEPT — only the
   background was asked to come back, not the original bold weight. The net result is a label
   that reads as lighter/secondary via its typography (italic, not bold) while still being
   fully legible against anything it happens to cross, via the restored white halo. */
.elabel{font-size:14px;font-style:italic;font-weight:700;fill:#4a4d4e;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
/* Inactive/background dimming for the hover-isolation interaction. Previously .12 opacity left
   unrelated nodes/edges clearly legible, which read as "everything is still part of the story"
   rather than "this is the isolated path" — the whole point of the interaction. Two changes,
   both required together:
   (1) opacity drops to .05 (near-invisible, never literally 0 so a reader can still tell there
       WAS other content, preserving orientation on a large canvas), and
   (2) a grayscale filter desaturates whatever residual pixels remain, so the faint background
       reads as "greyed-out context" rather than "full-colour content at low volume" — the two
       read very differently even at matched opacity. Never applied to .selected (see rule
       above) or to the active/highlighted path (.hl / .hlpath), which stay at full opacity and
       full colour so the active path has maximum contrast against the greyed-out rest. */
.dim{opacity:.05;filter:grayscale(1) brightness(1.15);transition:opacity .15s var(--ease-standard),filter .15s var(--ease-standard)}
.hl{opacity:1 !important;filter:none !important}
/* The active/highlighted path (hover-isolated edges) is redrawn in brand red at a heavier
   weight plus a soft glow — matching the selection treatment above — instead of merely
   thickening the edge's own type colour, which kept e.g. a pale amber escalation line looking
   washed out even at 3px. A single shared "this is the active thing" colour across both
   selection (nodes) and isolation (edges) is the fix for "poor visual prominence": the reader
   should never have to hunt for which path lit up. */
.edge.hlpath{stroke:var(--accent) !important;stroke-width:3.5 !important;filter:drop-shadow(0 0 3px rgba(230,0,0,.55)) !important}
.lanelabel{font-size:14px;font-weight:700;fill:#4a4d4e}
/* .lanehint restored — hints render inline again as additional rotated column(s) after the
   lane name's own column(s), per an explicit "display the sub-headings too" requirement. It
   was removed for a round in between (a vertical-orientation change initially left no room
   for a second element beside the rotated name at all) but that gap has been closed: see the
   lane-gutter rendering loop below for how name and hint columns now share one consistent
   column-layout scheme. Kept at the same 14px minimum every other canvas text respects. */
.lanehint{font-size:14px;fill:#6f7375}
.leglabel{font-size:14px;font-weight:600;fill:#333333}
.legcat{font-size:14px;font-weight:800;fill:#6f7375;letter-spacing:.08em}
.phasehdr{font-size:14px;font-weight:700;fill:#ffffff;dominant-baseline:middle}
/* .phasenum removed: the numbered badge circle it styled (a small red circle with the stage's
   1-based index) has been removed entirely from the phase header — stage headings now show
   only their name, per an explicit "remove the numeric prefixes" requirement. */
/* detail drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:390px;max-width:92vw;background:var(--panel);
 box-shadow:-18px 0 44px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .22s var(--ease-standard);z-index:80;
 display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.drawer .dh h3{font-size:15px}
.drawer .db{padding:16px 18px;overflow:auto}
.drawer .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;border:none;background:none}
.dsec{margin-bottom:14px}
.dsec .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:5px}
.dsec ul{margin:0;padding-left:16px}
.dsec li{margin-bottom:3px}
/* Incoming/Outgoing paths — a bordered two-column box replacing the previous separate
   "Comes after"/"Leads to" pill rows, matching a supplied reference layout. Kept in the
   drawer's existing sans-serif typography rather than switching to the reference's monospace
   face, since the rest of the drawer (and the rest of this skill's UI) is Inter/system-ui
   throughout — adopting the reference's STRUCTURE (bordered box, two columns, arrow + bold
   step name) without a wholesale typography change that would clash with everything else. */
.dsec-paths{border:1px solid #b8d4f5;background:#eef4fd;border-radius:8px;padding:14px 16px;
 display:flex;gap:20px;margin-bottom:14px}
.dsec-paths .col{flex:1;min-width:0}
.dsec-paths .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
 font-weight:700;margin-bottom:8px}
.dsec-paths .path-item{display:flex;gap:6px;align-items:baseline;margin-bottom:6px;font-size:13px;line-height:1.4}
.dsec-paths .path-item:last-child{margin-bottom:0}
.dsec-paths .arrow{color:var(--muted);flex:none}
.dsec-paths .path-item b{font-weight:700;color:var(--ink)}
.dsec-paths .path-item .detail{opacity:.7;font-weight:400}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px;margin:2px 4px 2px 0}
/* .t-portal is kept: the side drawer's own Stage/lane pills reuse it (the "Comes after"/
   "Leads to" chips that also used to reuse this class have since been replaced entirely by
   the bordered Incoming/Outgoing paths box above, which doesn't use .pill/.t-portal at all —
   see .dsec-paths). Everything else in this block (table styling, .tag color variants,
   .search, .count, .sec-h) was exclusively for the four removed tabs (Agent Inventory, Inputs
   & Outputs, Data Flow Matrix, Source Traceability) and their tables, which no longer exist
   anywhere in this document. */
.t-portal{background:#eeeeee;color:#1f1f1f}
.assum{background:#fef8e6;border:1px solid #fbe29e;border-radius:6px;padding:6px 10px;font-size:11.5px;color:#5d4400;display:inline-block;margin:2px 0}

04 / MPAR_001_JSM_05 / BR-002 / INT-01", "desc": "A Q Ticket is created in Qnomy for the selected service type and consumed by the agent from the queue, opening the bound journey. Where Qnomy is unavailable the journey proceeds and the Q Ticket reference is recorded as Not Available. Integration: INT-01 (Qnomy, REST over the MPI interface, synchronous, create/consume Q Ticket).", "phase": 2, "x": 662.0, "y": 110.0, "w": 176, "h": 100, "cx": 750.0, "cy": 160.0}, {"id": "jsm_tracking", "type": "control", "lane": "crm", "slot": 0, "label": "Automatic Tracking Record Creation", "sub": "MPAR_001_JSM_06 / MPAR_001_JSM_07 / BR-003", "desc": "A Tracking Record is created automatically on journey initiation, assigned to the initiating agent in New status; creation is rejected if any configured mandatory field is unpopulated. Status model: Tracking Record/Open/New (record created automatically at journey initiation) transitioning to Tracking Record/Open/In Progress (journey in progress against the assigned agent).", "phase": 3, "x": 899.0, "y": 790.0, "w": 206, "h": 100, "cx": 1002.0, "cy": 840.0}, {"id": "jsm_milestone", "type": "control", "lane": "crm", "slot": 0, "label": "Milestone Persistence & Draft Resume", "sub": "MPAR_001_JSM_08 / MPAR_001_JSM_09 / MPAR_001_JSM_10 / BR-004 / BR-005 / BR-006", "desc": "The journey milestone is persisted as a Draft Order on each successful stage validation. An agent may view and resume only Draft Orders that agent created. A Draft Order not submitted within the configured retention period (P-22, value to be confirmed) expires and its reservations are released. Status model: Order/Draft/In Progress (journey initiated, milestone saved, not yet submitted). Status model: Order/Draft/Expired (the draft retention period elapsed without submission; terminal).", "phase": 4, "x": 1151.0, "y": 790.0, "w": 206, "h": 100, "cx": 1254.0, "cy": 840.0}, {"id": "kyc_scan", "type": "agent", "lane": "agt", "slot": 0, "label": "Scan Identity Document", "sub": "MPAR_001_KYC_01 / MPAR_001_KYC_02 / MPAR_001_KYC_03 / BR-010 / BR-011 / INT-02", "desc": "Front page and back page are mandatory; liveliness capture is optional, subject to customer consent. Only QID, Passport, Diplomatic ID and GCC ID are accepted \u2014 any other document type is rejected. MADA ID may optionally be captured for special discount evidence. Integration: INT-02 (IDWise, synchronous REST, scan/extract identity attributes and liveliness).", "phase": 5, "x": 1403.0, "y": 310.0, "w": 206, "h": 60, "cx": 1506.0, "cy": 340.0}, {"id": "d_kyc_type", "type": "decision", "lane": "agt", "slot": 0, "label": "Permitted Document Type?", "branches": [{"label": "Permitted", "to": "kyc_rescan_check"}, {"label": "Unsupported", "to": "kyc_reject_type"}], "phase": 6, "x": 1683.0, "y": 290.0, "w": 150, "h": 100, "cx": 1758.0, "cy": 340.0}, {"id": "kyc_reject_type", "type": "error", "lane": "agt", "slot": 0, "label": "Journey Blocked \u2014 Unsupported Document", "phase": 7, "x": 1915.0, "y": 290.0, "w": 190, "h": 100, "cx": 2010.0, "cy": 340.0}, {"id": "kyc_rescan_check", "type": "decision", "lane": "agt", "slot": 1, "label": "Extraction Successful?", "sub": "MPAR_001_KYC_04 / BR-012", "desc": "Re-scan is permitted on extraction failure up to the configured maximum number of attempts (P-20, value to be confirmed).", "branches": [{"label": "Success", "to": "kyc_capture_attrs"}, {"label": "Failed", "to": "kyc_manual"}], "phase": 7, "x": 1935.0, "y": 430.0, "w": 150, "h": 100, "cx": 2010.0, "cy": 480.0}, {"id": "kyc_manual", "type": "agent", "lane": "agt", "slot": 0, "label": "Manual Capture Fallback", "sub": "MPAR_001_KYC_05 / BR-013", "desc": "Manual capture is permitted where IDWise fails or is unavailable after the configured maximum scan attempts; the capture source is recorded as Manual.", "phase": 8, "x": 2159.0, "y": 310.0, "w": 206, "h": 60, "cx": 2262.0, "cy": 340.0}, {"id": "kyc_capture_attrs", "type": "control", "lane": "agt", "slot": 0, "label": "Capture & label": "Match", "to": "kyc_moi_display"}, {"label": "Mismatch", "to": "kyc_mismatch"}], "phase": 13, "x": 3447.0, "y": 610.0, "w": 150, "h": 100, "cx": 3522.0, "cy": 660.0}, {"id": "kyc_mismatch", "type": "error", "lane": "agt", "slot": 0, "label": "Mismatch \u2014 Reject or Re-scan", "sub": "MPAR_001_KYC_13 / BR-021", "desc": "On mismatch the agent is offered to reject the application or return to ID capture and re-scan; the failing attribute is named in the message.", "phase": 14, "x": 3679.0, "y": 290.0, "w": 190, "h": 100, "cx": 3774.0, "cy": 340.0}, {"id": "kyc_rejected", "type": "end", "lane": "agt", "slot": 0, "label": "Application Rejected \u2014 Identity Mismatch", "phase": 0, "x": 196.0, "y": 290.0, "w": 100, "h": 100, "cx": 246.0, "cy": 340.0}, {"id": "kyc_moi_display", "type": "control", "lane": "agt", "slot": 1, "label": "Display MOI Attributes & Lock", "sub": "MPAR_001_KYC_14 / MPAR_001_KYC_16 / MPAR_001_KYC_19 / MPAR_001_KYC_20 / BR-014 / P-19", "desc": "ID Type, ID Number, Date of Birth, name fields, Nationality, Salutation and ID Expiry Date returned by MOI are displayed; the MOI validation timestamp is recorded. ID Expiry Date is sourced from MOI (superseding any IDWise-scanned value) since MOI is the only source that returns it. P-19: interim ID expiry derivation period is 365 days.", "phase": 14, "x": 3671.0, "y": 430.0, "w": 206, "h": 100, "cx": 3774.0, "cy": 480.0}, {"id": "d_kyc_status", "type": "decision", "lane": "agt", "slot": 0, "label": "ID Status Permits Journey?", "sub": "MPAR_001_KYC_15 / BR-022", "desc": "An active QID, Passport, GCC ID or Diplomatic ID permits New Connection and Modification. An expired QID permits Modification only. An expired Passport, GCC ID or Diplomatic ID permits no action.", "branches": [{"label": "Permitted", "to": "kyc_transfer_crm"}, {"label": "Not permitted", "to": "kyc_status_blocked"}], "phase": 15, "x": 3951.0, "y": 290.0, "w": 150, "h": 100, "cx": 4026.0, "cy": 340.0}, {"id": "kyc_status_blocked", "ty acklist & Collections Screening", "sub": "MPAR_001_ECC_04 / MPAR_001_ECC_05 / BR-043 / INT-05", "desc": "Journey progression is blocked where the customer status is returned as Blacklisted or In Collections. Integration: INT-05 (Billing System, synchronous, retrieve customer status and outstanding balance).", "phase": 32, "x": 8222.0, "y": 970.0, "w": 176, "h": 100, "cx": 8310.0, "cy": 1020.0}, {"id": "d_ecc_status", "type": "decision", "lane": "bill", "slot": 0, "label": "Customer Status Clear?", "branches": [{"label": "Clear", "to": "ecc_dues_threshold"}, {"label": "Blocked", "to": "ecc_failure_msg"}], "phase": 33, "x": 8487.0, "y": 970.0, "w": 150, "h": 100, "cx": 8562.0, "cy": 1020.0}, {"id": "ecc_dues_threshold", "type": "external", "lane": "bill", "slot": 1, "label": "Outstanding Dues Threshold", "sub": "MPAR_001_ECC_06 / MPAR_001_ECC_07 / BR-044", "desc": "Journey progression is blocked where the outstanding balance exceeds the configured threshold (P-02: 10 QAR standard, P-03: 100 QAR HRN, BR-044 status: Open). The agent may direct the customer to settle dues and the balance is re-evaluated before continuing.", "phase": 34, "x": 8726.0, "y": 1110.0, "w": 176, "h": 100, "cx": 8814.0, "cy": 1160.0}, {"id": "ecc_linecount", "type": "external", "lane": "bill", "slot": 0, "label": "Active Line Count & Ceiling", "sub": "MPAR_001_ECC_08 / MPAR_001_ECC_09 / MPAR_001_ECC_10 / BR-045", "desc": "The total active mobile voice connection count is retrieved. A Qatari, Safwa or Safwa Plus national is unrestricted (P-06). An expatriate QID holder may hold up to five connections, all of which may be Postpaid (P-04).", "phase": 35, "x": 8978.0, "y": 970.0, "w": 176, "h": 100, "cx": 9066.0, "cy": 1020.0}, {"id": "d_ecc_linecount_breach", "type": "decision", "lane": "bill", "slot": 0, "label": "Line Count Ceiling Reached?", "sub": "MPAR_001_ECC_11 / BR-045", "desc": "On breach a validation message is displayed and the agent may proceed subject to the approval task.", "branches" // Connector labels must participate in the SAME layout pass that positions everything else,
// not get dropped afterward at whatever gap the column grid already happened to leave. Every
// phase column boundary is a fixed LY.colw apart regardless of what has to be labelled across
// it — a label wider than that gap (e.g. "milestone: contact & eligibility" needing ~165px
// across a ~46px node-to-node gap) spills straight into the nodes on either side. This widens
// only the specific column boundaries that need it and shifts every column after them,

{

 lblCtx.font=ELABELFONT;
 const LABEL_CLEARANCE=16;   // clearance from each node edge, beyond the bare text width
 const extraGap={};          // extraGap[phase] = extra px this column boundary needs, if any
 FLOWS.forEach(f=>{
  if(!f.label) return;
  const a=NID[f.from], b=NID[f.to]; if(!a||!b) return;
  if(b.phase!==a.phase+1) return;   // only a directly-adjacent pair shares exactly one boundary
  const need=lblCtx.measureText(f.label).width+LABEL_CLEARANCE*2;
  const rawGap=b.x-(a.x+a.w);
  if(need>rawGap) extraGap[a.phase]=Math.max(extraGap[a.phase]||0, need-rawGap);

const svgLaneGutter=el('g',{id:'svgLaneGutter'});
LY.lanes.forEach((L,li)=>{

 // an earlier round's removal of the full-width tint. Lanes are separated purely by the

// phase headers

// several node columns (e.g. an "Eligibility" branch, or a buffer column reserved purely
// for connector routing clearance) — not several distinct stages. Rendering a separate
// badge+title pill per column repeated the same word 3-5x in a row and implied more phases

let scale=1,tx=0,ty=0;
// The lane gutter and phase header no longer need any JS sync at all — both are now ordinary,
// always-visible SVG content (#svgLaneGutter, #svgPhaseHeader) that pans and scales along with
// everything else inside the `vp` transform below, exactly like every node and connector. A
// prior version duplicated both as separate sticky HTML overlays that needed constant
// repositioning (syncLaneGutter()/syncPhaseHeader(), called from apply() on every pan/zoom) to
// stay visually aligned with the scrolling/zooming SVG beneath them — none of that exists any
// more, since there's nothing frozen left to keep in sync.
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
/* ---- responsive width-first sizing -------------------------------------------------
   The canvas must always consume 100% of the horizontal space inside .diagram-shell.
   The previous implementation fitted to the shell's fixed height ONLY and then let the
   <svg> element's width fall out of that scale, so any model whose aspect ratio was
   taller-per-unit-width than the shell rendered as a narrow column with dead white space
   beside it. Sizing is now driven by BOTH axes:

       sW = (availW - 2*PAD_X) / totalW      // scale that makes the content span the full width
       sH = (availH - 2*PAD_Y) / contentH    // scale that makes the content span the full height
       s  = max(sW, sH)                      // whichever fills its axis LAST — never letterboxed

   * A wide/flat model keeps its previous behaviour exactly (sH wins, the content overflows
     horizontally and the shell scrolls) — it already used the full width.
   * A tall/narrow model now takes sW: the diagram spans the entire width and the SHELL grows
     vertically to preserve the aspect ratio, rather than the diagram shrinking to fit a fixed
     height. Growing the shell (page scroll) instead of adding overflow-y keeps the sticky lane
     gutter, phase header and legend working unchanged — they pin against the shell's scrollport
     and would drift out of alignment if a second, vertical scroll axis were introduced here.
   * There is deliberately NO cap on how tall the shell may grow to honour sW. An earlier version
     capped growth at a multiple of the viewport budget as a guard against a "pathological aspect
     ratio", but that guard silently broke the width-fill goal it sat inside: whenever a real
     model's height demand exceeded the cap (any BPMN swimlane with many lanes and few phases —
     an ordinary shape, not a pathological one), the code reverted to a much smaller height-fit
     scale while STILL stretching the <svg> element to the full available width — drawing the
     actual content at a fraction of that width and leaving dead space beside it, i.e. exactly
     the bug width-first sizing exists to prevent. A tall page that scrolls vertically is the
     correct outcome for a tall/narrow model; it is not a failure mode to guard against.
   Aspect ratio is preserved in every branch: one uniform `scale`, no independent x/y stretch. */
const PAD_X=14, PAD_Y=22;                           // buffer kept on each edge (x trimmed: the
                                                    // horizontal axis is the scarce one here)
const CANVAS_PAD=PAD_X;                             // back-compat alias
const SHELL_MIN_H=340;                              // never collapse the canvas below usable height
function viewportBudget(shell){                     // usable height from the shell's top edge to the
                                                    // bottom of the viewport, measured live so the canvas
                                                    // is responsive to window size instead of a fixed vh
 const free=window.innerHeight-shell.getBoundingClientRect().top-24;   // 24px breathing room below
 return Math.max(SHELL_MIN_H,Math.round(free));}
function sizeHost(){
 const shell=svg.parentElement; if(!shell) return null;
 const availW=shell.clientWidth; if(!availW) return null;
 const contentW=LY.totalW;
 const contentH=LY._preLegendTotalH||LY.totalH;     // live view excludes the export-only legend extension
 const legendEl=document.getElementById('legendBar');
 const legendH=legendEl?legendEl.offsetHeight:0;    // reserved so the sticky legend never forces a scrollbar
 const budget=viewportBudget(shell);
 const sW=(availW-2*PAD_X)/contentW;
 const sH=(budget-legendH-2*PAD_Y)/contentH;
 let s=Math.max(sW,sH);                             // fill whichever axis is the binding constraint
 let shellH=Math.round(contentH*s+2*PAD_Y+legendH);
 shellH=Math.max(shellH,SHELL_MIN_H);
 shell.style.height=shellH+'px';
 const drawnW=contentW*s, drawnH=contentH*s;
 const w=Math.max(availW,Math.round(drawnW+2*PAD_X));    // >= the shell: 100% of the horizontal space
 const h=Math.max(shellH-legendH,Math.round(drawnH+2*PAD_Y));
 svg.style.width=w+'px'; svg.style.height=h+'px';
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);       // 1:1 px space so the vp transform fully controls scaling
 return {w,h,s,offX:Math.max(PAD_X,(w-drawnW)/2),offY:Math.max(PAD_Y,(h-drawnH)/2)};}
function fit(){const dim=sizeHost();if(!dim){requestAnimationFrame(fit);return;}
 scale=dim.s;tx=dim.offX;ty=dim.offY;apply();}      // centred within whatever slack remains
// Zoom controls (the +/- buttons, mouse-wheel zoom) and drag-to-pan have both been removed
// entirely — the diagram is fixed: it always renders at its computed width-first fit scale,
// at its computed centred position, with no way for the user to move or zoom it away from
// that. The "Reset" button (which used to sit in the header and simply re-ran this same
// fit()) has now been removed entirely too — with no pan/zoom/drag possible any more, there
// was never anything left for it to reset FROM, so the button itself was pure dead weight
// even though it was harmless. `fit()` is still called automatically on load and on resize
// (see the listeners below) — only the manual re-trigger button is gone.
svg.addEventListener('click',()=>clearHL());

// ---- export (SVG / JPG / PDF) — self-contained, offline
// Hardcoded literal hex here (not var()) is intentional: an exported .svg opened standalone

function exportSVGString(){
 const clone=svg.cloneNode(true);
 clone.setAttribute('viewBox',`0 0 ${LY.totalW} ${LY.totalH}`);
 clone.setAttribute('width',LY.totalW); clone.setAttribute('height',LY.totalH);

 // The legend is the only one of the three SVG-drawn overlays still hidden live (in favour of
 // its own sticky HTML footer, which has no equivalent in a static file) — the lane gutter and
 // phase header are ordinary, always-visible SVG content now (no frozen rows/columns), so
 // there's nothing left to restore for either of them here.
 const clonedLeg=clone.querySelector('#legendLayer'); if(clonedLeg) clonedLeg.style.opacity='';

 // that need them (Illustrator, Inkscape, print). Without this style, a browser
 // opening the .svg directly (not through this page's own CSS) renders it at
 // that literal size with no scale-to-fit — for a wide diagram that means only
 // the top-left corner is visible on load, requiring manual scroll/zoom even
 // though every node and connector is present in the file. This makes it size
 // itself to whatever it's opened in, same as the in-app canvas does.
 clone.setAttribute('style','width:100%;height:auto;max-width:100%;display:block;');
 const cvp=clone.querySelector('#vp'); cvp.setAttribute('transform','translate(0,0) scale(1)');

 const bg=document.createElementNS(SVGNS,'rect');
 bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',LY.totalW);bg.setAttribute('height',LY.totalH);bg.setAttribute('fill','#ffffff');
 cvp.insertBefore(bg,cvp.firstChild);
 const st=document.createElementNS(SVGNS,'style'); st.textContent=EXPORT_CSS;

}
function downloadBlob(blob,name){const a=document.createElement('a');const u=URL.createObjectURL(blob);
 a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},150);}
function rasterize(scaleFactor){return new Promise((resolve,reject)=>{
 const blob=new Blob([exportSVGString()],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob); const img=new Image();
 img.onload=()=>{const cw=Math.round(LY.totalW*scaleFactor),ch=Math.round(LY.totalH*scaleFactor);
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);
  URL.revokeObjectURL(url);resolve(cv);};

function jpegToPdf(jpeg,wPx,hPx){
 // Page size is DERIVED from the diagram's own aspect ratio (content + a fixed
 // margin), not forced onto a fixed A3 sheet. These diagrams are wide swimlane
 // layouts (often 5:1-7:1) — fitting that onto a fixed-height A3 page left the
 // image filling the width but only a thin vertical sliver, with huge blank
 // bands above/below. Sizing the page to the content instead means the image
 // always fills the full page (minus the margin), matching the JPG export.
 const margin=24, maxContent=1600;                   // generous content cap, points
 const aspect=wPx/hPx;
 let dW,dH;
 if(aspect>=1){ dW=maxContent; dH=dW/aspect; } else { dH=maxContent; dW=dH*aspect; }
 const pageW=dW+2*margin, pageH=dH+2*margin;
 const x=margin,y=margin;
 const enc=(s)=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff;return a;};
 const parts=[];let len=0;const off={};
 const push=(u8)=>{parts.push(u8);len+=u8.length;}; const ps=(s)=>push(enc(s));
 ps('%PDF-1.3\n%\xFF\xFF\xFF\xFF\n');
 const so=(n)=>{off[n]=len;};
 so(1); ps('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 so(2); ps('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
 so(3); ps(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n`);
 const content=`q\n${dW.toFixed(2)} 0 0 ${dH.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm\n/Im0 Do\nQ\n`;
 so(4); ps(`4 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
 so(5); ps(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
 push(jpeg); ps('\nendstream\nendobj\n');
 const xo=len; let xr='xref\n0 6\n0000000000 65535 f \n';
 for(let i=1;i<=5;i++) xr+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 ps(xr); ps(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
 const total=new Uint8Array(len);let o=0;for(const p of parts){total.set(p,o);o+=p.length;}

const FNAME='Agent_Ecosystem_Business_Process_Diagram';
const exBtn=document.getElementById('exportBtn'), exMenu=document.getElementById('exportMenu');
exBtn.addEventListener('click',(e)=>{e.stopPropagation();exMenu.classList.toggle('open');});
document.addEventListener('click',()=>exMenu.classList.remove('open'));
exMenu.addEventListener('click',(e)=>e.stopPropagation());
exMenu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
 const fmt=b.dataset.fmt; exMenu.classList.remove('open');
 const prev=exBtn.textContent; exBtn.textContent='Exporting…';
 const done=()=>{exBtn.textContent=prev;};
 try{
  if(fmt==='svg'){downloadBlob(new Blob([exportSVGString()],{type:'image/svg+xml;charset=utf-8'}),FNAME+'.svg');done();}
  else if(fmt==='jpg'){rasterize(2).then(cv=>cv.toBlob(bl=>{downloadBlob(bl,FNAME+'.jpg');done();},'image/jpeg',0.95)).catch(()=>{alert('Export failed.');done();});}
  else if(fmt==='pdf'){rasterize(2).then(cv=>cv.toBlob(bl=>bl.arrayBuffer().then(buf=>{downloadBlob(jpegToPdf(new Uint8Array(buf),cv.width,cv.height),FNAME+'.pdf');done();}),'image/jpeg',0.92)).catch(()=>{alert('Export failed.');done();});}
 }catch(err){alert('Export failed.');done();}
}));

requestAnimationFrame(()=>requestAnimationFrame(fit));
