// (.dim/.hlpath/.selected) or the Happy Flow display:none filter above: playback highlights must
// ACCUMULATE and PERSIST across ordinary hovering/clicking elsewhere on the canvas, and must
// never disappear on their own — only Reset clears them — which the hover/lock system explicitly
// does not guarantee (clearAllHL() runs constantly, on every mouseleave and background click).
// Using separate classes means the two systems literally cannot collide: clearAllHL() only ever
// touches .dim/.hlpath, never .hp-active/.hp-done, in either direction.
//
// The traversal itself walks the exact same single path happyOut()/happyNeighbor() above already
// define as "the" happy path (first FLOWS-array-order edge off each node where isHappyFlow(f) is
// true) — reusing that definition rather than inventing a second one, so playback always agrees
// with what Prev/Next in the drawer would also step through. A decision node with more than one
// edge marked happy (an equally-valid alternate branch, same as this engine's own Python
// counterpart used to build the standalone Happy-Path exports) is walked via whichever branch
// happens to be listed first in the model's own flows[] array — not a claim that the OTHER
// branch is somehow less happy, simply the one deterministic line a single linear playback has
// to pick.
function computeHappyPath(){
 const startNode=NODES.find(n=>n.type==='start');
 if(!startNode) return {path:[],edgeIdx:[]};
 const path=[startNode.id], edgeIdx=[], seen=new Set([startNode.id]);
 let cur=startNode.id;
 while(true){
  const f=happyOut(cur); if(!f) break;
  if(seen.has(f.to)) break;   // cycle guard — should not occur in a well-formed model, defensive only
  path.push(f.to); edgeIdx.push(FLOWS.indexOf(f)); seen.add(f.to); cur=f.to;
 }
 return {path,edgeIdx};
}
const HP=computeHappyPath();
let hpTimer=null, hpIndex=-1, hpState='idle';   // 'idle' | 'playing' | 'paused' | 'done'
const happyPlayBtn=document.getElementById('happyPlayBtn');
function hpClearHighlights(){
 nodeLayer.querySelectorAll('.hp-active,.hp-done').forEach(g=>g.classList.remove('hp-active','hp-done'));
 edgeEls.forEach(p=>{
  if(p.classList.contains('hp-done')){ p.classList.remove('hp-done'); p.setAttribute('marker-end',`url(#${p.dataset.marker})`); }
 });
}
// Advances the active-node marker to HP.path[idx]: demotes whatever was active to "done" (a
// completed step, not the current one — see the .hp-active/.hp-done CSS comment), marks the new
// node active, marks the connecting edge (if any — absent only for idx===0, the START node
// itself) as done, and pans/centres the canvas on it. Centring uses the same scrollNodeIntoView()
// every click-to-focus interaction uses, now smooth-scrolling (see its own comment), which is
// what gives playback its "presentation mode" panning feel.
function hpSetActive(idx){
 if(hpIndex>=0 && hpIndex<HP.path.length){
  const prevG=nodeG(HP.path[hpIndex]);
  if(prevG){ prevG.classList.remove('hp-active'); prevG.classList.add('hp-done'); }
 }
 hpIndex=idx;
 const id=HP.path[idx];
 const g=nodeG(id); if(g) g.classList.add('hp-active');
 if(idx>0){
  const p=edgeEls[HP.edgeIdx[idx-1]];
  if(p){ p.classList.add('hp-done'); p.setAttribute('marker-end','url(#ar-hp)'); }
 }
 scrollNodeIntoView(id);
}
function hpFinish(){
 if(hpTimer){ clearInterval(hpTimer); hpTimer=null; }
 // The END node's own brief moment as "active" ends here too — per "active state should be
 // removed... all Happy Path nodes must remain highlighted in their completed state", the final
 // node is demoted to .hp-done exactly like every node before it, leaving nothing still pulsing.
 const g=nodeG(HP.path[HP.path.length-1]);
 if(g){ g.classList.remove('hp-active'); g.classList.add('hp-done'); }
 hpState='done';
 happyPlayBtn.textContent='Play'; happyPlayBtn.classList.remove('on');
}
function hpAdvance(){
 if(hpIndex+1>=HP.path.length){ hpFinish(); return; }
 hpSetActive(hpIndex+1);
 if(hpIndex>=HP.path.length-1){ hpFinish(); }
}
function hpPlay(){
 if(HP.path.length<2) return;   // no usable happy path on this model — Play is a no-op
 if(hpState==='playing') return;
 if(hpState==='idle'||hpState==='done'){
  // Starting fresh (first-ever Play, or replaying after a completed run) — a completed run's
  // own accumulated highlights are cleared first so a replay starts from a genuinely blank
  // canvas, per "allowing the user to replay the journey if required".
  hpClearHighlights(); hpIndex=-1;
  hpState='playing'; happyPlayBtn.textContent='Pause'; happyPlayBtn.classList.add('on');
  hpSetActive(0);   // first node highlights immediately, not after the first 2s tick
  hpTimer=setInterval(hpAdvance,2000);
 } else if(hpState==='paused'){
  // Resume exactly where playback left off — hpIndex/highlights are untouched by Pause, so
  // simply restarting the interval continues the sequence rather than restarting it.
  hpState='playing'; happyPlayBtn.textContent='Pause'; happyPlayBtn.classList.add('on');
  hpTimer=setInterval(hpAdvance,2000);
 }
}
function hpPause(){
 if(hpState!=='playing') return;
 if(hpTimer){ clearInterval(hpTimer); hpTimer=null; }
 hpState='paused';
 happyPlayBtn.textContent='Play'; happyPlayBtn.classList.remove('on');
}
// Used by the header Reset button (further down) — stops any run in progress, clears every
// playback highlight (nodes AND connectors), and returns both the internal state and the canvas
// viewport to exactly how they looked before Play was ever clicked.
function hpResetToStart(){
 if(hpTimer){ clearInterval(hpTimer); hpTimer=null; }
 hpClearHighlights();
 hpIndex=-1; hpState='idle';
 happyPlayBtn.textContent='Play'; happyPlayBtn.classList.remove('on');
 if(HP.path.length) scrollNodeIntoView(HP.path[0]);
}
happyPlayBtn.addEventListener('click',()=>{ hpState==='playing' ? hpPause() : hpPlay(); });

// ---- Drawer Prev/Next node navigation — steps through the primary (happy) flow only, reusing
// HAPPY_NODE_IDS/isHappyFlow() immediately above rather than a second, separate notion of "the
// main path". Order follows the ACTUAL directed happy edges (f.from -> f.to), not visual
// canvas position — a node's row/column position is a LAYOUT decision (_barycenter_reorder()
// in build_model.py arranges same-phase, same-lane slots purely to minimise edge crossings) and
// does not reliably encode "happens before/after": two nodes sharing a phase and lane can be
// stacked in either visual order regardless of which one the flow data says comes first. An
// earlier version of this sorted by (phase, cy) and reliably got same-phase pairs backwards —
// e.g. "Next" from a node moved to the node stacked below it on canvas, which the flow data
// actually pointed to as the PRECEDING step, not the following one. Following the edges
// directly is the only source of truth for sequence; canvas position is not.
function happyOut(id){ return FLOWS.find(f=>f.from===id && isHappyFlow(f)); }
function happyIn(id){ return FLOWS.find(f=>f.to===id && isHappyFlow(f)); }
// Returns the neighbour NODE object (or null) in the requested direction — dir>0 walks forward
// along this node's own happy outgoing edge, dir<0 walks backward along its happy incoming
// edge. A node with no happy edge in that direction (a genuine start/end of the happy path, or
// a node that isn't on the happy path at all — e.g. an error/escalation step opened via an
// ordinary click) simply has no neighbour there; Prev/Next disables accordingly rather than
// guessing at an unrelated node to jump to.
function happyNeighbor(id,dir){
 const f=dir>0?happyOut(id):happyIn(id);
 if(!f) return null;
 const targetId=dir>0?f.to:f.from;
 return NID[targetId]||null;
}
// Pans the canvas (via the shell's native scroll, exactly what drag-to-pan and wheel-zoom both
// already drive) so the target node is centred in the current viewport — deliberately reusing
// the LIVE tx/ty/scale the user is already at, never resetting or recomputing them, so zoom
// level and everything else about the current view stays untouched apart from scroll position,
// per an explicit "shall not modify... zoom level, pan position... except as required to bring
// the selected node into view" requirement.
//
// The drawer is `position:fixed`, painted OVER the canvas rather than a layout sibling that
// shrinks it — .diagram-shell's own clientWidth is the FULL viewport width whether or not the
// drawer is open, since a fixed-position element is out of normal flow and never affects an
// ancestor's box size. Centring against that full width (the original behaviour) reliably
// landed the just-selected node exactly under the drawer's own left edge — precisely where the
// node being inspected right now most often ends up, since that's the last place the reader's
// attention was. The fix centres against only the UNCOVERED region instead: shell width minus
// however much of the right edge the open drawer's own rendered width currently occupies
// (measured live via getBoundingClientRect rather than trusting the drawerW/DRAWER_MIN_W JS
// variable, so this stays correct even if CSS's own max-width:92vw is the thing actually
// constraining the drawer's rendered width on a narrow viewport, not drawerW itself).
//
// Simply setting shell.scrollLeft is not sufficient on its own: sizeHost()'s single-axis-
// overflow fit (see its own comment) makes the SVG's rendered width EXACTLY match the shell's
// width whenever width is the binding/unconstrained axis (contentW*scale fits with no overflow
// — the common case for a tall, narrow swimlane diagram) — meaning scrollWidth===clientWidth
// and there is ZERO horizontal scroll range to move through, so no scrollLeft value can shift
// such a diagram at all, drawer or not. Reaching a target scrollLeft that exceeds the SVG's
// current scrollable range requires temporarily widening/heightening the SVG's own rendered
// canvas first — as trailing BLANK space past the real content, never by changing `scale` — to
// manufacture just enough real scroll room. This is the only way to satisfy "shall never be
// obscured... regardless" for a diagram that happens to have no natural slack on the axis that
// needs it; scale (zoom level) itself is never touched, only how much of the existing content
// the shell is ABLE to scroll to.
function scrollNodeIntoView(id){
 const n=NID[id]; if(!n) return;
 const shell=svg.parentElement; if(!shell) return;
 const svgX=tx+n.cx*scale, svgY=ty+n.cy*scale;
 const drawerCoversW=drawer.classList.contains('open')?drawer.getBoundingClientRect().width:0;
 const visibleW=Math.max(shell.clientWidth-drawerCoversW,0);
 const wantScrollLeft=Math.max(0,svgX-visibleW/2);
 const wantScrollTop=Math.max(0,svgY-shell.clientHeight/2);
 const neededW=Math.ceil(wantScrollLeft)+shell.clientWidth, neededH=Math.ceil(wantScrollTop)+shell.clientHeight;
 const curW=svg.clientWidth||0, curH=svg.clientHeight||0;
 if(neededW>curW||neededH>curH){
  svg.style.width=Math.max(curW,neededW)+'px';
  svg.style.height=Math.max(curH,neededH)+'px';
  svg.setAttribute('viewBox',`0 0 ${Math.max(curW,neededW)} ${Math.max(curH,neededH)}`);
 }
 // Smooth (not instant) scroll — reused by click-to-focus (every node click) and the Happy Path
 // Playback engine (below), both of which have an explicit "smooth transition, no abrupt
 // movement" requirement. Native scrollTo({behavior:'smooth'}) rather than a hand-rolled
 // requestAnimationFrame tween: the browser already handles interrupting/retargeting a smooth
 // scroll that's still in flight when the next call arrives (exactly what happens every 2s
 // during playback, or on a rapid double-click), so there's nothing this file needs to manage
 // itself. Falls back to an instant jump only if the browser has no scrollTo(options) support.
 if(shell.scrollTo){ shell.scrollTo({left:wantScrollLeft, top:wantScrollTop, behavior:'smooth'}); }
 else { shell.scrollLeft=wantScrollLeft; shell.scrollTop=wantScrollTop; }
}
// Undoes scrollNodeIntoView()'s temporary canvas widening (see its own comment on why that
// widening happens) once the drawer actually closes and the full shell width is available
// again — called from every place the drawer closes, below — otherwise a stray scrollbar past
// the diagram's own natural single-axis-overflow fit would linger long after the drawer that
// required the extra room is gone. fit() is idempotent here: shell dimensions haven't changed
// by closing the drawer (it's a fixed-position overlay, not a layout sibling — see
// scrollNodeIntoView()'s own comment), so this recomputes the exact same scale/tx/ty as before,
// only shrinking the SVG's own rendered size back down; the browser clamps scroll position to
// whatever the smaller bounds now allow.
function restoreNaturalCanvasSize(){
 svg.style.width=''; svg.style.height='';
 fit();
}
// Called at the end of every openDrawer() (see there) — not just from the nav buttons
// themselves — so the enabled/disabled state is always correct for whichever node the drawer
// currently shows, however it got there (plain click, dblclick, View Details click, or a prior
// Prev/Next step).
function syncDrawerNav(){
 const prevBtn=document.getElementById('d-prev'), nextBtn=document.getElementById('d-next');
 if(!prevBtn||!nextBtn) return;
 const prevTarget=happyNeighbor(selectedId,-1), nextTarget=happyNeighbor(selectedId,1);
 prevBtn.disabled=!prevTarget; nextBtn.disabled=!nextTarget;
 prevBtn.title=prevTarget?'Previous node (primary flow)':'No previous node on the primary flow';
 nextBtn.title=nextTarget?'Next node (primary flow)':'No next node on the primary flow';
}
function navigateDrawer(dir){
 if(!selectedId) return;
 const target=happyNeighbor(selectedId,dir);
 if(!target) return;
 // Same three calls the node-click handler itself makes for View Details mode (setSelected +
 // applyHL + openDrawer) — Prev/Next is functionally "click this other node while the drawer
 // stays open", so it reuses that exact combination rather than a parallel implementation.
 setSelected(target.id); applyHL(target.id); openDrawer(target); scrollNodeIntoView(target.id);
}

// ---- Jump to Phase: a plain <select>, replacing the former Actors dropdown entirely (a
// multi-select lane/actor VISIBILITY filter — `.actor-dim` opacity-faded whatever fell outside
// the current selection; see the removed applyActorFilter() this replaces for that feature's
// full former behaviour). This is pure navigation instead: it changes nothing's visibility or
// styling, it only scrolls. Options are populated from the same `phaseGroups` the phase-header
// loop above already computed — one per distinct phase, in diagram order, using the `x`/
// `spanW` geometry that loop stashes back onto each group — plus a leading "All" (already in
// the markup) that scrolls back to the canvas's own left edge instead of any particular phase.
const phaseJumpSel=document.getElementById('phaseJump');
// LY.phaseJumpLabels is an OPTIONAL model.json field (layout.phaseJumpLabels), a plain
// {fullPhaseName: shortDropdownLabel} map — display text for THIS select only, never touching
// grp.label itself (still the full phase name everywhere else: the on-canvas phase-header bar
// above, and the side drawer's Stage field, both read grp.label / LY.phases directly and are
// unaffected by this map). Added per an explicit "shorten only the dropdown options, not the
// section titles" requirement — a model with no phaseJumpLabels (or no entry for a given
// phase) falls straight back to the full grp.label exactly as before this existed.
const jumpLabels=LY.phaseJumpLabels||{};
phaseGroups.forEach((grp,gi)=>{
 const opt=document.createElement('option'); opt.value=String(gi); opt.textContent=jumpLabels[grp.label]||grp.label;
 phaseJumpSel.appendChild(opt);
});
// Centres the chosen phase's own column span in the shell's CURRENT viewport, at whatever pan/
// zoom (tx/scale, assigned by fit()/zoomAt() further down) the user already has — deliberately
// never recomputes or resets either, same "shall not modify... zoom level... except as required
// to bring the diagram into view" reasoning wheel-zoom's own comment cites for itself.
// Also centres vertically on that phase's OWN nodes (not just horizontally on its column span):
// a lane's height is uniform across the whole diagram (sized by whichever phase stacks the most
// nodes into it), so a phase with only one or two nodes concentrated in a single lane can sit far
// from wherever scrollTop already happens to be — e.g. a tall diagram merging several sub-journeys
// (one BRSD per Jump-to-Phase entry) where one entry has 16 nodes and another has 1. Horizontal-only
// centring left that case scrolled to a blank slice of an unrelated lane's empty vertical span for
// this phase. Reuses scrollNodeIntoView()'s canvas-widening safety net (below) since the same
// "target may exceed the currently-rendered svg box" possibility applies to either axis here too.
function jumpToPhase(val){
 const shell=svg.parentElement; if(!shell) return;
 if(val===''){ shell.scrollLeft=0; return; }
 const grp=phaseGroups[Number(val)]; if(!grp) return;
 const centerContentX=grp.x+grp.spanW/2;
 const targetSvgX=tx+centerContentX*scale;
 const wantScrollLeft=Math.max(0, targetSvgX-shell.clientWidth/2);
 const inPhase=NODES.filter(n=>n.phase>=grp.start && n.phase<=grp.end);
 let wantScrollTop=shell.scrollTop;
 if(inPhase.length){
  const cys=inPhase.map(n=>n.cy);
  const centerContentY=(Math.min(...cys)+Math.max(...cys))/2;
  const targetSvgY=ty+centerContentY*scale;
  wantScrollTop=Math.max(0, targetSvgY-shell.clientHeight/2);
 }
 const neededW=Math.ceil(wantScrollLeft)+shell.clientWidth, neededH=Math.ceil(wantScrollTop)+shell.clientHeight;
 const curW=svg.clientWidth||0, curH=svg.clientHeight||0;
 if(neededW>curW||neededH>curH){
  svg.style.width=Math.max(curW,neededW)+'px';
  svg.style.height=Math.max(curH,neededH)+'px';
  svg.setAttribute('viewBox',`0 0 ${Math.max(curW,neededW)} ${Math.max(curH,neededH)}`);
 }
 if(shell.scrollTo){ shell.scrollTo({left:wantScrollLeft, top:wantScrollTop, behavior:'smooth'}); }
 else { shell.scrollLeft=wantScrollLeft; shell.scrollTop=wantScrollTop; }
}
phaseJumpSel.addEventListener('change',()=>jumpToPhase(phaseJumpSel.value));

// ---- Node search: locate a node by its abbreviation (id or sub — e.g. "kyc01_reject" or
// "BR-002") or by free text (label or desc), then select + highlight + centre it — the exact
// same three primitives (setSelected/applyHL/scrollNodeIntoView) the plain click handler and
// View Details click already use, just driven by typed text instead of a click. Deterministic,
// not a toggle: searching the same node twice in a row leaves it selected both times, it never
// flips back off the way toggleLock()'s click behaviour would.
const nodeSearchInput=document.getElementById('nodeSearch');
function findNodeByQuery(q){
 const needle=q.trim().toLowerCase(); if(!needle) return null;
 // Exact id/abbreviation match first: typing a full id or sub in full should never lose to
 // some unrelated node whose much longer label merely happens to CONTAIN that same text.
 const exact=NODES.find(n=>n.id.toLowerCase()===needle || (n.sub&&n.sub.toLowerCase()===needle));
 if(exact) return exact;
 // Otherwise substring match across id, sub (abbreviation) and label/desc (free text) — first
 // match in model order wins, the same "first match, no ranking" convention NID/neighbors()
 // lookups elsewhere in this file already use rather than trying to score multiple hits.
 return NODES.find(n=>
   n.id.toLowerCase().includes(needle) ||
   (n.sub&&n.sub.toLowerCase().includes(needle)) ||
   (n.label&&n.label.toLowerCase().includes(needle)) ||
   (n.desc&&n.desc.toLowerCase().includes(needle))
 )||null;
}
function runNodeSearch(){
 const hit=findNodeByQuery(nodeSearchInput.value);
 nodeSearchInput.classList.toggle('no-match', !!nodeSearchInput.value.trim() && !hit);
 if(!hit) return;
 setSelected(hit.id); applyHL(hit.id); scrollNodeIntoView(hit.id);
}
// Debounced as-you-type search (300ms, same "settle before acting" pattern as every other
// debounce in this codebase) PLUS an immediate Enter-key trigger that bypasses the debounce
// entirely — a user who already knows the exact id/sub they want and hits Enter shouldn't wait
// out the timer that's there for the still-typing case.
let nodeSearchDebounce=null;
nodeSearchInput.addEventListener('input',()=>{ clearTimeout(nodeSearchDebounce); nodeSearchDebounce=setTimeout(runNodeSearch,300); });
nodeSearchInput.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ clearTimeout(nodeSearchDebounce); runNodeSearch(); } });

// ---- View Details mode: a persistent-inspection variant of the drawer (BPMN swimlane and
// process-flow diagrams only, per the requirement this was built against). OFF (default): a
// plain click toggles the highlight lock, as established before this mode existed. ON: a plain
// click opens/updates the drawer directly (see the node click handler above) and neither
// clicking a different node nor clicking empty canvas closes it — only turning this toggle back
// off, or the drawer's own × button (which turns the toggle off too, see its handler above),
// does. Enabling the toggle does not itself open the drawer — nothing is selected yet — it only
// changes what the NEXT node click does; disabling it closes whatever the drawer is currently
// showing, since a stale pinned panel with the mode already off would be a confusing leftover.
let viewDetailsMode=false;
const viewDetailsBtn=document.getElementById('viewDetailsBtn');
function setViewDetails(on){
 viewDetailsMode=on;
 viewDetailsBtn.classList.toggle('on',on);
 if(!on){ drawer.classList.remove('open'); restoreNaturalCanvasSize(); }
}
viewDetailsBtn.addEventListener('click',()=>setViewDetails(!viewDetailsMode));

// ---- Reset: restores the diagram to its exact page-load state, undoing every temporary view
// change a user may have made — zoom level, pan/scroll position, the Jump to Phase selection,
// the Happy Flow filter, the Happy Path Playback engine's progress/highlights (see
// hpResetToStart(), defined earlier alongside the rest of that engine), a click-locked
// highlight, an open drawer (whether opened via View Details mode or a plain double-click),
// View Details mode itself, an in-progress drag gesture, and an open Export dropdown.
// Deliberately does NOT touch anything that isn't view state (the underlying model/node/flow
// data, or files already exported/downloaded) — there's nothing else to reset.
// References state declared further down this script (drawer, selectedId, clearSelected/
// clearAllHL, panning/panMoved, fit) — safe because this only runs inside a click handler, which
// never fires until long after the whole script — and every declaration in it — has run once.
document.getElementById('resetBtn').addEventListener('click',()=>{
 if(happyMode){
  happyMode=false;
  const hb=document.getElementById('happyFlow');
  hb.textContent='Happy Flow'; hb.classList.remove('on');
  applyHappyFlow();
 }
 // Jump to Phase: a non-"All" selection is exactly the kind of "temporary view change" Reset
 // exists to undo (same reasoning as Happy Flow immediately above) — restore the select to its
 // default option, matching page load. The actual scroll position is already reset below
 // (scrollLeft=0 alongside fit()), so this only needs to fix the dropdown's own displayed value.
 if(phaseJumpSel.value!==''){ phaseJumpSel.value=''; }
 // Node Search: same "temporary view change" reasoning as Jump to Phase immediately above —
 // leftover typed text (and any stale no-match colouring) shouldn't survive a Reset either,
 // even though the node it found is already being deselected/un-highlighted below.
 if(nodeSearchInput.value!==''){ nodeSearchInput.value=''; nodeSearchInput.classList.remove('no-match'); }
 // View Details mode's own pinned selection and the drawer content it's driving are explicitly
 // exempt from Reset: "the Reset action shall not clear, deselect, or modify the currently
 // selected View Details item ... side-drawer content shall remain unchanged after a reset
 // operation." Everything else Reset normally clears here (drawer, selection, highlight lock)
 // still happens when View Details mode is OFF — a drawer left open from a plain double-click
 // with the mode off isn't "a View Details item," so it's unaffected by this exemption and
 // still closes on Reset exactly as before.
 if(!viewDetailsMode){
  drawer.classList.remove('open');
  clearSelected(); clearAllHL();
  applyDrawerWidth(DRAWER_MIN_W);   // a manually-dragged width is exactly the "temporary view change" Reset exists to undo — skipped alongside the rest of this block when View Details mode is active, for the same reason its drawer/selection are
 }
 panning=false; panMoved=false;
 const shell=svg.parentElement;
 if(shell) shell.classList.remove('panning');
 const exMenu=document.getElementById('exportMenu'); if(exMenu) exMenu.classList.remove('open');
 // Collapse the svg's inline size back to its CSS default (#svgHost{width:100%;height:100%})
 // BEFORE calling fit() — if a prior zoom left the svg larger than the shell, its own
 // scrollbars are still reducing shell.clientWidth/Height at the exact moment fit() would
 // otherwise measure them (mid-click-handler, before the browser has any reason to reflow
 // early), so fit() would compute a slightly-too-small scale relative to the true page-load
 // value — the fresh page-load fit() never faces this, since the very first call happens
 // before the svg has been sized at all. Clearing back to 100%/100% (which can never itself
 // cause overflow/scrollbars, by definition) reproduces that same scrollbar-free precondition.
 svg.style.width=''; svg.style.height='';
 // fit() recomputes the default width-first scale/offsets and resizes the svg back to its
 // natural (unzoomed) footprint.
 fit();
 // Happy Path Playback: stop any run in progress, clear every .hp-active/.hp-done highlight
 // (nodes and connectors alike), and reset the Play/Pause button back to Play — an explicit
 // "Reset ... clear all playback progress, remove all highlights" requirement. hpResetToStart()
 // also scrolls to the START node itself, which is now this engine's definition of Reset's
 // canvas focus target — a more precise match for "return canvas focus to the START node" than
 // the previous plain scrollLeft/Top=0 (which only coincidentally matched START's position for a
 // layout that happens to originate there).
 hpResetToStart();
});


// ---- legend
// Rendered INSIDE the SVG canvas — appended to `vp` as diagram content, not as a separate
// HTML element above it. That makes it (a) visible in the same pannable/zoomable canvas
// view as everything else, and (b) automatically captured by every export, since
// exportSVGString() only ever clones the <svg> subtree — an HTML sibling was invisible to
// SVG/JPG/PDF exports no matter how it looked in the live page.
const LEG=[['start','Start event','shape'],['end','End event','shape'],['agent','Agent activity','shape'],
 ['control','Control / internal','shape'],['decision','Decision','shape'],['validation','Validation gate','shape'],
 ['system','System / data','shape'],['external','External actor','shape'],['error','Error path','shape'],['escalation','Escalation','shape']];
const LEGE=[['seq','Sequence flow'],['data','Data flow'],['cond','Conditional'],['esc','Escalation'],['err','Error']];
const EDGECOL={seq:'#333333',data:'#555555',cond:'#8a8f98',esc:'#b7791f',err:'#c0392b'};
const EDGEDASH={seq:null,data:'5 4',cond:'2 4',esc:null,err:'4 4'};
// Each swatch mirrors that type's REAL node shape (drawNode()/DESIGN_SYSTEM.md), not one
// generic rounded-rect box — otherwise circle/diamond/hexagon/parallelogram types (start,
// end, decision, validation, external) render identically to rect types in the legend,
// looking inconsistent with the shapes actually used on the canvas.
function legendShapeEl(t){
 const f=FILL[t],s=STROKE[t]; const g=el('g');
 const add=(tag,attrs)=>g.appendChild(el(tag,attrs));

 const prev=exBtn.textContent; exBtn.textContent='Exporting…';
 const done=()=>{exBtn.textContent=prev;};
 try{
  if(fmt==='svg'){downloadBlob(new Blob([exportSVGString()],{type:'image/svg+xml;charset=utf-8'}),FNAME+'.svg');done();}
  else if(fmt==='jpg'){rasterize(2).then(cv=>cv.toBlob(bl=>{downloadBlob(bl,FNAME+'.jpg');done();},'image/jpeg',0.95)).catch(()=>{alert('Export failed.');done();});}
  else if(fmt==='pdf'){rasterize(2).then(cv=>cv.toBlob(bl=>bl.arrayBuffer().then(buf=>{downloadBlob(jpegToPdf(new Uint8Array(buf),cv.width,cv.height),FNAME+'.pdf');done();}),'image/jpeg',0.92)).catch(()=>{alert('Export failed.');done();});}
 }catch(err){alert('Export failed.');done();}
}));

// Keeps --header-h (see .drawer's own comment) in sync with the header's REAL rendered height,
// not a hardcoded guess — a long title can wrap to two lines at a narrow viewport, growing the
// header, and the drawer must never overlap it regardless. Run alongside fit() everywhere fit()
// itself runs (load/resize) since both respond to the same triggers.
function syncDrawerTop(){
 const top=document.querySelector('.top'); if(!top) return;
 document.documentElement.style.setProperty('--header-h', top.getBoundingClientRect().height+'px');
}
// init
requestAnimationFrame(()=>requestAnimationFrame(fit));
syncDrawerTop();
window.addEventListener('load',()=>{setTimeout(fit,60);syncDrawerTop();});
window.addEventListener('resize',()=>{fit();syncDrawerTop();});   // no tabs/panels to check any more — the diagram is the only content, always visible
</script>
<script>(function(){try{var D=window.DATA||{};var m=D.meta||{};
 if(m.title){
  // Split "Name — Description" on the FIRST em dash only: [name, ...rest] rather than
  // [name, description] — a title with a second dash further into its description (none of
  // the current models have one, but nothing rules it out) must keep that dash as part of the
  // subtitle text, not silently drop everything after the second occurrence.
  var parts=String(m.title).split(/\s*—\s*/);
  var hMain=document.querySelector('.top h1 .h1-main'); if(hMain) hMain.textContent=parts[0];
  var hSub=document.querySelector('.top h1 .h1-sub'); if(hSub) hSub.textContent=parts.slice(1).join(' — ');
  document.title='BPMN Swimlane: '+m.title;
 }
 // The header subtitle line (.top .sub, and m.subtitle here) has been removed entirely — the
 // header now shows only the title. meta.subtitle may still be present in model.json (harmless
 // pass-through — see MODEL_SCHEMA.md) but nothing in this file reads it any more.
}catch(e){console.warn('shim',e);}})();</script>
