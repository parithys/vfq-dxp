<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Ecosystem — Business Process Diagram</title>
<style>
:root{
 /* ---- Vodafone Design System tokens ----------------------------------------------
    Variable NAMES are kept as-is (--pg, --sys, --ext, etc.) to avoid rewriting every
    var() reference across this file; only VALUES are remapped. Full rationale for every
    mapping — including which node types use official Vodafone tokens vs. retained or
    derived hues where Vodafone provides no equivalent — is in reference/DESIGN_SYSTEM.md. */
 --ink:#1f1f1f; --ink2:#4a4d4e; --muted:#6f7375; --line:#d8d8d8; --line2:#eeeeee;
 --bg:#ffffff; --panel:#ffffff; --panelalt:#f2f2f2; --surface-warm:#fff1f1;
 --pg:#3860be; --pg-bg:#e7ecf7; --ai:#178a86; --ai-bg:#dfefee;
 --sys:#4a4d4e; --sys-bg:#f2f2f2; --ext:#d46e08; --ext-bg:#f9ecdf;
 --start:#008a00; --end:#ac1811; --dec:#8a5cc9; --dec-bg:#f1ebf9;
 --err:#bd0000; --esc:#f5b400; --val:#2b8a8f;
 --accent:#e60000; --accent-on:#ffffff;
 --charcoal:#25282b; --charcoal-2:#1a1c1e;
 /* Vodafone's own documented standard-easing curve (elevation.motion.standard_ease) — this
    replaced a generic Material-Design "standard" curve (cubic-bezier(.4,0,.2,1)) that had been
    in use here instead; both durations already in play elsewhere in this file (150ms/220ms)
    already match Vodafone's duration_fast_ms/duration_base_ms exactly, so only the curve itself
    needed correcting, not the timings. */
 --ease-standard:cubic-bezier(.2,0,0,1);
 --shadow:0 1px 2px rgba(0,0,0,.05),0 3px 8px rgba(0,0,0,.05);
 --shadow-raised:0 18px 44px rgba(0,0,0,.12);
 --focus-ring:0 0 0 4px rgba(230,0,0,.22);
 /* Vodafone's 4px base spacing scale (spacing.base_scale_px) and radius scale
    (borders_radius), added as reusable tokens for this file's own HTML chrome (header, buttons,
    drawer, legend, export menu) — never applied to the SVG canvas's own layout constants
    (PAD_X/PAD_Y, column/row sizing, connector clearances, node dimensions), which are
    content-geometry, not presentation, and are explicitly out of scope for a visual-design-only
    pass. Several chrome padding/gap values that had drifted slightly off this scale (7px, 11px,
    18px, 10px, 6px) are snapped onto the nearest step below. */
 --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
 --space-6:24px; --space-7:32px; --space-8:38px; --space-9:48px;
 --radius-button:2px; --radius-card:6px; --radius-sm:8px; --radius-md:16px; --radius-pill:9999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Interactions must be constrained to the diagram canvas itself, with the header and the legend
   footer staying fixed and unaffected by them (scroll included — this used to be page-level: a
   tall/narrow model made .diagram-shell GROW to fit all of its content and left the whole page
   to scroll, which dragged the header off the top of the viewport and reduced the legend's own
   position:sticky;bottom:0 to a no-op (nothing above it was ever actually scrolling WITHIN the
   shell for it to stick against). body is now a fixed-viewport flex column instead: header
   (fixed height) + .wrap (flex:1, filling exactly what's left) with overflow:hidden here at the
   body level so the PAGE itself can never scroll. .diagram-shell further down is what actually
   receives the scroll (see its own comment) — the one and only scrollable region now. */
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;
 font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
 color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em}
a{color:var(--accent);text-decoration:none}
/* header */
/* Header/diagram gutter alignment: .top and .wrap previously used two different horizontal
   paddings (26px / 12px, later reconciled to 24px each after the tab bar sat between them
   using its own third value) — the header title and the diagram-shell border below it didn't
   line up on either edge, so the diagram looked "inset" relative to the header above it. Both
   now share one CONTENT_GUTTER (24px) so every horizontal edge on the page — header text,
   and the diagram-shell's own left/right border — sits on the same vertical grid line. (A tab
   strip and a toolbar row both used to sit between the two and each needed its own matching
   gutter; both have since been removed entirely, so only .top and .wrap remain in this
   alignment.) */
/* position:relative + z-index above .drawer's (80) is required, not decorative: .drawer is
   `position:fixed;top:0;height:100vh`, so with no stacking context of its own .top (a normal
   in-flow, non-positioned element) would paint BENEATH it whenever the drawer is open — its
   opaque background would cover the Happy Flow/Export button group in the top-right corner,
   and pointer-events would go to the drawer, not the buttons underneath it, making them
   unclickable as well as invisible. Raising .top above the drawer's stacking level means its
   own opaque background instead covers the drawer's top edge where they'd otherwise overlap,
   so the header (and every button in it) always stays fully visible and clickable regardless
   of drawer state. */
/* flex:none — body is now a flex column (see the body{} comment above) and the header must never
   grow or shrink to share space with .wrap; it keeps its own natural content height and .wrap
   absorbs 100% of whatever height is left. */
.top{position:relative;z-index:90;flex:none;background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));color:#f4f4f4;padding:var(--space-5) var(--space-6) var(--space-4);
 display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
/* Reset, View Details, Happy Flow, and Export all live in the header now, aligned to the
   top-right corner as a group, in that explicit order. Reset originally sat here too (in a
   different position, between Happy Flow and Export) simply re-running the width-first fit; it
   was removed entirely at a time when pan/zoom/drag were all also removed, leaving nothing to
   reset FROM. Wheel-zoom and drag-to-pan have both since been reinstated (see "wheel zoom" and
   "drag-to-pan" further down) WITHOUT bringing Reset back at first — that gap is what this
   button now closes: a single control that unwinds every temporary view change (zoom, pan,
   Happy Flow filter, highlight lock, drawer, View Details mode) back to exactly how the page
   first loaded — see its own click handler, defined alongside View Details further down, for
   the full list. Export used to sit in the diagram toolbar (alongside a Reset button, at the
   end); that toolbar has since been removed entirely (see the ".toolbar" comment further down),
   so this header group is the ONLY place any of these buttons live. flex-shrink:0 keeps the
   group from being compressed if the title is long. */
.top .header-actions{flex:none;display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;color:#fff;display:flex;align-items:center;gap:10px}
.kpis{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:13px}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);
 padding:var(--space-2) var(--space-3);min-width:96px}
.kpi b{display:block;font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
/* flex:1;min-height:0 — takes exactly the viewport height left over after .top (see body{}).
   min-height:0 overrides flexbox's default min-height:auto, which would otherwise let this
   grow to fit .diagram-shell's content instead of the reverse (the classic flex-child-with-
   scrollable-content trap); with it, .wrap stays capped at its allotted share and the overflow
   is left entirely to .diagram-shell's own scrolling, not this container's.
   display:flex;flex-direction:column so .diagram-section — its only child — inherits the same
   fill-height behaviour down to .diagram-shell (each link in this chain needs its own
   flex:1;min-height:0; skipping one breaks containment for everything below it). */
.wrap{padding:var(--space-5) var(--space-6) var(--space-6);flex:1;min-height:0;display:flex;flex-direction:column}
/* .toolbar (Flow-type filter buttons + View Labels toggle) has been removed entirely — every
   connector kind is unconditionally visible with no filter UI (see the header-actions comment
   above), and connector labels are now always shown by default with no toggle either (see
   below). The diagram-section has no toolbar row above the canvas any more at all. */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:var(--radius-button);
 padding:var(--space-2) var(--space-3);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);
 transition:border-color .15s var(--ease-standard),color .15s var(--ease-standard),background .15s var(--ease-standard)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.exportwrap{position:relative;display:inline-block}
.exportmenu{position:absolute;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius-card);box-shadow:var(--shadow-raised);display:none;flex-direction:column;min-width:150px;z-index:60;overflow:hidden;padding:var(--space-1)}
.exportmenu.open{display:flex}
.exportmenu button{padding:8px 12px;border:none;background:none;text-align:left;cursor:pointer;font-size:12.5px;
 color:var(--ink);border-radius:4px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.exportmenu button:hover{background:var(--accent);color:#fff}
.exportmenu button:hover .fmt-hint{color:rgba(255,255,255,.75)}
.exportmenu .fmt-hint{font-size:10.5px;color:var(--muted)}
/* .chip and the Flows filter it labelled have both been removed entirely — every connector
   kind is now unconditionally visible, with no toggle UI at all. */
/* diagram */
/* .diagram-section: pure pass-through of .wrap's fill-height behaviour down to .diagram-shell —
   see .wrap's own comment for why each link in this chain needs its own flex:1;min-height:0. */
.diagram-section{flex:1;min-height:0;display:flex;flex-direction:column}
/* .diagram-shell is now THE scroll boundary — the one and only element interactions (scroll,
   and pan/zoom if either is ever reintroduced) are allowed to affect. It fills exactly whatever
   height .diagram-section hands it (flex:1 again) rather than growing to fit its own content,
   and overflow:auto on BOTH axes means a model too wide, too tall, or both scrolls WITHIN this
   box instead of the page scrolling around it. Sizing is still WIDTH-FIRST — sizeHost()/fit()
   below still compute scale = max(width-fill, height-fill), so the canvas still always consumes
   100% of the horizontal space available and is never letterboxed — the only thing that changed
   is what absorbs a model whose height at that scale exceeds what's visible: previously the
   shell grew and the PAGE scrolled past the header to reach it; now the shell scrolls internally
   and the header/legend, both outside this box, are structurally unable to move. min-height
   keeps the canvas usable even in a very short viewport, matching the old SHELL_MIN_H floor that
   used to be enforced in JS. */
.diagram-shell{position:relative;width:100%;box-sizing:border-box;
 flex:1;min-height:340px;overflow:auto;cursor:grab;user-select:none;-webkit-user-select:none}
/* .panning (toggled by the drag-to-pan pointerdown/up handlers, further down) forces a
   grabbing cursor everywhere over the shell for the duration of an active drag — including
   over a node, which would otherwise keep showing its own .node{cursor:pointer} since that's a
   more specific selector than the shell's own resting cursor:grab. */
.diagram-shell.panning, .diagram-shell.panning *{cursor:grabbing !important}
#svgHost{width:100%;height:100%;display:block}
/* No frozen rows or columns: the lane gutter (left-hand lane names/hints) and the phase header
   (top row of phase badges) both scroll and pan naturally with the rest of the diagram, same
   as every node and connector — neither pins to an edge while the canvas moves beneath it. A
   prior version duplicated both as separate `position:sticky` HTML overlays layered on top of
   the SVG (true CSS sticky doesn't apply to child shapes inside an <svg> the way it does to
   HTML block elements, so pinning either one meant building an HTML twin of SVG content that
   already existed) — `#svgLaneGutter` and `#svgPhaseHeader`, both drawn once as part of the
   ordinary SVG content, are now simply left visible (no longer hidden behind `opacity:0` in
   favour of an HTML overlay) and there is no more sticky positioning, sync-on-pan/zoom JS, or
   HTML duplication of either one anywhere in this file. Both were already rendered exactly
   this way for exported files (which never had the sticky overlay to begin with); the live
   view now matches that same non-frozen behaviour instead of diverging from it. */
/* The legend footer is intentionally NOT part of this change — it never scales with the
   canvas. It isn't a row or column of the diagram grid at all (unlike the lane gutter and
   phase header above, which ARE literally a frozen column and a frozen row); embedding it in
   the scaled SVG content would let a tall multi-lane diagram's "fit-to-height" scale shrink it
   to a near-illegible sliver (a 22-unit-tall row at 0.67x scale renders ~15px tall).
   #legendLayer (the SVG-drawn version) stays hidden live and is restored for exports, same
   pattern lane-gutter/phase-header used to follow before that change — the difference is the
   legend has a genuine reason to stay fixed at a readable size regardless of scroll, and the
   diagram's own rows/columns don't.
   It is now a plain HTML sibling AFTER .diagram-shell (see the markup), not a child positioned
   inside it — a prior version nested it inside .diagram-shell with position:sticky so it would
   float, pinned, over the bottom of the scrolling canvas. That put it inside the same box whose
   native horizontal/vertical scrollbars are rendered at ITS outer edge, so the scrollbar ended
   up drawn UNDERNEATH the sticky legend instead of between the canvas and the legend — exactly
   backwards from "scrollbar immediately below the canvas, legend below that". Moving it outside
   the scroll container entirely (a flex:none row of its own in .diagram-section, below the
   flex:1 .diagram-shell) fixes both at once: the shell's scrollbar now sits at the shell's own
   bottom edge (immediately below the canvas, nothing else in that box), and the legend is a
   separate, always-visible row below it that scrolling can never cover or be covered by. */
/* Legend readability pass: font bumped 11px -> 12.5px (the smallest text on the whole canvas
   was previously the one piece of UI every reader depends on to decode the diagram), items are
   grouped into labelled clusters (Node types / Connector types) instead of one undifferentiated
   run, each on its OWN row rather than sharing one — a prior version used a flex-row container
   with inline-flex groups, so "Node types" and "Connector types" sat side by side whenever they
   both fit the available width, only stacking once genuinely overflowing; the spec calls for
   always-separate rows regardless of available width, so the container is now a flex COLUMN
   with each group as its own full-width flex row (items within a group still wrap onto
   additional lines if that one group alone needs more room than the canvas has). */
/* flex:none — a fixed-height row of its own after .diagram-shell in the .diagram-section flex
   column (see markup), never sharing space with or sitting inside the scrollable canvas. Kept
   the "legend-sticky" class name for continuity even though it's no longer position:sticky —
   see the comment above this rule for why it moved out of .diagram-shell entirely. */
.legend-sticky{flex:none;display:flex;flex-direction:column;
 gap:var(--space-2);background:rgba(255,255,255,.97);border-top:1px solid #eeeeee;
 padding:var(--space-3) var(--space-4)}
.legend-sticky .lgd-item{display:inline-flex;align-items:center;gap:6px;font:600 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#333333;white-space:nowrap}
.legend-sticky .lgd-group{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:6px;column-gap:16px}
.legend-sticky .lgd-cat{font:800 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--muted);
 text-transform:uppercase;letter-spacing:.08em;margin-right:2px;white-space:nowrap}
.legend-sticky svg{flex:none}
.node{cursor:pointer}
.node .box{stroke-width:1.5;transition:stroke .15s var(--ease-standard),stroke-width .15s var(--ease-standard),filter .15s var(--ease-standard)}
/* Selection uses the Vodafone brand-red accent (--accent, #e60000) rather than the signal-blue
   identity colour — the identity blue is already used pervasively for 'agent' node fill/stroke
   and portfolio-lane tints, so a selected node in that same hue had low figure/ground contrast
   against its own type colour and against nearby agent nodes. Brand red is reserved on this
   canvas almost exclusively for selection/selected-path emphasis and the header/phase-badge
   accents, so it reads immediately as "the thing that's active" rather than blending into the
   diagram's own colour vocabulary. Stroke width and glow radius are both increased over the
   previous blue treatment for stronger visual prominence at any zoom level.
   NOTE: DESIGN_SYSTEM.md previously documented this as a magenta stroke; that was aspirational
   and never matched the shipped engine (which used --pg blue). Brand-red is now the actual and
   documented behaviour — see DESIGN_SYSTEM.md "Node types" for the corrected spec. */
.node.selected .box{stroke:var(--accent) !important;stroke-width:4px !important;filter:drop-shadow(0 0 6px rgba(230,0,0,.65)) drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.node.selected{opacity:1 !important}
.node text{font-family:"Inter","Segoe UI",system-ui,sans-serif;pointer-events:none}
/* Minimum 14px font-size across the diagram canvas (nodes, connectors, lane gutter, phase
   headers, legend) for readability — every diagram-canvas text size that was previously below
   14px (node sub-labels at 9.5px, lane hints at 9px, edge labels at 9.5px, phase badge numbers
   at 9px, legend category captions at 9.5px, etc.) is now 14px. This does trade away the prior
   visual hierarchy some of these had (a node's own label and its smaller "sub" caption used to
   read at clearly different sizes; now both read at the same 14px) — that trade-off is the
   explicit, accepted cost of the minimum-size requirement, not an oversight. Node/shape
   dimensions in build_model.py's `sizes` dict were NOT enlarged to compensate: the existing
   measurement-driven wrap/truncate/fold logic (wrapTextPx(), truncatePx()) already adapts
   correctly to whatever font it's given, so nothing overflows a shape's boundary — a small
   node (a circle, a decision diamond) may now truncate its label more aggressively than before
   simply because the same physical space holds less 14px text than it held 9.5-11.5px text.
   That's an inherent, unavoidable consequence of enforcing a larger minimum inside fixed-size
   shapes, not a rendering defect. */
.node .lbl{font-size:14px;font-weight:600;fill:var(--ink)}
/* .node .sub (the reference/requirement-code caption under a node's label) has been removed
   entirely, along with the JS that rendered it — see the NODES.forEach loop. */
.edge{fill:none;stroke-linejoin:round;transition:opacity .15s var(--ease-standard),filter .15s var(--ease-standard)}
.edge.seq{stroke:var(--sys);stroke-width:1.7}
.edge.data{stroke:var(--pg);stroke-width:1.5;stroke-dasharray:5 4}
.edge.cond{stroke:var(--dec);stroke-width:1.6;stroke-dasharray:2 4}
.edge.esc{stroke:var(--esc);stroke-width:2}
.edge.err{stroke:var(--err);stroke-width:1.8;stroke-dasharray:4 4}
/* Connector labels went through two changes in successive rounds. A prior version carried a
   4.5px white stroke halo (via paint-order:stroke) as a background/pill effect to keep small
   text legible against whatever it crossed; that halo was then removed entirely (no stroke,
   no paint-order) in favour of italic, regular weight (not the original bold), reading as
   lighter, more unobtrusive annotation — but with the explicit, accepted trade-off that a
   label could now visually cross a connector line or another element behind it with nothing
   separating them. That trade-off was then reversed: the white background is back
   (`paint-order:stroke;stroke:#fff`), restoring legibility against crossed content, while the
   italic/regular-weight/dark-grey styling from the round in between is KEPT — only the
   background was asked to come back, not the original bold weight. The net result is a label
   that reads as lighter/secondary via its typography (italic, not bold) while still being
   fully legible against anything it happens to cross, via the restored white halo. */
.elabel{font-size:14px;font-style:italic;font-weight:700;fill:#4a4d4e;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
/* Inactive/background dimming for the hover-isolation interaction. Previously .12 opacity left
   unrelated nodes/edges clearly legible, which read as "everything is still part of the story"
   rather than "this is the isolated path" — the whole point of the interaction. Two changes,
   both required together:
   (1) opacity drops to .05 (near-invisible, never literally 0 so a reader can still tell there
       WAS other content, preserving orientation on a large canvas), and
   (2) a grayscale filter desaturates whatever residual pixels remain, so the faint background
       reads as "greyed-out context" rather than "full-colour content at low volume" — the two
       read very differently even at matched opacity. Never applied to .selected (see rule
       above) or to the active/highlighted path (.hl / .hlpath), which stay at full opacity and
       full colour so the active path has maximum contrast against the greyed-out rest. */
.dim{opacity:.05;filter:grayscale(1) brightness(1.15);transition:opacity .15s var(--ease-standard),filter .15s var(--ease-standard)}
.hl{opacity:1 !important;filter:none !important}
/* The active/highlighted path (hover-isolated edges) is redrawn in brand red at a heavier
   weight plus a soft glow — matching the selection treatment above — instead of merely
   thickening the edge's own type colour, which kept e.g. a pale amber escalation line looking
   washed out even at 3px. A single shared "this is the active thing" colour across both
   selection (nodes) and isolation (edges) is the fix for "poor visual prominence": the reader
   should never have to hunt for which path lit up. */
.edge.hlpath{stroke:var(--accent) !important;stroke-width:3.5 !important;filter:drop-shadow(0 0 3px rgba(230,0,0,.55)) !important}
.lanelabel{font-size:14px;font-weight:700;fill:#4a4d4e}
/* .lanehint restored — hints render inline again as additional rotated column(s) after the
   lane name's own column(s), per an explicit "display the sub-headings too" requirement. It
   was removed for a round in between (a vertical-orientation change initially left no room
   for a second element beside the rotated name at all) but that gap has been closed: see the
   lane-gutter rendering loop below for how name and hint columns now share one consistent
   column-layout scheme. Kept at the same 14px minimum every other canvas text respects. */
.lanehint{font-size:14px;fill:#6f7375}
.leglabel{font-size:14px;font-weight:600;fill:#333333}
.legcat{font-size:14px;font-weight:800;fill:#6f7375;letter-spacing:.08em}
.phasehdr{font-size:14px;font-weight:700;fill:#ffffff;dominant-baseline:middle}
/* .phasenum removed: the numbered badge circle it styled (a small red circle with the stage's
   1-based index) has been removed entirely from the phase header — stage headings now show
   only their name, per an explicit "remove the numeric prefixes" requirement. */
/* detail drawer */
/* top/height were previously fixed 0/100vh, same as the app header itself (z-index:90, above
   the drawer's own 80) — since both started at the exact same y, the header's opaque background
   painted over the drawer's own top portion (`.dh`, including its × close button), hiding and
   disabling it even though the drawer's SCROLLABLE body (`.db`) below happened to start clear
   of the header by coincidence of the two elements' similar heights. --header-h is set at
   runtime (see syncDrawerTop(), called on load/resize alongside fit()) to the header's actual
   rendered height — not a hardcoded px guess — since that height isn't a fixed constant (a long
   title can wrap to two lines at a narrow viewport, growing the header). The fallback (62px)
   only matters for the brief instant before JS first runs. */
.drawer{position:fixed;top:var(--header-h,62px);right:0;height:calc(100vh - var(--header-h,62px));width:390px;max-width:92vw;background:var(--panel);
 box-shadow:-18px 0 44px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .22s var(--ease-standard);z-index:80;
 /* top/height deliberately NOT transitioned (only transform is): found empirically that
    transitioning a var()/calc()-driven length here made the browser freeze `top` at its
    initial computed value and never re-resolve it on subsequent --header-h changes, rather
    than animating — a real engine quirk with this specific property/value combination, not a
    style choice. A resize-triggered header-height change is rare and doesn't need animating
    anyway, so top/height simply apply instantly; only the open/close slide stays animated. */
 display:flex;flex-direction:column}
.drawer.open{transform:none}
.drawer .dh{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:var(--space-3)}
.drawer .dh h3{font-size:15px}
.drawer .db{padding:var(--space-4) var(--space-5);overflow:auto}
.drawer .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;border:none;background:none}
.dsec{margin-bottom:14px}
.dsec .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:5px}
.dsec ul{margin:0;padding-left:16px}
.dsec li{margin-bottom:3px}
/* Incoming/Outgoing paths — a bordered two-column box replacing the previous separate
   "Comes after"/"Leads to" pill rows, matching a supplied reference layout. Kept in the
   drawer's existing sans-serif typography rather than switching to the reference's monospace
   face, since the rest of the drawer (and the rest of this skill's UI) is Inter/system-ui
   throughout — adopting the reference's STRUCTURE (bordered box, two columns, arrow + bold
   step name) without a wholesale typography change that would clash with everything else. */
.dsec-paths{border:1px solid #b8d4f5;background:#eef4fd;border-radius:var(--radius-sm);padding:var(--space-4);
 display:flex;gap:20px;margin-bottom:14px}
.dsec-paths .col{flex:1;min-width:0}
.dsec-paths .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
 font-weight:700;margin-bottom:8px}
.dsec-paths .path-item{display:flex;gap:6px;align-items:baseline;margin-bottom:6px;font-size:13px;line-height:1.4}
.dsec-paths .path-item:last-child{margin-bottom:0}

const D=window.DATA, LY=D.layout, NODES=D.nodes, FLOWS=D.flows;
const NID={}; NODES.forEach(n=>NID[n.id]=n);

// Connector labels must participate in the SAME layout pass that positions everything else,
// not get dropped afterward at whatever gap the column grid already happened to leave. Every
// phase column boundary is a fixed LY.colw apart regardless of what has to be labelled across
// it — a label wider than that gap (e.g. "milestone: contact & eligibility" needing ~165px
// across a ~46px node-to-node gap) spills straight into the nodes on either side. This widens
// only the specific column boundaries that need it and shifts every column after them,
// mirroring the same "measure, then make room, then shift what follows" approach already used
// for the lane-label gutter and the backward-edge routing tracks.
{
 const lblCtx=document.createElement('canvas').getContext('2d');
 const ELABELFONT='italic 700 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif';   // kept in sync with .elabel's weight — MUST match exactly, or this width measurement (used for column-shift spacing, see below) under/overestimates what actually renders and either spills a label into a node or leaves excess gap
 lblCtx.font=ELABELFONT;
 const LABEL_CLEARANCE=16;   // clearance from each node edge, beyond the bare text width
 const extraGap={};          // extraGap[phase] = extra px this column boundary needs, if any
 FLOWS.forEach(f=>{
  if(!f.label) return;
  const a=NID[f.from], b=NID[f.to]; if(!a||!b) return;
  if(b.phase!==a.phase+1) return;   // only a directly-adjacent pair shares exactly one boundary
  const need=lblCtx.measureText(f.label).width+LABEL_CLEARANCE*2;
  const rawGap=b.x-(a.x+a.w);
  if(need>rawGap) extraGap[a.phase]=Math.max(extraGap[a.phase]||0, need-rawGap);
 });
 const maxPhase=NODES.reduce((m,n)=>Math.max(m,n.phase),0);
 const shiftAt=[0];
 for(let p=1;p<=maxPhase+1;p++) shiftAt[p]=(shiftAt[p-1]||0)+(extraGap[p-1]||0);
 if(shiftAt[maxPhase+1]){
  NODES.forEach(n=>{ const s=shiftAt[n.phase]||0; if(s){ n.x+=s; n.cx+=s; } });
  LY.totalW+=shiftAt[maxPhase+1];
 }
 LY._colShift=shiftAt;   // phase headers use this so their boundaries track the same shift

 validation:'#2b8a8f',system:'#4a4d4e',external:'#d46e08',error:'#bd0000',escalation:'#f5b400'};
// Per-phase-group colour palette: one distinct hue per phase heading (the dark pill), paired
// with a light tint of that SAME hue for the column's full-height body background beneath it.
// Every `header` value is verified >=4.5:1 contrast against white text (WCAG AA, normal text —
// the phase heading is 14px/700, which does not qualify as "large text" under the 18.66px-bold
// threshold, so normal-text AA is the correct bar, not the more lenient large-text 3:1). Built
// by darkening/extending hues already used elsewhere in this file (signal_blue, the decision/
// validation/external node-type colours, --start, --end, --sys, --charcoal) rather than
// inventing an unrelated new palette — `teal` and `amber` needed darkening from their node-type
// values specifically to clear 4.5:1 (their node-fill versions are contrast-checked against a
// DARK stroke on a LIGHT fill, not white text on the colour itself, so passing one doesn't
// imply passing the other). `wine` and `olive` have no node-type equivalent — added purely to
// cover a 9th/10th distinct phase without repeating a hue, verified the same way (8.03 and 5.67
// respectively). Each `tint` is the same hue at ~94% lightness/45% saturation, matching the
// lightness/saturation this file's existing bg tokens already use (`--pg-bg`, `--ai-bg`,
// `--dec-bg`, `--ext-bg`) — computed programmatically, not eyeballed, so every tint reads as
// "the same colour family as its header" rather than an arbitrary pastel. `slate`/`charcoal`
// use plain light neutrals for their tints instead of a hue-rotated pastel: both are themselves
// near-zero-saturation colours, so mechanically applying the same H/L/S recipe produced an
// unstable, incidentally blue-tinted result (HSL hue is not well-defined at very low
// saturation) that read as a near-duplicate of the `blue` entry rather than a genuine neutral.
// Cycles (via `gi % PHASE_PALETTE.length`) if a model has more phase groups than palette
// entries — verified against the actual data: the widest current model (Trouble Ticket /
// Postpaid Activation) has 10 distinct phase groups, exactly the palette's own length, so no

const PHASE_PALETTE=[

 {header:'#157d7a',tint:'#e9f7f6'},   // teal    (darkened from validation/ai teal)
 {header:'#8a5cc9',tint:'#efe9f7'},   // purple  (decision)
 {header:'#b65f07',tint:'#f7f0e9'},   // amber   (darkened from external amber)
 {header:'#008a00',tint:'#e9f7e9'},   // green   (start / semantic.success)
 {header:'#ac1811',tint:'#f7e9e9'},   // red     (end / deep_red_secondary — never brand_red/--accent, which stays reserved for selection)
 {header:'#4a4d4e',tint:'#f2f2f2'},   // slate   (system / text.secondary)
 {header:'#25282b',tint:'#eaecee'},   // charcoal

const phaseGroups=[];
LY.phases.forEach((p,i)=>{

});

// themselves (added later) all paint on top of the tint, never the reverse. Span is

const phaseBg=el('g',{id:'svgPhaseBg'});
phaseGroups.forEach((grp,gi)=>{
 const x=LY.x0+grp.start*LY.colw+(LY._colShift[grp.start]||0);
 const endX=LY.x0+(grp.end+1)*LY.colw+(LY._colShift[grp.end+1]||0);
 const pal=PHASE_PALETTE[gi%PHASE_PALETTE.length];
 phaseBg.appendChild(el('rect',{x,y:LY.topbar,width:endX-x,height:(LY.totalH-30)-LY.topbar,fill:pal.tint}));
});
vp.appendChild(phaseBg);

// A dedicated `ar-hl` marker exists ALONGSIDE the per-kind markers, not instead of them — it's

[['ar','#4a4d4e'],['ar-data','#3860be'],['ar-cond','#8a5cc9'],['ar-esc','#f5b400'],['ar-err','#bd0000'],['ar-hl','#e60000']].forEach(([id,c])=>{

 m.appendChild(el('path',{d:'M0,0 L7.5,3 L0,6 z',fill:c})); defs.appendChild(m);});

// and wasted space with others depending on letter width and font weight. This also NEVER
// silently drops a line the way the old `.slice(0,3)` did: once maxLines is reached, every
// remaining word is folded into the final line and ellipsis-truncated so cut content is
// always visible to the reader instead of vanishing. Two-pass approach (wrap everything
// first, THEN fold any overflow into the last allowed line) rather than tracking overflow
// inline during the wrap itself — an earlier single-pass version had a real bug here: when
// content needed more lines than `maxLines` allowed, it could overwrite an already-correctly-
// wrapped final line with ONLY the not-yet-placed leftover word(s), silently discarding that
// line's real content instead of folding the leftover INTO it (e.g. "Digital Channel /
// Self-Service Portal" wrapped to 2 lines produced "Digital Channel /" + "Portal", quietly
// losing "Self-Service" entirely — not truncated-with-ellipsis, just gone). The two-pass
// version can't make that mistake: every word is placed into `allLines` first with no line
// count limit, and only THEN, if there are more lines than allowed, are the excess lines'
// words joined back together and ellipsis-truncated as one unit appended to the last kept
// line — nothing is ever computed from a word in isolation from the line it actually
// belonged to.
function wrapTextPx(ctx,font,txt,maxW,maxLines){

 while(remainder.length>1&&ctx.measureText(remainder+'…').width>maxW) remainder=remainder.slice(0,-1);

// ---- z-order fix: connectors + arrowheads must paint ON TOP of node shapes, not under them.
// nodeLayer/edgeLayer/labelLayer were all built in this textual order for a practical reason
// (edge geometry needs finished node coordinates, so edges are computed first; nodes are then
// drawn using those same coordinates) — but DOM/paint order in SVG is z-order, and `edgeLayer`
// had been appendChild'd to `vp` BEFORE `nodeLayer` simply because it was created first. That
// put every node's opaque fill/stroke ON TOP of every connector and arrowhead, so anywhere an
// edge's endpoint (or an arrowhead marker, which is painted as part of the path at that exact
// vertex) coincided with a node's own boundary — which is everywhere every arrow terminates,
// by design — the node's boundary stroke (itself painted centred on that same coordinate, so
// it bleeds ~0.75-1.1px outward past the mathematical edge) covered the finest, sharpest part
// of the arrowhead tip. That's a small numeric overlap, but arrowhead tips are exactly the
// thin, pointed geometry most visually destroyed by a small covering: the result reads as
// "arrowhead clipped / half-buried under the activity box / connector penetrating the border",
// which is a genuine defect regardless of how small the underlying overlap is.
// This one line reorders the SVG child list (moving the already-built, already-populated
// nodeLayer to sit immediately BEFORE edgeLayer) without touching the build/compute order
// above — node geometry is still computed first, only the PAINT order changes. Connectors and
// their arrowheads now render on top of every node they touch, so an arrow always terminates
// as a clean, fully visible point right at the boundary it's drawn to reach. The existing
// obstacle-detour logic (obstacleOnRow/obstacleOnColumn, see the "edges" section above) is
// UNCHANGED and still required — it exists to stop a connector from visually crossing through
// an UNRELATED third node's body (which would look like a spurious connection even though
// that edge would now render on top of it), not to solve the endpoint-clipping problem this

// ---- highlight
// `selectedId` is a click-lock, not just a drawer flag: clicking a node turns on the exact same

// Hover works independently of an active lock, and does not override/clear it: hovering ANY
// node — related to the lock or not — substitutes that node's own neighbour set for the
// duration of the hover, and clearHL() (mouseleave) reverts to re-painting the locked node's
// view, not to nothing. The lock's underlying state (`selectedId`, the `.selected` class) never
// changes from hovering — only the click/background-click handlers touch that. (An earlier pass
// through this file made hover fully inert while a lock was active instead, reasoning that a

// ---- Happy Flow / All Flows toggle
// A flow edge belongs to the happy path if `f.happy` is explicitly `true`, is excluded if
// explicitly `false`, and otherwise defaults by `kind`: `seq`/`data` (ordinary forward
// progression) default to happy; `esc`/`err` (escalation/error paths, by definition
// exception handling) default to NOT happy; `cond` (a decision's branch) defaults to NOT
// happy and must be explicitly marked `happy:true` on whichever branch is the success path —
// unlike seq/data/esc/err, a decision's branches are inherently ambiguous from `kind` alone
// (which branch is "the happy one" is a business-logic fact the data has to state, not
// something the engine can infer), so `cond` is the one kind with no permissive default.
// This mirrors the same "engine renders what the data says, never infers business meaning it
// wasn't told" principle used throughout this skill (see e.g. `n.lane`/`n.agents` — the
// engine never guesses domain facts on the model's behalf).

 else if(t==='decision') add('polygon',{points:'11,1 20,7 11,13 2,7',fill:f,stroke:s,'stroke-width':1.5});
 else if(t==='validation') add('polygon',{points:'5,1 17,1 21,7 17,13 5,13 1,7',fill:f,stroke:s,'stroke-width':1.5});
 else if(t==='external') add('polygon',{points:'6,1 21,1 16,13 1,13',fill:f,stroke:s,'stroke-width':1.5});
 else if(t==='system'){ add('rect',{x:1,y:1,width:20,height:12,rx:2,fill:f,stroke:s,'stroke-width':1.5}); add('line',{x1:1,y1:4.5,x2:21,y2:4.5,stroke:s,'stroke-width':1}); }
 else if(t==='error'||t==='escalation') add('rect',{x:1.6,y:1.6,width:18.8,height:10.8,rx:4,fill:f,stroke:s,'stroke-width':2.2});

// Legend items are grouped into two labelled clusters — "NODE TYPES" and "CONNECTOR TYPES" —
// rather than one undifferentiated run of 15 swatches. A category caption (12px caps, muted
// grey, matching .legcat) precedes each group, and a wider gap separates the two groups than
// separates items within a group, so a reader can tell at a glance "these ten are shapes,
// these five are lines" instead of scanning the whole legend to figure out its own structure.
function buildLegend(){
 const shapeItems=LEG.map(([t,lab])=>({icon:'shape',type:t,label:lab,w:22}));
 const lineItems=LEGE.map(([k,lab])=>({icon:'line',type:k,label:lab,w:26}));
 const ctx=document.createElement('canvas').getContext('2d');
 ctx.font='600 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif';   // kept in sync with .leglabel's 14px minimum
 const gap=7, itemGap=20, catGap=10, padX=8, rowH=24, rowGap=10;
 const measure=(it)=>({...it,textW:ctx.measureText(it.label).width});
 // Category caption width MUST be measured via a real, temporarily-attached SVG <text>
 // element (getComputedTextLength()), not Canvas's ctx.measureText(). `.legcat` carries a
 // real `letter-spacing:.08em` in its CSS — Canvas's 2D context `font` property has no way to
 // apply letter-spacing, so ctx.measureText() silently UNDERESTIMATES the caption's true
 // rendered width by roughly (character-count × font-size × 0.08): ~7.6px short for "NODE
 // TYPES", ~11.4px short for "CONNECTOR TYPES". That shortfall is exactly what positioned the
 // first icon of each group a few pixels INSIDE the tail of its own caption text instead of
 // after it — the "NODE TYPOS" / "CONNECTOR TYPESequence flow" overlap. getComputedTextLength()
 // is real SVG layout, so it accounts for letter-spacing (and anything else CSS does to the
 // text) exactly, by construction — there's no formula to keep in sync as the style evolves.
 const measureEl=el('text',{class:'legcat', style:'visibility:hidden'});
 vp.appendChild(measureEl);
 const measureCatW=(str)=>{ measureEl.textContent=str; return measureEl.getComputedTextLength(); };
 const groups=[
  {cat:'NODE TYPES', items:shapeItems.map(measure)},
  {cat:'CONNECTOR TYPES', items:lineItems.map(measure)},
 ];
 groups.forEach(gr=>{ gr.catW=measureCatW(gr.cat); });
 vp.removeChild(measureEl);
 // Each group ALWAYS starts its own row — "Node types" and "Connector types" must never share
 // a row, per spec, regardless of how much horizontal space is available. Within a single
 // group, items still wrap onto additional rows the same greedy way if the group itself is
 // wide enough to need it (a long list of node types on a narrow canvas, for instance).
 const allRows=[];
 groups.forEach(gr=>{
  const rows=[[]]; let curW=padX; let first=true;
  gr.items.forEach(it=>{
   const capW=first?gr.catW+catGap:0;
   const w=capW+it.w+gap+it.textW;
   if(curW>padX && curW+itemGap+w>LY.totalW-padX){ rows.push([]); curW=padX; }
   else if(rows[rows.length-1].length){ curW+=itemGap; }
   rows[rows.length-1].push({...it, cat:first?gr.cat:null, capW});
   curW+=w; first=false;
  });
  allRows.push(...rows);
 });
 // Symmetric vertical rhythm: the same gap above the legend's first row as below its last row,
 // rather than an ad hoc 18px above and only 8px below (a prior version's asymmetry — the
 // legend visibly floated with too much air above it and felt cramped against the canvas edge
 // below it). LEGEND_VGAP is the single value both sides are built from, so they can't drift
 // apart again the way `X0`/`laneLabelW` once did before that was unified.
 const LEGEND_VGAP=20;
 const top=LY.totalH+LEGEND_VGAP;
 const g=el('g',{id:'legendLayer'});
 allRows.forEach((row,ri)=>{
  let x=padX; const y=top+ri*(rowH+rowGap);
  row.forEach(it=>{
   const ig=el('g',{transform:`translate(${x+it.capW},${y})`}); g.appendChild(ig);
   if(it.cat){ const ct=el('text',{x:-it.capW,y:11,class:'legcat'}); ct.textContent=it.cat; ig.appendChild(ct); }
   if(it.icon==='shape'){ ig.appendChild(legendShapeEl(it.type)); }
   else {
    const line=el('line',{x1:0,y1:7,x2:it.w,y2:7,stroke:EDGECOL[it.type],'stroke-width':it.type==='esc'?2:1.7});
    if(EDGEDASH[it.type]) line.setAttribute('stroke-dasharray',EDGEDASH[it.type]);
    ig.appendChild(line);
   }
   const t=el('text',{x:it.w+gap,y:11,class:'leglabel'}); t.textContent=it.label; ig.appendChild(t);
   x+=it.capW+it.w+gap+it.textW+itemGap;
  });
 });
 vp.appendChild(g);
 // LY.totalH needs to include the legend for EXPORTS (a static file has no sticky footer to
 // fall back on), but the live "fit to height" scale must NOT be computed against that taller
 // number — the legend is hidden live (below) and consumes no on-screen space there, so
 // reserving room for it would just shrink the rest of the diagram to make space for a gap
 // nothing is drawn into. sizeHost() uses LY._preLegendTotalH instead, once it's set.
 LY._preLegendTotalH=LY.totalH;
 // Bottom padding matches LEGEND_VGAP exactly, same as the top gap — a prior version used 8px
 // here against 18px above, an asymmetry that read as "too much air above the legend, too
 // little below it, before the canvas edge cuts it off."
 LY.totalH=top+allRows.length*(rowH+rowGap)-rowGap+LEGEND_VGAP;   // extend the (export-facing) canvas bounds to include the legend row(s)
 g.style.opacity='0';   // sticky HTML legend (below) replaces this live; exportSVGString() restores it on the clone
}
buildLegend();
// Sticky HTML legend — a fixed-size footer, built once (it isn't tied to any row/column
// position, so unlike the header/gutter it needs no per-frame geometry sync).
const legendBarEl=document.getElementById('legendBar');

 if(!legendBarEl) return;
 // Same grouping as buildLegend() (SVG/export version): two labelled clusters instead of one
 // flat run, so the live sticky footer and the exported file present an identical, legible
 // legend structure.
 const groups=[
  {cat:'Node types', items:LEG.map(([t,lab])=>({icon:'shape',type:t,label:lab}))},

   if(it.icon==='shape'){ svgEl.appendChild(legendShapeEl(it.type)); }
   else {
    const line=el('line',{x1:0,y1:7,x2:w,y2:7,stroke:EDGECOL[it.type],'stroke-width':it.type==='esc'?2:1.7});
    if(EDGEDASH[it.type]) line.setAttribute('stroke-dasharray',EDGEDASH[it.type]);
    svgEl.appendChild(line);
   }
   wrap.appendChild(svgEl);
   const txt=document.createElement('span'); txt.textContent=it.label; wrap.appendChild(txt);
   groupEl.appendChild(wrap);

 });

buildLegendBar();

// ---- pan & zoom
let scale=1,tx=0,ty=0,baseScale=1;
// The lane gutter and phase header no longer need any JS sync at all — both are now ordinary,
// always-visible SVG content (#svgLaneGutter, #svgPhaseHeader) that pans and scales along with
// everything else inside the `vp` transform below, exactly like every node and connector. A
// prior version duplicated both as separate sticky HTML overlays that needed constant
// repositioning (syncLaneGutter()/syncPhaseHeader(), called from apply() on every pan/zoom) to
// stay visually aligned with the scrolling/zooming SVG beneath them — none of that exists any
// more, since there's nothing frozen left to keep in sync.
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
/* ---- responsive width-first sizing -------------------------------------------------
   The canvas must always consume 100% of the horizontal space inside .diagram-shell.
   Sizing is driven by BOTH axes:

       sW = (availW - 2*PAD_X) / totalW      // scale that makes the content span the full width
       sH = (availH - 2*PAD_Y) / contentH    // scale that makes the content span the full height
       s  = max(sW, sH)                      // whichever fills its axis LAST — never letterboxed

   * A wide/flat model keeps its previous behaviour exactly (sH wins, the content overflows
     horizontally and the shell scrolls) — it already used the full width.
   * A tall/narrow model takes sW: the diagram spans the entire width, and content that's taller
     than the shell's own (now CSS-bounded — see .diagram-shell) height scrolls WITHIN it via
     overflow:auto rather than growing the shell to fit. This is a deliberate reversal of an
     earlier version of this comment, which grew the shell instead and let the PAGE scroll past
     it — that kept the width-fill goal but broke a later, equally explicit requirement:
     interactions (scroll, and pan/zoom if either is ever reintroduced) must stay confined to the
     canvas, with the header and the legend footer genuinely fixed and unaffected by them. Growing
     the shell dragged the header off-screen on every tall/narrow model and left the legend's own
     position:sticky;bottom:0 unable to stick to anything (nothing was scrolling WITHIN the shell
     for it to pin against — the whole PAGE was). Both are now true at once: full width fill AND
     a canvas that's the only thing that ever scrolls, because availH below is .diagram-shell's
     actual CSS-flex-determined height (fixed, never written back to), not a budget this function
     computes and then grows the shell to match.
   Aspect ratio is preserved in every branch: one uniform `scale`, no independent x/y stretch. */
const PAD_X=14, PAD_Y=22;                           // buffer kept on each edge (x trimmed: the
                                                    // horizontal axis is the scarce one here)
const CANVAS_PAD=PAD_X;                             // back-compat alias
// applySizeAtScale(s): the actual DOM-writing half of sizing — given an explicit scale, sizes
// the svg element (width/height/viewBox) to fit that scale's content plus padding, never
// smaller than the shell's own visible area, and returns the centring offsets. Shared by
// sizeHost() (which derives the width-first AUTOFIT scale, below) and zoomAt() (which sizes
// to whatever scale the user has interactively zoomed to) — one sizing implementation, two
// different ways of arriving at the `s` it's given.
function applySizeAtScale(s){
 const shell=svg.parentElement; if(!shell) return null;
 const availW=shell.clientWidth; if(!availW) return null;
 const availH=shell.clientHeight; if(!availH) return null;   // CSS-bounded (flex:1 on .diagram-shell) — this
                                                    // function reads it, never sets it; excess content
                                                    // scrolls within the shell (overflow:auto) instead
 const contentW=LY.totalW;
 const contentH=LY._preLegendTotalH||LY.totalH;     // live view excludes the export-only legend extension
 // No legend-height reservation needed here any more: #legendBar is now a flex:none sibling
 // AFTER .diagram-shell (see markup + the .legend-sticky comment), not a child positioned
 // inside it, so shell.clientHeight (= availH above) already excludes the legend's space —
 // the flex column allocates it before .diagram-shell's flex:1 share is ever computed.
 const drawnW=contentW*s, drawnH=contentH*s;
 const w=Math.max(availW,Math.round(drawnW+2*PAD_X));    // >= the shell: 100% of the horizontal space
 const h=Math.max(availH,Math.round(drawnH+2*PAD_Y));
 svg.style.width=w+'px'; svg.style.height=h+'px';
 svg.setAttribute('viewBox',`0 0 ${w} ${h}`);       // 1:1 px space so the vp transform fully controls scaling
 return {w,h,s,offX:Math.max(PAD_X,(w-drawnW)/2),offY:Math.max(PAD_Y,(h-drawnH)/2)};}
function sizeHost(){
 const shell=svg.parentElement; if(!shell) return null;
 const availW=shell.clientWidth; if(!availW) return null;
 const availH=shell.clientHeight; if(!availH) return null;
 const sW=(availW-2*PAD_X)/LY.totalW;
 const sH=(availH-2*PAD_Y)/(LY._preLegendTotalH||LY.totalH);
 const s=Math.max(sW,sH);                           // fill whichever axis is the binding constraint
 return applySizeAtScale(s);
}
function fit(){const dim=sizeHost();if(!dim){requestAnimationFrame(fit);return;}
 scale=dim.s;tx=dim.offX;ty=dim.offY;baseScale=dim.s;apply();}   // centred within whatever slack
                                                    // remains; baseScale anchors zoomAt()'s min/max clamp
// ---- wheel zoom (mouse wheel + trackpad pinch), confined to the canvas -------------------
// Reinstates zoom — explicitly REMOVED earlier in this project's build-out in favour of
// "scroll only, no zoom/pan" (the comment this replaces said as much). A later, equally
// explicit requirement reverses that specifically for zoom: mouse-wheel and trackpad
// pinch-to-zoom must both zoom the diagram, confined to the canvas, with the header, footer,
// legend, and toolbar staying fixed in both position AND scale at all times. Drag-to-pan is
// still NOT reintroduced — panning stays exactly as it already was, via the shell's native
// scrollbars (overflow:auto); zoom only changes how much content there is to scroll through,
// using the same applySizeAtScale() the width-first autofit above already relies on.
//
// Trackpad pinch is delivered by every major browser as a `wheel` event with `ctrlKey:true`
// (a synthetic flag — it does not mean the physical Ctrl key is actually held down; this is
// the standard cross-browser convention apps use to tell a pinch gesture apart from an
// ordinary scroll). Treating every wheel event inside the canvas as zoom, regardless of
// ctrlKey, covers both a literal mouse-wheel notch and a trackpad pinch with one handler.
const ZOOM_MIN_MULT=0.4, ZOOM_MAX_MULT=6;           // how far below/above the autofit scale
                                                    // (baseScale) the user may zoom
function zoomAt(clientX,clientY,deltaY){
 const shell=svg.parentElement; if(!shell) return;
 const shellRect=shell.getBoundingClientRect();
 const cx=clientX-shellRect.left, cy=clientY-shellRect.top;          // cursor pos within the shell's viewport
 const svgX=shell.scrollLeft+cx, svgY=shell.scrollTop+cy;            // same point, in the svg's own coordinate space
 const contentX=(svgX-tx)/scale, contentY=(svgY-ty)/scale;           // that point in content-space — invariant across zoom
 const factor=Math.exp(-deltaY*0.0015);
 const newScale=Math.min(Math.max(scale*factor,baseScale*ZOOM_MIN_MULT),baseScale*ZOOM_MAX_MULT);
 const dim=applySizeAtScale(newScale); if(!dim) return;
 scale=dim.s; tx=dim.offX; ty=dim.offY; apply();
 const newSvgX=tx+contentX*scale, newSvgY=ty+contentY*scale;         // same content point, at the new scale
 shell.scrollLeft=newSvgX-cx; shell.scrollTop=newSvgY-cy;            // re-centre it back under the cursor
}
window.addEventListener('wheel',(e)=>{
 const shell=svg.parentElement;
 if(shell && shell.contains(e.target)){
  e.preventDefault();
  zoomAt(e.clientX,e.clientY,e.deltaY);
 } else if(e.ctrlKey){
  // Pinch (or literal ctrl+wheel) anywhere OUTSIDE the canvas — block the browser's native
  // whole-page zoom instead of letting it through; the header/legend/toolbar must never change
  // scale, and there's no diagram under the cursor here to redirect the gesture to instead.
  e.preventDefault();
 }
},{passive:false});
// ---- drag-to-pan, confined to the canvas ------------------------------------------------
// Reinstated — an earlier pass through this file explicitly did NOT bring drag-to-pan back
// alongside wheel-zoom (see the "wheel zoom" comment above, which still says so; left as
// history rather than rewritten, since it was accurate when written), reasoning that the
// shell's native scrollbars already covered panning. A later, equally explicit requirement
// asks for it directly: once zoomed in, click-and-drag on the canvas must reposition the
// viewport, confined to the canvas, without touching the header/footer/legend/toolbar.
//
// Delegated to `shell` itself (not per-node listeners) so a drag started ON a node pans just
// as well as one started on empty canvas — standard behaviour for diagram/map tools. Pointer
// Events (not mouse events) are used so mouse, pen, and touch all work through one code path.
// A small movement threshold (PAN_THRESHOLD) distinguishes an actual drag from a plain click:
// below it, nothing happens differently and the eventual 'click' still reaches the
// node/background handlers below exactly as before (selection, drawer, highlight-lock
// release); at or above it, the gesture is marked as a drag and the capture-phase listener
// further down swallows the resulting 'click' before it can reach any node or the
// background-clear handler — otherwise every pan would ALSO toggle a node's selection lock or
// clear one, as if it had been clicked.
//
// setPointerCapture is deliberately called ONLY once real movement crosses PAN_THRESHOLD, not
// on every pointerdown — this fixes a real regression, not a hypothetical one: capturing
// unconditionally on pointerdown retargets the eventual mouseup/click to the CAPTURING element
// (`shell`) per the Pointer Events spec, not to whatever node the cursor is actually over. That
// silently broke node selection entirely for ordinary clicks (a node's own 'click' listener,
// living below `shell` in the tree, was never reached — dispatch starts at the retargeted
// target and only bubbles UP from there, so a descendant's listener is skipped outright), while
// hover kept working, which is exactly the "click no longer highlights, only hover does" bug
// this was built to fix. Only capturing once a drag is confirmed real means an ordinary click
// never triggers capture at all, so its click event dispatches normally, hitting the node under
// the cursor first exactly as before this feature existed. (setPointerCapture still keeps an
// ACTUAL drag going even if the cursor leaves the shell mid-gesture, which fast drags routinely
// do — that guarantee is preserved, just deferred to the point where we know it's needed.)
let panning=false, panMoved=false, panStartX=0, panStartY=0, panStartScrollL=0, panStartScrollT=0, panPointerId=null;
const PAN_THRESHOLD=4;
(function(){
 const shell=svg.parentElement; if(!shell) return;
 shell.addEventListener('pointerdown',(e)=>{
  if(e.button!==0) return;                          // primary mouse button / primary touch point only
  panning=true; panMoved=false;
  panStartX=e.clientX; panStartY=e.clientY;
  panStartScrollL=shell.scrollLeft; panStartScrollT=shell.scrollTop;
  panPointerId=e.pointerId;
 });
 shell.addEventListener('pointermove',(e)=>{
  if(!panning) return;
  const dx=e.clientX-panStartX, dy=e.clientY-panStartY;
  if(!panMoved && (Math.abs(dx)>PAN_THRESHOLD||Math.abs(dy)>PAN_THRESHOLD)){
   panMoved=true;
   try{shell.setPointerCapture(panPointerId);}catch(_){}   // only now — see the comment above
   shell.classList.add('panning');
  }
  if(panMoved){ shell.scrollLeft=panStartScrollL-dx; shell.scrollTop=panStartScrollT-dy; }
 });
 const endPan=(e)=>{
  if(!panning) return;
  panning=false;
  shell.classList.remove('panning');
  if(panMoved){ try{shell.releasePointerCapture(e.pointerId);}catch(_){} }
 };
 shell.addEventListener('pointerup',endPan);
 shell.addEventListener('pointercancel',endPan);
 // Capture phase: runs before the event reaches the node/background 'click' handlers below,
 // so stopping it here means a drag never also fires a click on whatever the cursor happened
 // to end the gesture over.
 shell.addEventListener('click',(e)=>{
  if(panMoved){ e.stopPropagation(); e.preventDefault(); }
  panMoved=false;
 },true);
})();
// Clicking empty canvas releases an active highlight lock (see toggleLock()) — this is the
// "clicks outside the selected node" release. A click on a NODE never reaches this handler
// (its own listener calls stopPropagation()), so this only fires for genuine background clicks.
// Suppressed entirely while View Details mode is ON: that mode's whole point is a drawer (and
// the highlight that goes with it) that survives clicking away from the diagram — only turning
// the mode off, or its own × button, may close it (see the viewDetailsBtn wiring below).
svg.addEventListener('click',()=>{ if(viewDetailsMode)return; if(selectedId){clearSelected();clearAllHL();} });

function chip(txt,cls){return `<span class="pill ${cls}">${txt}</span>`;}
const TYPELABEL={start:'Start',end:'End',agent:'Process step',control:'Control step',

function openDrawer(n){
 document.getElementById('d-title').textContent=n.label;
 const st=STROKE[n.type]||'#3860be';

 const KINDNAME=Object.fromEntries(LEGE.map(([k,lab])=>[k,lab]));   // 'seq'->'Sequence flow' etc — reuse
   // the legend's own kind→name mapping so the drawer's language can't drift from the legend's.
 let h=`<div class="dsec"><span class="pill" style="background:${FILL[n.type]};color:${st};border:1px solid ${st}">${TYPELABEL[n.type]||'Step'}</span>`;

 const laneDef=LY.lanes.find(l=>l.key===n.lane);
 if(laneDef) h+=`<span class="pill t-portal">${laneDef.name.split('·')[0].trim()}</span>`;
 h+='</div>';
 // A "Reference code" section (n.sub) used to render here — removed entirely per an explicit
 // "reference code should no longer be displayed on any node" requirement, matching the same
 // removal from the canvas label above. n.sub itself is untouched in the data.
 h+=sec('What this does', bio?bio.does:(n.desc||''));
 if(bio){ h+=sec('What it needs to start', bio.needs); h+=sec('What it produces', bio.makes); h+=sec('For example', bio.example); }
 else { h+=listSec('What it needs to start', n.inputs); h+=listSec('What it produces', n.outputs); }
 if(n.branches&&n.branches.length) h+=`<div class="dsec"><div class="k">Possible outcomes</div><ul>${n.branches.map(b=>`<li><b>${b.label}</b> → ${NID[b.to]?NID[b.to].label:b.to}</li>`).join('')}</ul></div>`;

 if(n.agents&&n.agents.length){

   return row ? `<li><b>${row.Name||aid}</b> (${row['Agent Type']||'agent'}${row['Parent Portal']?', '+row['Parent Portal']:''})${row['Purpose / Feature']?' — '+row['Purpose / Feature']:''}</li>` : `<li>${aid}</li>`;
  });

 }

 // panel is supposed to surface; that detail previously only existed as a tiny canvas label,

 const predFlows=FLOWS.filter(f=>f.to===n.id);
 const succFlows=FLOWS.filter(f=>f.from===n.id);
 const pathItem=(arrow,other,f)=>{
  const label=NID[other]?NID[other].label:other;

  return `<div class="path-item"><span class="arrow">${arrow}</span><span><b>${label}</b>${detail?` <span class="detail">(${detail})</span>`:''}</span></div>`;
 };
 // Incoming/Outgoing rendered as one bordered two-column box (INCOMING PATHS / OUTGOING
 // PATHS side by side) rather than as two separate pill rows — matching a supplied reference
 // layout. A node with no outgoing connector that isn't the designated "end" type is
 // genuinely ambiguous (does the journey stop here, wait, or hand off outside this diagram?);
 // that anomaly notice still renders in the outgoing column, styled distinctly in the error
 // colour, rather than being silently replaced by an empty/"None" column.
 if(predFlows.length||succFlows.length||n.type!=='end'){
  const incoming=predFlows.length
   ? predFlows.map(f=>pathItem('←',f.from,f)).join('')
   : '<div class="path-item" style="color:var(--muted)">None</div>';
  const outgoing=succFlows.length
   ? succFlows.map(f=>pathItem('→',f.to,f)).join('')
   : (n.type!=='end'
      ? '<div class="path-item" style="color:#bd0000"><span class="arrow">→</span><span>No further step in this process — check whether this is a genuine end point, a wait/pause state, or a gap in the source data</span></div>'
      : '<div class="path-item" style="color:var(--muted)">None</div>');
  h+=`<div class="dsec-paths"><div class="col"><div class="k">Incoming paths</div>${incoming}</div><div class="col"><div class="k">Outgoing paths</div>${outgoing}</div></div>`;
 }
 h+=listSec('Rules &amp; safeguards', n.controls);
 h+=listSec('Systems involved', n.systems);
 if(n.contracts&&n.contracts.length){const seen={};let block='';
   n.contracts.forEach(cid=>{const p=(D.biz&&D.biz.contractPlain)?D.biz.contractPlain[cid]:null; if(p&&!seen[cid]){seen[cid]=1; block+=`<li>${p}</li>`;}});
   if(block) h+=`<div class="dsec"><div class="k">How the teams work together</div><ul>${block}</ul></div>`;}
 document.getElementById('d-body').innerHTML=h;
 drawer.classList.add('open');
 setSelected(n.id);   // no-op if the caller (dblclick) already locked this node; kept so any
                       // future direct call to openDrawer() still locks the highlight too
}

// independent interactions now (dblclick opens the drawer without unlocking on close; the lock

// currently keeping the drawer open — the × button and the toggle button are two paths to the
// same "exit the pinned inspection panel" action, kept in sync so the toggle's own on/off state
// never silently goes stale relative to whether the drawer is actually showing.
document.getElementById('d-close').onclick=()=>{drawer.classList.remove('open'); if(viewDetailsMode)setViewDetails(false);};

                    // ids against M.agents (the agent catalogue) — the ONLY remaining consumer

// ---- export (SVG / JPG / PDF) — self-contained, offline
// Hardcoded literal hex here (not var()) is intentional: an exported .svg opened standalone
// has no access to the parent page's CSS custom properties, so this must mirror the live
// palette in absolute values. Keep in sync with the Vodafone token mapping in the live <style>
// block and in reference/DESIGN_SYSTEM.md whenever either changes. THIS IS NOT OPTIONAL
// HOUSEKEEPING: `.legcat` was missing from this block entirely for several rounds after it was
// added to the live legend styling, and `.leglabel` here was still the pre-redesign 11px/no-
// weight version — meaning every exported file rendered the legend with completely different,
// out-of-date typography than the live view, independent of and in addition to the
// letter-spacing measurement bug in buildLegend() itself (see there for that). Any class the
// live `<style>` block adds or changes that affects a STATIC visual needs its export-facing
// equivalent added or updated here in the SAME change, not as a follow-up. This now INCLUDES
// the highlight-lock state (.dim / .edge.hlpath / .node.selected): exports are required to
// preserve whatever the user currently has locked/highlighted rather than exporting a clean
// unhighlighted diagram, so exportSVGString() below no longer strips these classes and their
// visual effect has to actually exist here for a standalone-opened export file to show it (the
// `ar-hl` highlighted-arrowhead marker needs no equivalent entry — it's a real SVG <marker>
// element cloned as part of the DOM, not a CSS rule, so it always travels with the clone as-is).
const EXPORT_CSS=`
text{font-family:"Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;}
.lbl{font-size:14px;font-weight:600;fill:#1f1f1f;}
.lanelabel{font-size:14px;font-weight:700;fill:#4a4d4e;}
.lanehint{font-size:14px;fill:#6f7375;}
.leglabel{font-size:14px;font-weight:600;fill:#333333;}
.legcat{font-size:14px;font-weight:800;fill:#6f7375;letter-spacing:.08em;}
.phasehdr{font-size:14px;font-weight:700;fill:#ffffff;dominant-baseline:middle;}
.elabel{font-size:14px;font-style:italic;font-weight:700;fill:#4a4d4e;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round;}
.edge{fill:none;stroke-linejoin:round;}
.edge.seq{stroke:#4a4d4e;stroke-width:1.7;}
.edge.data{stroke:#3860be;stroke-width:1.5;stroke-dasharray:5 4;}
.edge.cond{stroke:#8a5cc9;stroke-width:1.6;stroke-dasharray:2 4;}
.edge.esc{stroke:#f5b400;stroke-width:2;}
.edge.err{stroke:#bd0000;stroke-width:1.8;stroke-dasharray:4 4;}
.dim{opacity:.05;filter:grayscale(1) brightness(1.15);}
.edge.hlpath{stroke:#e60000 !important;stroke-width:3.5 !important;filter:drop-shadow(0 0 3px rgba(230,0,0,.55)) !important;}
.node.selected .box{stroke:#e60000 !important;stroke-width:4px !important;filter:drop-shadow(0 0 6px rgba(230,0,0,.65)) drop-shadow(0 1px 3px rgba(0,0,0,.25));}
.node.selected{opacity:1 !important;}`;
function exportSVGString(){
 const clone=svg.cloneNode(true);
 clone.setAttribute('viewBox',`0 0 ${LY.totalW} ${LY.totalH}`);
 clone.setAttribute('width',LY.totalW); clone.setAttribute('height',LY.totalH);
 clone.removeAttribute('style');
 // The legend is the only one of the three SVG-drawn overlays still hidden live (in favour of
 // its own sticky HTML footer, which has no equivalent in a static file) — the lane gutter and
 // phase header are ordinary, always-visible SVG content now (no frozen rows/columns), so
 // there's nothing left to restore for either of them here.
 const clonedLeg=clone.querySelector('#legendLayer'); if(clonedLeg) clonedLeg.style.opacity='';
 // Literal width/height above keep the file's true pixel dimensions for tools
 // that need them (Illustrator, Inkscape, print). Without this style, a browser
 // opening the .svg directly (not through this page's own CSS) renders it at
 // that literal size with no scale-to-fit — for a wide diagram that means only
 // the top-left corner is visible on load, requiring manual scroll/zoom even
 // though every node and connector is present in the file. This makes it size
 // itself to whatever it's opened in, same as the in-app canvas does.
 clone.setAttribute('style','width:100%;height:auto;max-width:100%;display:block;');
 const cvp=clone.querySelector('#vp'); cvp.setAttribute('transform','translate(0,0) scale(1)');
 // .dim/.hlpath (hover/lock highlight) and .selected (the locked node's own outline) are
 // deliberately NOT stripped here — exports must preserve whatever highlight/selection state
 // is currently active, so the exported file matches what the user is actually looking at. See
 // the EXPORT_CSS comment above for the corresponding style rules this now depends on.
 const bg=document.createElementNS(SVGNS,'rect');
 bg.setAttribute('x',0);bg.setAttribute('y',0);bg.setAttribute('width',LY.totalW);bg.setAttribute('height',LY.totalH);bg.setAttribute('fill','#ffffff');
 cvp.insertBefore(bg,cvp.firstChild);
 const st=document.createElementNS(SVGNS,'style'); st.textContent=EXPORT_CSS;
 clone.insertBefore(st,clone.firstChild);
 return '<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone);
}
function downloadBlob(blob,name){const a=document.createElement('a');const u=URL.createObjectURL(blob);
 a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},150);}
// scaleFactor is a REQUEST, not a guarantee — clamped below so the resulting canvas never
// exceeds a safe browser canvas-area limit. Root cause of a real "JPG/PDF export taking a very
// long time, or not completing at all" bug: Chrome's own canvas area cap is 268,435,456px
// (2^28); a flat 2x multiplier on a wide diagram (Fibre, ~17000px native width) produced a
// ~280-megapixel canvas, over that cap. Confirmed empirically, not just from the spec number —
// sampling a pixel from the middle of that canvas after drawImage() returned fully transparent
// black ([0,0,0,0]), not even the white background fill this function paints FIRST, meaning the
// canvas never held real pixel data at all past that size; canvas.toBlob() was then still
// unresolved 20+ seconds later, apparently hanging while trying to encode a canvas that was
// silently empty the whole time. A second diagram (Mobile Postpaid Activation) sits at ~80% of
// the same limit — close enough that a modest future model growth would tip it over too, so
// this is a general safety clamp, not a Fibre-specific patch.
function rasterize(scaleFactor){return new Promise((resolve,reject)=>{
 const MAX_CANVAS_AREA=200000000;   // safety margin under Chrome's 268,435,456px cap
 const nativeArea=LY.totalW*LY.totalH;
 // Never below 1x — even the widest current diagram is safely under the area cap at native
 // resolution, so a scale-down always has room to land somewhere between 1x and the request.
 const s=(nativeArea*scaleFactor*scaleFactor>MAX_CANVAS_AREA)
  ? Math.max(1,Math.sqrt(MAX_CANVAS_AREA/nativeArea)) : scaleFactor;
 const blob=new Blob([exportSVGString()],{type:'image/svg+xml;charset=utf-8'});
 const url=URL.createObjectURL(blob); const img=new Image();
 img.onload=()=>{const cw=Math.round(LY.totalW*s),ch=Math.round(LY.totalH*s);
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);ctx.drawImage(img,0,0,cw,ch);
  URL.revokeObjectURL(url);resolve(cv);};
 img.onerror=(e)=>{URL.revokeObjectURL(url);reject(e);}; img.src=url;});}
function jpegToPdf(jpeg,wPx,hPx){
 // Page size is DERIVED from the diagram's own aspect ratio (content + a fixed
 // margin), not forced onto a fixed A3 sheet. These diagrams are wide swimlane
 // layouts (often 5:1-7:1) — fitting that onto a fixed-height A3 page left the
 // image filling the width but only a thin vertical sliver, with huge blank
 // bands above/below. Sizing the page to the content instead means the image
 // always fills the full page (minus the margin), matching the JPG export.
 const margin=24, maxContent=1600;                   // generous content cap, points
 const aspect=wPx/hPx;
 let dW,dH;
 if(aspect>=1){ dW=maxContent; dH=dW/aspect; } else { dH=maxContent; dW=dH*aspect; }
 const pageW=dW+2*margin, pageH=dH+2*margin;
 const x=margin,y=margin;
 const enc=(s)=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff;return a;};
 const parts=[];let len=0;const off={};
 const push=(u8)=>{parts.push(u8);len+=u8.length;}; const ps=(s)=>push(enc(s));
 ps('%PDF-1.3\n%\xFF\xFF\xFF\xFF\n');
 const so=(n)=>{off[n]=len;};
 so(1); ps('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 so(2); ps('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
 so(3); ps(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pageW.toFixed(2)} ${pageH.toFixed(2)}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>\nendobj\n`);
 const content=`q\n${dW.toFixed(2)} 0 0 ${dH.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm\n/Im0 Do\nQ\n`;
 so(4); ps(`4 0 obj\n<< /Length ${content.length} >>\nstream\n${content}endstream\nendobj\n`);
 so(5); ps(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${wPx} /Height ${hPx} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpeg.length} >>\nstream\n`);
 push(jpeg); ps('\nendstream\nendobj\n');
 const xo=len; let xr='xref\n0 6\n0000000000 65535 f \n';
 for(let i=1;i<=5;i++) xr+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 ps(xr); ps(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xo}\n%%EOF`);
 const total=new Uint8Array(len);let o=0;for(const p of parts){total.set(p,o);o+=p.length;}
 return new Blob([total],{type:'application/pdf'});
}
const FNAME='Agent_Ecosystem_Business_Process_Diagram';
const exBtn=document.getElementById('exportBtn'), exMenu=document.getElementById('exportMenu');
exBtn.addEventListener('click',(e)=>{e.stopPropagation();exMenu.classList.toggle('open');});
document.addEventListener('click',()=>exMenu.classList.remove('open'));
exMenu.addEventListener('click',(e)=>e.stopPropagation());
exMenu.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
 const fmt=b.dataset.fmt; exMenu.classList.remove('open');
 const prev=exBtn.textContent; exBtn.textContent='Exporting…';
 const done=()=>{exBtn.textContent=prev;};
 try{
  if(fmt==='svg'){downloadBlob(new Blob([exportSVGString()],{type:'image/svg+xml;charset=utf-8'}),FNAME+'.svg');done();}
  else if(fmt==='jpg'){rasterize(2).then(cv=>cv.toBlob(bl=>{downloadBlob(bl,FNAME+'.jpg');done();},'image/jpeg',0.95)).catch(()=>{alert('Export failed.');done();});}
  else if(fmt==='pdf'){rasterize(2).then(cv=>cv.toBlob(bl=>bl.arrayBuffer().then(buf=>{downloadBlob(jpegToPdf(new Uint8Array(buf),cv.width,cv.height),FNAME+'.pdf');done();}),'image/jpeg',0.92)).catch(()=>{alert('Export failed.');done();});}
 }catch(err){alert('Export failed.');done();}
}));

// Keeps --header-h (see .drawer's own comment) in sync with the header's REAL rendered height,
// not a hardcoded guess — a long title can wrap to two lines at a narrow viewport, growing the
// header, and the drawer must never overlap it regardless. Run alongside fit() everywhere fit()
// itself runs (load/resize) since both respond to the same triggers.
function syncDrawerTop(){
 const top=document.querySelector('.top'); if(!top) return;
 document.documentElement.style.setProperty('--header-h', top.getBoundingClientRect().height+'px');
}
