<meta charset="utf-8">
<title>Bill Formatter — XML Ingestion, Invoice Generation, Delivery &amp; Configuration</title>
<style>
:root{
  --charcoal:#25282b; --charcoal-2:#1a1c1e;
  --panel:#ffffff; --line:#d8d8d8; --ink2:#4a4d4e; --accent:#e60000;
  --ink:#111; --mute:#5A5A66; --navy:#2A1B9E;
  --radius-button:2px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:90;
  background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));
  color:#f4f4f4;padding:var(--space-5) var(--space-6) var(--space-4)}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hgroup{display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.h1main{font-size:24px;font-weight:800;color:#fff;line-height:1.25}
.h1sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.72);line-height:1.3;margin-top:1px}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.arow{display:flex;align-items:center;gap:var(--space-2)}
.btn,.phaseselect{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:var(--radius-button);padding:var(--space-2) var(--space-3);
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover,.phaseselect:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.phaseselect{min-width:190px;padding-right:22px}
.searchctrl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius-button);padding:0 var(--space-3);height:31px}
.searchctrl input{border:0;outline:0;font-size:12px;font-weight:600;color:var(--ink2);
  width:200px;font-family:inherit;background:none}
.searchctrl.no-match input{color:var(--accent)}
.hits{font-size:11px;font-weight:700;color:var(--mute);min-width:52px;text-align:right}
.expwrap{position:relative}
.expmenu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-button);box-shadow:0 18px 44px rgba(0,0,0,.22);display:none;z-index:120;min-width:180px}
.expmenu.open{display:block}
.expmenu button{display:block;width:100%;text-align:left;border:0;background:none;
  padding:9px 14px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.expmenu button:hover{background:#f2f2f2;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:rgba(255,255,255,.76);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
i{width:13px;height:13px;display:inline-block;flex:none}
.dot{border-radius:50%}
.dia{background:#fff;border:2px solid #2A1B9E;transform:rotate(45deg);width:10px;height:10px}
.ring{border-radius:50%;background:#0F9B8E;box-shadow:0 0 0 2px var(--charcoal-2) inset,0 0 0 3px #0F9B8E}
.sq{border-radius:4px;background:#7A2BD6}
.dash{height:0;border-top:2px dashed #3B7DD8;width:18px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.chipd{background:none;border:1px dashed rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.scroll{overflow-x:auto;overflow-y:hidden;padding:0 0 28px}
.scroll svg{display:block}
#printdoc{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.printing>header,body.printing>.scroll{display:none!important}
  body.printing #printdoc{display:block}
  /* one printed sheet per slice: fixed page box, SVG letterboxes itself inside it */
  .pg{break-after:page;page-break-after:always;
      height:100vh;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pgcap{flex:none}
  .pg svg{flex:1;min-height:0;width:100%;height:100%}
  .pgcap{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9pt;color:#333;border-bottom:1px solid #ccc;
    padding-bottom:2mm;margin-bottom:3mm}
  .pgcap b{font-weight:800}
}
</style>
<header>
  <div class="hrow">
    <div class="hgroup">
      <div class="eyebrow">BPMN Process Flow</div>
      <div class="h1main">Bill Formatter</div>

    <div class="actions">

          <button class="btn primary" id="expBtn">Export</button>

            <button data-fmt="png">Export as PNG</button>
            <button data-fmt="pdf">Export as PDF (paginated)</button>
          </div>
        </div>
      </div>
      <div class="arow">
        <span class="hits" id="hits"></span>
        <div class="searchctrl" id="searchCtrl">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#6f7375" stroke-width="1.8">
            <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search node…" autocomplete="off">
        </div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#2A1B9E"></i> Primary-path step</span>
    <span><i class="dia"></i> Decision / validation</span>
    <span><i class="ring"></i> Milestone</span>
    <span><i class="dot" style="background:#F01010"></i> Error / rejection — journey ends</span>
    <span><i class="dot" style="background:#C07800"></i> Recovery, retry or side flow</span>
    <span><i class="sq"></i> Escalation / approval task</span>
    <span><i class="dot" style="background:#12A038"></i> Happy-path branch label</span>
    <span><i class="dash"></i> Data flow</span>
    <span><i class="chip"></i> System / actor tag</span>
  </div>
</header>

1360.0 678.55 L 2060 678.55 L 2060 229" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="1349.0" y="728.5" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 1349.0 728.5)" text-anchor="middle">language/currency/tax/retention feeds generation</text><path d="M 760.0 1228 L 760.0 678.55 L 2060 678.55 L 2060 229" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="749.0" y="728.5" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 749.0 728.5)" text-anchor="middle">interactive PDF layout feeds generation</text><path d="M 1960.0 1228 L 1960.0 822" fill="none" stroke="#3B7DD8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ahb)"/><text x="1949.0" y="1025.0" font-size="11" font-weight="700" fill="#3B7DD8" transform="rotate(-90 1949.0 1025.0)" text-anchor="middle">template feeds report generation</text><path d="M 1660.0 822 L 1660.0 927.05 L 1810.0 927.05 L 1810.0 1013" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="1649.0" y="917.5" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 1649.0 917.5)" text-anchor="middle">operator navigates to configuration</text><path d="M 860.0 613 L 860.0 798" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="849.0" y="705.5" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 849.0 705.5)" text-anchor="middle">Unrecoverable after exhausted retries</text><path d="M 2210.0 613 L 2210.0 714.75 L 860.0 714.75 L 860.0 798" fill="none" stroke="#C07800" stroke-width="2.2" marker-end="url(#aha)"/><text x="2199.0" y="705.5" font-size="11" font-weight="700" fill="#C07800" transform="rotate(-90 2199.0 705.5)" text-anchor="middle">Unrecoverable after exhausted retries</text><g id="hl"></g>

<script>
const NODES=[{"id": "start", "x": 60, "y": 215, "r": 22, "lb": "XML Ready in Mediation Zone", "t": "1 xml ready in mediation zone mediation zone / oracle brm"}, {"id": "xml_retrieve", "x": 460, "y": 215, "r": 20, "lb": "Retrieve XML (Regular / Trial / Hot)", "t": "2 retrieve xml (regular / trial / hot) bfr_seq_001/003/004 formatter pulls invoice xml from the mediation zone predefined file location for regular, trial and hot bills, validates the xml format, processes retrieval batch-wise, prevents duplicate xml processing and logs retrieval status. uses an atomic write pattern (temp location/filename, write, close, verify, then rename/move to final destination) so no partially written xml is ever readable downstream. bill formatter (dxp)"}, {"id": "xml_validate", "x": 860, "y": 215, "r": 24, "lb": "Validate XML (Schema + Mandatory Data)", "t": "3 validate xml (schema + mandatory data) bfr_seq_002 bill formatter loads the xml and performs schema validation to ensure file structure is valid, then validates mandatory billing information required for invoice generation. only xml passing both checks proceeds to invoice generation; a failure is marked failed xml with a recorded reason and made visible in the bill formatter portal for reprocessing after corrective action. bill formatter (dxp)"}, {"id": "xml_parse", "x": 1260, "y": 215, "r": 20, "lb": "Parse & Load XML", "t": "4 parse & load xml bfr_seq_010 parses the validated xml and loads the invoice header, invoice summary and invoice details. captures a log for tracking the loading process. bill formatter (dxp)"}, {"id": "batch_create", "x": 1660, "y": 215, "r": 20, "lb": "Create Batch", "t": "5 create batch bfr_seq_013/066 bill formatter receives invoice xml files either through automated batch pickup from brm/mediation zone or manual xml/zip upload, loads the received xml files and creates a processing batch. batch creation/upload is restricted to authorised users. bill formatter (dxp)"}, {"id": "invoice_generate", "x": 2060, "y": 215, "r": 20, "lb": "Generate Invoice (Bill Type x Segment x Format)", "t": "6 generate invoice (bill type x segment x format) bfr_seq_035-060/088/089 extracts the invoice template for the applicable customer segment (consumer mobile, consumer fixed line, enterprise, black, bulk sms, iot) and bill type (regular, trial, hot), then generates the invoice in the required output format (pdf in english/arabic, xls, csv) per bf to identify the language type identifier. enterprise outputs additionally generate a call detail csv. regular and hot bill outputs are sent to siebel; trial bill output is stored internally for audit/validation only and not sent to the customer. bill formatter (dxp)"}, {"id": "invoice_review", "x": 2460, "y": 215, "r": 24, "lb": "Review & Approve Invoice", "t": "7 review & approve invoice bfr_seq_063/092 role-based users review generated invoices/documents and approve or reject them before customer despatch, via search in the bill formatter portal. governed by an on/off review-and-approval switch, default off (p-12). billing operations user"}, {"id": "channel_avail", "x": 2860, "y": 215, "r": 20, "lb": "Make Invoice Available to Channels", "t": "8 make invoice available to channels bfr_seq_093/184 after successful invoice processing, bill formatter generates the invoice output in the required format (pdf/xls/csv based on invoice type and customer segment) and makes it available to downstream channels. trial batches are excluded from channel upload; hot bill availability is real-time after generation; regular bill invoices are made available to siebel and other supported customer channels. bill formatter (dxp)"}, {"id": "invoice_masking_dispatch", "x": 3260, "y": 215, "r": 20, "lb": "Apply Masking Before Despatch", "t": "9 apply masking before despatch bfr_seq_099/142 bill formatter generates and stores the original invoice output after successful generation, then generates a separate masked invoice file for applicable invoice types based on configured masking rules. the original customer invoice remains unchanged and immutable; sensitive information is masked in the despatched copy per configured rules. bill formatter (dxp)"}, {"id": "email_eligibility", "x": 3660, "y": 215, "r": 24, "lb": "Determine Email Eligibility & Template", "t": "10 determine email eligibility & template bfr_seq_094/185 bill formatter identifies invoices eligible for email distribution after successful generation and determines the applicable email template based on customer type, invoice type and language, then attaches the generated invoice document. trial invoices do not trigger email; only successfully generated invoices are eligible. bill formatter (dxp)"}, {"id": "email_send", "x": 4060, "y": 215, "r": 20, "lb": "Send Invoice Email (SMTP)", "t": "11 send invoice email (smtp) bfr_seq_094/144/145/185 attaches the generated invoice document (pdf/xls/csv) and despatches via smtp integration, in the applicable language (english and arabic supported). dynamic email fields are configurable; a configurable list of non-triable (skipped) email ids prevents despatch to excluded addresses. delivery channels"}, {"id": "multi_channel_send", "x": 4460, "y": 215, "r": 20, "lb": "Multi-Channel Invoice Communication", "t": "12 multi-channel invoice communication bfr_seq_095/143 supports invoice communication through sms, whatsapp business, web channel and email. invoice messages may include pdf or a url-based invoice reference and apply customer-specific masking rules before despatch. whatsapp business access, bsp approval, pricing and privacy/regulatory guidelines are managed by vf. delivery channels"}, {"id": "crm_notify_log", "x": 4860, "y": 215, "r": 20, "lb": "CRM Notification Logging", "t": "13 crm notification logging bfr_seq_186 after an invoice email is sent, bill formatter creates a notification log entry containing the invoice reference and email communication details, and sends the notification to siebel crm. a crm notification record is created only for invoices processed for customer communication. siebel crm"}, {"id": "end_delivered", "x": 5260, "y": 215, "r": 27, "lb": "Invoice Delivered", "t": "14 invoice delivered delivery channels"}, {"id": "reports_account_mgr", "x": -390.0, "y": 595, "r": 18, "lb": "Billing Reports Accounts Manager", "t": "billing reports accounts manager bfr_seq_112 business users configure, modify or delete report types per account number (account name, report type, list of account numbers). enterprise billing reports are generated only for accounts configured here. billing operations user"}, {"id": "resend_request", "x": -90.0, "y": 595, "r": 18, "lb": "Resend Request from Customer/CRM", "t": "resend request from customer/crm bfr_seq_187 customer requests a bill resend through siebel crm for a previously generated invoice. siebel invokes the bill formatter resend bill service, passing the account number and bill reference. only previously generated invoices can be resent; existing api signature remains unchanged to support parallel run. siebel crm"}, {"id": "xml_ingest_alt", "x": 210.0, "y": 595, "r": 18, "lb": "Data Ingestion (XML or DB Table)", "t": "data ingestion (xml or db table) bfr_seq_005 bill formatter must have the capability to ingest data for invoice generation either as xml or directly from a database table, the exact mechanism to be decided at design time. bill formatter (dxp)"}, {"id": "xml_manual_upload", "x": 510.0, "y": 595, "r": 18, "lb": "Manual XML/ZIP Upload", "t": "manual xml/zip upload bfr_seq_013/066 authorised users may upload invoice xml/zip files manually through the bill formatter portal as an alternative to automated brm/mediation zone pickup. batch creation/upload is restricted to authorised users. bill formatter portal / admin console"}, {"id": "xml_failed", "x": 860.0, "y": 595, "r": 24, "lb": "Failed XML \u2014 Portal Visibility & Reprocess", "t": "failed xml \u2014 portal visibility & reprocess bfr_seq_002 failed xml records are visible in the bill formatter portal with an associated failure reason and processing status. billing operations users review failed xml records and initiate reprocessing after corrective action; retry/reprocess capability is required. batch statistics and processing status are updated to reflect successful and failed xml outcomes. bill formatter portal / admin console"}, {"id": "csv_watch", "x": 1260.0, "y": 595, "r": 18, "lb": "Supporting CSV Detection", "t": "supporting csv detection bfr_seq_147 system detects when a supporting csv file (expected alongside certain xml) is not received. a scheduler checks every 10 minutes (p-01); if the supporting csv is still missing four hours after xml receipt (p-02), an alert email is sent to configured recipients. bill formatter (dxp)"}, {"id": "batch_console", "x": 1660.0, "y": 595, "r": 18, "lb": "Batch Console", "t": "batch console bfr_seq_012/014/065/067 provides billing operations users with visibility of batch processing status, invoice generation status, email delivery status and xml processing status for a selected batch, at both batch level and bill/invoice level. status values: failed, ready, report generated, invoice (pdf/xls/csv) completed, email sent, failed sending email, failed xml data. bill formatter portal / admin console"}, {"id": "batch_action_menu", "x": 1360.0, "y": 810, "r": 24, "lb": "Batch Action Menu", "t": "batch action menu bfr_seq_015/068 batch-level action menu: view bills, view statistics, overall report, detail report, failed report, failed email report, send overall report, send email. each option triggers its corresponding action. bill formatter portal / admin console"}, {"id": "dashboard", "x": 1660.0, "y": 810, "r": 18, "lb": "Operational Dashboard & Statistics", "t": "operational dashboard & statistics bfr_seq_107/108/109 provides operational statistics for successful and failed invoices by batch, split by consumer and enterprise, plus average bill size statistics. graphical representation in admin console defaults to current month for large bills, failed xmls, daily resend bill, monthly volumes. includes failed email report export. bill formatter portal / admin console"}, {"id": "reports_generate", "x": 1960.0, "y": 810, "r": 18, "lb": "Generate Reports (Enterprise / Operational / Business)", "t": "generate reports (enterprise / operational / business) bfr_seq_104-113/130-134 generates enterprise reports (ge reports), operational reports and business reports, emailed using configured templates on daily/monthly/after bill run/adhoc frequency in pdf/csv/excel format. includes large-enterprise customer-specific reports (cdr_list_report, credit_file_report, invoice_report) and scheduled templates (bill run monitor, vlb, overall, internal, video bill). bill formatter (dxp)"}, {"id": "batch_reports", "x": 1210.0, "y": 1025, "r": 18, "lb": "Batch Reports (Overall / Detailed / Statistics)", "t": "batch reports (overall / detailed / statistics) bfr_seq_017/027-034/070/080-087/090 overall batch report summarises each generated bill/document per batch (delivery preference code 0=pdf only, 3=pdf+xls; document id unique per document). detailed batch report aggregates plan/extras/payment/dues at bill level with account tab and service-specific tabs. view statistics shows successful vs failed pdf counts with reasons. failed report and failed email report are downloadable in xls. hot bill generation failed report runs on a 4-hour interval (p-03) checking uploaded hot bills for failed status. bill formatter portal / admin console"}, {"id": "bill_action_menu", "x": 1510.0, "y": 1025, "r": 18, "lb": "Bill Action Menu (Batch Console)", "t": "bill action menu (batch console) bfr_seq_016/018-026/069/071-079 selecting view bill from the batch action menu lists bill details (id, process date, bill no, status, email, total size, this month due, total due, action). each bill row then exposes its own action menu: status log, download pdf, download xls, download xml, reprint bill, regenerate document, regenerate xml, send email. configurable list of non-triable (skipped) email ids suppresses email trigger where applicable. bill formatter portal / admin console"}, {"id": "config_console", "x": 1810.0, "y": 1025, "r": 18, "lb": "Admin Console \u2014 Centralised Configuration", "t": "admin console \u2014 centralised configuration bfr_seq_114/115 front-end admin console for billing operations covering batches, bills, hot bills, xml records, reports, translations, billing settings and role-based access. configuration records drill down centrally \u2014 selecting a batch id opens the invoices belonging to that batch, and configuration records open in a separate window/pop-up. bill formatter portal / admin console"}, {"id": "reports_download", "x": 2110.0, "y": 1025, "r": 18, "lb": "Download / Export Report", "t": "download / export report bfr_seq_105 bill formatter allows report download or export in pdf and excel formats, making generated reports available to billing operations users. bill formatter portal / admin console"}, {"id": "hotbill_failed_report", "x": 1910.0, "y": 595, "r": 18, "lb": "Hot Bill Generation Failed Alert", "t": "hot bill generation failed alert bfr_seq_090 identifies failed hot bill generation and sends an email alert/report. runs daily on a four-hour interval, checking uploaded hot bills for failed status. bill formatter (dxp)"}, {"id": "invoice_gen_failed", "x": 2210.0, "y": 595, "r": 24, "lb": "Invoice Generation Failed \u2014 Retry", "t": "invoice generation failed \u2014 retry bfr_seq_037/061 bill formatter identifies invoices that failed during processing or invoice generation, records the failure status and makes the failure information available in the bill formatter portal. billing operations reviews failed invoices and retries; retry/reprocess is role-based. bill formatter portal / admin console"}, {"id": "invoice_regenerate", "x": 2460.0, "y": 595, "r": 18, "lb": "Regenerate Invoice", "t": "regenerate invoice bfr_seq_062/091 billing operations initiates an invoice regeneration request for a specific invoice or batch; bill formatter validates the selection and, where the source xml has been regenerated or corrected, reprocesses it. regeneration includes retry and status reporting. bill formatter (dxp)"}, {"id": "email_failed", "x": 4060.0, "y": 595, "r": 19, "lb": "Failed Email \u2014 Report & Retry", "t": "failed email \u2014 report & retry bfr_seq_011/064/148 bill formatter reports total successful and failed emails per batch, account-wise and bill-wise, and provides a failed email report highlighting addresses for which the bill email could not be sent or attempted. report includes exclusion-list scenarios and invalid/failure scenarios; smtp delivery failure capture depends on smtp response/report data. bill formatter portal / admin console"}, {"id": "reprint_request", "x": 60.0, "y": 1240, "r": 18, "lb": "Reprint Request from CRM", "t": "reprint request from crm bfr_seq_101 bill formatter receives a bill reprint request from crm with account number, bill period and bill type details. siebel crm"}, {"id": "reprint_console", "x": -90.0, "y": 810, "r": 18, "lb": "Reprint Bill Console", "t": "reprint bill console bfr_seq_101/150 bill formatter retrieves the xml, generates the pdf and transfers it to the mediation zone, from where it goes to crm for delivery to the customer. console shows all reprints given: id, process date, bill number, status, email, total size, this month due, total due. reprint does not alter original invoice data; only an existing bill can be reprinted, with detailed/summarised type selection. bill formatter portal / admin console"}, {"id": "resend_send", "x": 210.0, "y": 810, "r": 18, "lb": "Resend Invoice Email", "t": "resend invoice email bfr_seq_187 bill formatter validates the bill reference, retrieves the previously generated invoice document and resends it by email. resend template can differ from the first-time email template. email delivery outcome is captured for status reporting. delivery channels"}, {"id": "reprint_action_menu", "x": 60.0, "y": 1025, "r": 18, "lb": "Reprint Bill Action Menu", "t": "reprint bill action menu bfr_seq_151-159 per-reprint-record action menu: status log, download pdf, download xls, download xml, reprint bill (with bill type summary/detailed and language english/arabic input), regenerate document, regenerate xml, send email. bill formatter portal / admin console"}, {"id": "hotbill_console", "x": 2860.0, "y": 595, "r": 18, "lb": "Hot Bill Register", "t": "hot bill register bfr_seq_160 displays hot bill details: id, process date, bill no, status, email, total size, this month due, total due, action. upon receipt of a hot bill request from siebel crm, brm calculates current billable charges and generates an invoice xml in the designated bill formatter input location. bill formatter portal / admin console"}, {"id": "hotbill_action_menu", "x": 2860.0, "y": 810, "r": 24, "lb": "Hot Bill Action Menu", "t": "hot bill action menu bfr_seq_161-169 per-hot-bill action menu: status log, download pdf, download xls, download xml, reprint bill, regenerate document, regenerate xml, send email. bill formatter portal / admin console"}, {"id": "resend_console", "x": 2860.0, "y": 1025, "r": 18, "lb": "Resend Bill Status Console", "t": "resend bill status console bfr_seq_170/183 shows resend bill status in a separate console option: sl no, bill number, status, process date. action menu offers edit of the resend bill template per record. bill formatter portal / admin console"}, {"id": "config_import_export", "x": 460.0, "y": 1240, "r": 18, "lb": "Configuration Import / Export & Effective Dating", "t": "configuration import / export & effective dating bfr_seq_126/127 billing operations exports selected configuration data in xls or csv format and imports it back; configuration maintenance is controlled by role. configuration activation/inactivation is controlled using active from / active to effective dates. billing operations user"}, {"id": "config_interactive_pdf", "x": 760.0, "y": 1240, "r": 18, "lb": "Interactive PDF Configuration", "t": "interactive pdf configuration bfr_seq_138/139 configures moving current bill sections into pdf tabs for one-click navigation, and interactive pdf features with graphical information and dynamic links, where required. billing operations user"}, {"id": "config_masking_rules", "x": 1060.0, "y": 1240, "r": 18, "lb": "Masking Rule Configuration", "t": "masking rule configuration bfr_seq_100/141/098 configures the masking rules applied to sensitive invoice information before despatch, plus the invoice template's own business rules and calculated-field logic for fields not directly available from source systems. billing operations user"}, {"id": "config_platform", "x": 1360.0, "y": 1240, "r": 18, "lb": "Platform Services Configuration", "t": "platform services configuration bfr_seq_135-140/146 storage and retention with automatic housekeeping of artefacts past their retention period; multi-language support (english/arabic template + translation values); multi-currency support (invoice generated using the currency provided in source data, beyond qatari riyal); tax information processing sourced from brm xml/database; and compatibility handling to reproduce old/legacy invoices as available in brm. billing operations user"}, {"id": "config_reference_data", "x": 1660.0, "y": 1240, "r": 18, "lb": "Reference Data Configuration", "t": "reference data configuration bfr_seq_117-120/172-181 configuration of adjustment reasons (create/edit codes and labels), benefits (auto-updated product list from brm xml, create/search benefits), flex bucket ids (import/export/create, edit/delete sub-menu) and vas short codes (mapped by called_to/record_type, search, edit/delete). each reference-data type exposes its own create/search/action-menu (edit/delete) sub-options. billing operations user"}, {"id": "config_report_templates", "x": 1960.0, "y": 1240, "r": 18, "lb": "Report Template Configuration", "t": "report template configuration bfr_seq_128 billing operations creates, modifies or deletes report templates and configures attributes (recipients, subject, body). configured templates are used when sending reports to mail ids, covering bill run monitor, vlb, overall, internal and video bill templates. billing operations user"}, {"id": "config_template_docs", "x": 2260.0, "y": 1240, "r": 18, "lb": "Template Business-Rule Documentation", "t": "template business-rule documentation bfr_seq_097/124 all invoice field definitions, rules and business logic governing the invoice template are exposed and made accessible to non-technical users in a business-readable format, matching the current template's documentation. billing operations user"}, {"id": "config_templates", "x": 2560.0, "y": 1240, "r": 18, "lb": "Bill Template & Banner Configuration", "t": "bill template & banner configuration bfr_seq_116/121/122/125/129/178/182/188 translation configuration (source/destination values, self-updating from xml fields), bill email template configuration (separate consumer/enterprise templates, first-time vs resend, english/arabic), bill template change (cosmetic redesign per business look-and-feel), bill banner configuration, plan speed configuration (synced with product catalogue), and full bill template redesign covering field position/visibility changes per invoice section, customer segment and invoice type. billing operations user"}, {"id": "invoice_search", "x": 2860.0, "y": 1240, "r": 24, "lb": "Invoice & Report Search", "t": "invoice & report search bfr_seq_096/102 bill formatter supports invoice/report search using filters: invoice type, invoice number, batch, date, language, msisdn, product, status, email, account, customer type, and bf id (internal). search results allow download; available actions depend on user role and invoice status. bill formatter portal / admin console"}, {"id": "console_search", "x": 1510.0, "y": 1455, "r": 18, "lb": "Console Search", "t": "console search bfr_seq_171 general console search with parameters: document type, status, language, msisdn, account no, email, bill number, customer type, with page control (min/max page). page listings additionally support column-header sorting in ascending/descending order. bill formatter portal / admin console"}, {"id": "xml_search", "x": 1810.0, "y": 1455, "r": 18, "lb": "XML Record Search", "t": "xml record search bfr_seq_103 billing operations searches uploaded bill xml records by invoice type, invoice number, batch id and other criteria. search results display the latest xml processing status available in bill formatter. bill formatter portal / admin console"}, {"id": "end_rejected", "x": 860.0, "y": 810, "r": 18, "lb": "Invoice Rejected / Exception Terminal", "t": "invoice rejected / exception terminal bill formatter portal / admin console"}], PHASES=[{"n": "Ingest & Validate", "x": 0}, {"n": "Batch & Generate", "x": 1460.0}, {"n": "Review & Regenerate", "x": 2260.0}, {"n": "Deliver", "x": 2660.0}];
const scroll=document.getElementById('scroll'), hl=document.getElementById('hl'),
      q=document.getElementById('q'), sc=document.getElementById('searchCtrl'),
      hits=document.getElementById('hits'), sel=document.getElementById('phaseSel');

/* ---- Jump to phase ---- */
sel.innerHTML='<option value="">Jump to phase…</option>'+
  PHASES.map((p,i)=>`<option value="${p.x}">${i} · ${p.n}</option>`).join('');
sel.onchange=()=>{ if(sel.value!=='') scroll.scrollTo({left:+sel.value,behavior:'smooth'}); };

/* ---- Search ---- */
let matches=[], cur=-1;
const SVGNS='http://www.w3.org/2000/svg';
function ring(n,strong){
  const c=document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',n.r);
  c.setAttribute('fill','none'); c.setAttribute('stroke','#e60000');
  c.setAttribute('stroke-width',strong?4:2.5); c.setAttribute('opacity',strong?1:.55);
  hl.appendChild(c);
}
function paint(){
  hl.textContent='';
  matches.forEach((n,i)=>ring(n,i===cur));
}
function goto_(i){
  if(!matches.length) return;
  cur=(i+matches.length)%matches.length;
  const n=matches[cur];
  scroll.scrollTo({left:Math.max(0,n.x-scroll.clientWidth/2),behavior:'smooth'});
  paint(); hits.textContent=`${cur+1} / ${matches.length}`;
}
function run(){
  const t=q.value.trim().toLowerCase();
  if(t.length<2){ matches=[]; cur=-1; hl.textContent=''; hits.textContent='';
                  sc.classList.remove('no-match'); return; }
  matches=NODES.filter(n=>n.t.includes(t));
  sc.classList.toggle('no-match',matches.length===0);
  if(!matches.length){ hl.textContent=''; hits.textContent='0'; cur=-1; return; }
  cur=-1; goto_(0);
}
let deb; q.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(run,180);});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault(); matches.length?goto_(cur+(e.shiftKey?-1:1)):run();}
  if(e.key==='Escape'){q.value='';run();}
});

/* ---- Paginated PDF via the browser's own print-to-PDF (no external library, works offline) ---- */
function exportPDF(){
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  const SLICE=Math.round(H*1.50);                 // A4-landscape printable aspect
  const n=Math.ceil(W/SLICE);
  const doc=document.createElement('div'); doc.id='printdoc';
  for(let i=0;i<n;i++){
    const pg=document.createElement('div'); pg.className='pg';
    const cap=document.createElement('div'); cap.className='pgcap';
    cap.innerHTML='<b>Bill Formatter — XML Ingestion, Invoice Generation, Delivery &amp; Configuration</b>'+
                  '<span>Page '+(i+1)+' of '+n+'</span>';
    const c=el.cloneNode(true);
    const h=c.querySelector('#hl'); if(h) h.textContent='';
    c.removeAttribute('id'); c.removeAttribute('width'); c.removeAttribute('height');
    c.setAttribute('viewBox',(i*SLICE)+' 0 '+SLICE+' '+H);
    pg.appendChild(cap); pg.appendChild(c); doc.appendChild(pg);
  }
  document.body.appendChild(doc);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');doc.remove();
                  window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{window.print(); setTimeout(done,1500);},150);
}

/* ---- Export ---- */
const expBtn=document.getElementById('expBtn'), expMenu=document.getElementById('expMenu');
expBtn.onclick=e=>{e.stopPropagation();expMenu.classList.toggle('open');};
document.addEventListener('click',()=>expMenu.classList.remove('open'));
function svgBlob(){
  const el=document.getElementById('flow').cloneNode(true);
  el.querySelector('#hl').textContent='';
  el.setAttribute('xmlns',SVGNS);
  return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(el)],
                  {type:'image/svg+xml;charset=utf-8'});
}
function save(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
expMenu.onclick=e=>{
  const fmt=e.target.dataset&&e.target.dataset.fmt; if(!fmt) return;
  expMenu.classList.remove('open');
  const base='vfq-billformatter-brsd-v1-0-process-flow';
  if(fmt==='svg') return save(svgBlob(),base+'.svg');
  if(fmt==='pdf') return exportPDF();
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  /* a very wide canvas at 1x can exceed browser canvas limits, so PNG renders at 0.5x */
  const k=0.5, img=new Image(), url=URL.createObjectURL(svgBlob());
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=W*k; cv.height=H*k;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{save(b,base+'.png');URL.revokeObjectURL(url);},'image/png');
  };
  img.onerror=()=>{alert('PNG export failed in this browser — use Export as SVG.');URL.revokeObjectURL(url);};
  img.src=url;
};
