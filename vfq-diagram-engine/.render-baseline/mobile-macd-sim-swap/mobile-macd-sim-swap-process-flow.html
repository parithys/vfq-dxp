<meta charset="utf-8">
<title>Mobile MACD — SIM Swap — Process Flow</title>
<style>
:root{
  --charcoal:#25282b; --charcoal-2:#1a1c1e;
  --panel:#ffffff; --line:#d8d8d8; --ink2:#4a4d4e; --accent:#e60000;
  --ink:#111; --mute:#5A5A66; --navy:#2A1B9E;
  --radius-button:2px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px;
}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:90;
  background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));
  color:#f4f4f4;padding:var(--space-5) var(--space-6) var(--space-4)}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hgroup{display:flex;flex-direction:column;gap:3px}
.eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.h1main{font-size:24px;font-weight:800;color:#fff;line-height:1.25}
.h1sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.72);line-height:1.3;margin-top:1px}
.actions{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2)}
.arow{display:flex;align-items:center;gap:var(--space-2)}
.btn,.phaseselect{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:var(--radius-button);padding:var(--space-2) var(--space-3);
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.btn:hover,.phaseselect:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{color:#fff;filter:brightness(1.08)}
.phaseselect{min-width:190px;padding-right:22px}
.searchctrl{display:flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--panel);border-radius:var(--radius-button);padding:0 var(--space-3);height:31px}
.searchctrl input{border:0;outline:0;font-size:12px;font-weight:600;color:var(--ink2);
  width:200px;font-family:inherit;background:none}
.searchctrl.no-match input{color:var(--accent)}
.hits{font-size:11px;font-weight:700;color:var(--mute);min-width:52px;text-align:right}
.expwrap{position:relative}
.expmenu{position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);
  border-radius:var(--radius-button);box-shadow:0 18px 44px rgba(0,0,0,.22);display:none;z-index:120;min-width:180px}
.expmenu.open{display:block}
.expmenu button{display:block;width:100%;text-align:left;border:0;background:none;
  padding:9px 14px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.expmenu button:hover{background:#f2f2f2;color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:9px 18px;margin-top:14px;padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:rgba(255,255,255,.76);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:7px}
i{width:13px;height:13px;display:inline-block;flex:none}
.dot{border-radius:50%}
.dia{background:#fff;border:2px solid #2A1B9E;transform:rotate(45deg);width:10px;height:10px}
.ring{border-radius:50%;background:#0F9B8E;box-shadow:0 0 0 2px var(--charcoal-2) inset,0 0 0 3px #0F9B8E}
.sq{border-radius:4px;background:#7A2BD6}
.dash{height:0;border-top:2px dashed #3B7DD8;width:18px}
.chip{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.chipd{background:none;border:1px dashed rgba(255,255,255,.42);border-radius:3px;width:16px;height:11px}
.scroll{overflow-x:auto;overflow-y:hidden;padding:0 0 28px}
.scroll svg{display:block}
#printdoc{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body.printing>header,body.printing>.scroll{display:none!important}
  body.printing #printdoc{display:block}
  /* one printed sheet per slice: fixed page box, SVG letterboxes itself inside it */
  .pg{break-after:page;page-break-after:always;
      height:100vh;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden}
  .pg:last-child{break-after:auto;page-break-after:auto}
  .pgcap{flex:none}
  .pg svg{flex:1;min-height:0;width:100%;height:100%}
  .pgcap{display:flex;justify-content:space-between;align-items:baseline;
    font-size:9pt;color:#333;border-bottom:1px solid #ccc;
    padding-bottom:2mm;margin-bottom:3mm}
  .pgcap b{font-weight:800}
}
</style>
<header>
  <div class="hrow">
    <div class="hgroup">
      <div class="eyebrow">BPMN Process Flow</div>
      <div class="h1main">Mobile MACD</div>
      <div class="h1sub">SIM Swap — Process Flow</div>
    </div>
    <div class="actions">
      <div class="arow">
        <select class="phaseselect" id="phaseSel" aria-label="Jump to phase"></select>
        <div class="expwrap">
          <button class="btn primary" id="expBtn">Export</button>
          <div class="expmenu" id="expMenu">
            <button data-fmt="svg">Export as SVG (vector)</button>
            <button data-fmt="png">Export as PNG</button>
            <button data-fmt="pdf">Export as PDF (paginated)</button>
          </div>
        </div>
      </div>
      <div class="arow">
        <span class="hits" id="hits"></span>
        <div class="searchctrl" id="searchCtrl">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#6f7375" stroke-width="1.8">
            <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 L14 14" stroke-linecap="round"/></svg>
          <input id="q" type="search" placeholder="Search node…" autocomplete="off">
        </div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:#2A1B9E"></i> Primary-path step</span>
    <span><i class="dia"></i> Decision / validation</span>
    <span><i class="ring"></i> Milestone</span>
    <span><i class="dot" style="background:#F01010"></i> Error / rejection — journey ends</span>
    <span><i class="dot" style="background:#C07800"></i> Recovery, retry or side flow</span>
    <span><i class="sq"></i> Escalation / approval task</span>
    <span><i class="dot" style="background:#12A038"></i> Happy-path branch label</span>
    <span><i class="dash"></i> Data flow</span>
    <span><i class="chip"></i> System / actor tag</span>
  </div>
</header>

<script>
const NODES=[{"id": "start", "x": 60, "y": 215, "r": 22, "lb": "Customer Visits Retail Store", "t": "1 customer visits retail store mob_sim_swap_retl_001.01 customer visits retail store for sim swap. customer"}, {"id": "qticket", "x": 460, "y": 215, "r": 20, "lb": "Qnomy Ticket Created", "t": "2 qnomy ticket created mob_sim_swap_retl_001.01 qticket is created in qnomy for the selected service chosen by the customer. retail agent shall select the next available ticket in the queue and will provide respective service to the customer. external systems"}, {"id": "cust_id", "x": 860, "y": 215, "r": 20, "lb": "Customer Identification", "t": "3 customer identification cbu_c360_req_001.02 agent shall be able to identify the customer by searching: 1. customer name, 2. mobile number, 3. account id, 4. customer identification number (qatar id, passport id, gcc id, diplomatic id). retail agent"}, {"id": "verify_cust", "x": 1260, "y": 215, "r": 24, "lb": "Verify the Customer", "t": "4 verify the customer cbu_c360_req_001.03 agent shall be able to view the verification questions and answers related to the customer in the screen. agents shall be able to mark the customer as verified if customer response matches. retail agent"}, {"id": "id_capture", "x": 1660, "y": 215, "r": 20, "lb": "ID Capture (IDWise)", "t": "5 id capture (idwise) mob_post_pln_chg_retl_001.02 agent shall be able to scan the customer's id using idwise: a) front page, b) back page, c) liveliness (optional if customer agrees). retail agent"}, {"id": "id_capture_result", "x": 2060, "y": 215, "r": 24, "lb": "ID-Wise Capture Successful?", "t": "6 id-wise capture successful? mob_post_pln_chg_retl_001.02 system shall be able to capture customer information from the scanned id and display it in the ui, then send the scanned id information to crm. system shall capture the expiry date from id wise and populate in crm (as moi is not returning expiry date). external systems"}, {"id": "moi_validation", "x": 2460, "y": 215, "r": 20, "lb": "MOI Validation", "t": "7 moi validation mob_post_pln_chg_retl_001.03 system shall be able to fetch the customer information from moi based on qid and passport no (from all countries). moi will return captured fields (qid number, 5 name fields, date of birth, nationality, id expiry date, salutation). external systems"}, {"id": "moi_match_check", "x": 2860, "y": 215, "r": 24, "lb": "MOI Fields Match ID-Wise (100%)?", "t": "8 moi fields match id-wise (100%)? mob_post_pln_chg_retl_001.03 if all fields match (100%) then agent shall be allowed to proceed, else agent can reject or re-scan (from id capture). system (crm)"}, {"id": "cust_check", "x": 3260, "y": 215, "r": 24, "lb": "Customer Check", "t": "9 customer check (unlabeled row, follows moi validation) system shall be able to verify if customer exists or not. system (crm)"}, {"id": "save_milestone_1", "x": 3660, "y": 215, "r": 20, "lb": "Save Milestone", "t": "10 save milestone (unlabeled row, follows customer check) system shall save the journey milestone upon successful validation. system (crm)"}, {"id": "c360_view", "x": 4060, "y": 215, "r": 20, "lb": "Customer 360 View", "t": "11 customer 360 view mob_post_dwn_retl_001.03 the agent shall be able to view customer information through the customer 360 view. system (crm)"}, {"id": "init_sim_swap", "x": 4460, "y": 215, "r": 20, "lb": "Initiate SIM Swap", "t": "12 initiate sim swap (unlabeled row, follows customer 360 view) agent should be able to initiate the sim swap request. retail agent"}, {"id": "auto_tt", "x": 4860, "y": 215, "r": 20, "lb": "Automatic Ticket Creation", "t": "13 automatic ticket creation mob_post_act_retl_001.02.1 as agent initiates the macd process, system shall create the trouble ticket automatically and assign it to the agent. system (crm)"}, {"id": "sim_swap_form", "x": 5260, "y": 215, "r": 20, "lb": "SIM Swap Form", "t": "14 sim swap form (unlabeled row, follows automatic ticket creation) agent should be able to capture the sim swap form from customer with signature. agent should be able to attach the sim swap form in the portal. retail agent"}, {"id": "sim_swap_reason", "x": 5660, "y": 215, "r": 20, "lb": "SIM Swap Reason", "t": "15 sim swap reason (unlabeled row, follows sim swap form) agent should be able to capture the sim swap reason and requested sim type. retail agent"}, {"id": "sim_swap_charges", "x": 6060, "y": 215, "r": 20, "lb": "SIM Swap Charges", "t": "16 sim swap charges (unlabeled row, follows sim swap reason) system shall automatically calculate the sim swap charges based on the reason and sim type selected by the agent. system (crm)"}, {"id": "cart_creation", "x": 6460, "y": 215, "r": 20, "lb": "Cart Creation", "t": "17 cart creation (unlabeled row, follows sim swap charges) agent shall be able to create the cart (order) with sim swap. agent shall be able to review and modify the reason and sim type before submission. retail agent"}, {"id": "save_milestone_2", "x": 6860, "y": 215, "r": 20, "lb": "Save Milestone", "t": "18 save milestone (unlabeled row, follows cart creation) system shall save the journey milestone upon successful validation. system (crm)"}, {"id": "verify_cart", "x": 7260, "y": 215, "r": 24, "lb": "Verify Cart", "t": "19 verify cart mob_post_dwn_retl_001.07 agent shall be able to review and validate before proceeding to payment. retail agent"}, {"id": "payment", "x": 7660, "y": 215, "r": 20, "lb": "Payment Processing", "t": "20 payment processing mob_post_dwn_retl_001.08 agent shall be able to view the payment summary before confirming the payment, initiate payment through wincash, and provide the customer copy of the receipt generated by wincash (even if customer doesn't need to pay upfront, wincash will generate receipt for zero payment). retail agent"}, {"id": "payment_result", "x": 8060, "y": 215, "r": 24, "lb": "Payment Successful?", "t": "21 payment successful? mob_post_dwn_retl_001.08 if payment fails, the system shall place the order on hold and return the agent to the payment summary screen for re-attempt. external systems"}, {"id": "order_placement", "x": 8460, "y": 215, "r": 20, "lb": "Order Placement and Activation", "t": "22 order placement and activation mob_post_dwn_retl_001.09 agent shall be able to submit the order and create an activity in ui with description of the activity as a free-text field to capture the order-specific details (used by other advisors to better understand the customer's history). retail agent"}, {"id": "notify_submission", "x": 8860, "y": 215, "r": 20, "lb": "Customer Notification \u2014 Submission", "t": "23 customer notification \u2014 submission mob_post_to_pre_retl_001.19 system shall send order submission notification to customer through the selected mode (email/sms). external systems"}, {"id": "all_orders_view", "x": 9260, "y": 215, "r": 20, "lb": "All Orders View from Customer 360", "t": "24 all orders view from customer 360 mob_post_act_retl_001.19.2 system shall navigate the agent to customer 360 -> all orders view after order is submitted to the downstream systems. agent shall be able to check the recently submitted order and their status. system (crm)"}, {"id": "order_completion", "x": 9660, "y": 215, "r": 20, "lb": "Order Completion", "t": "25 order completion mob_post_to_pre_retl_001.20 system shall get the order completion from downstream systems to crm once the order is completed (sim swap completed). external systems"}, {"id": "tt_update", "x": 10060, "y": 215, "r": 20, "lb": "Trouble Ticket Update", "t": "26 trouble ticket update mob_post_act_retl_001.21.1 system shall update the ticket with 'resolved' status. system (crm)"}, {"id": "feedback_survey", "x": 10460, "y": 215, "r": 20, "lb": "Feedback Survey (Medallia)", "t": "27 feedback survey (medallia) mob_post_act_retl_001.21.1 once order is completed, system shall send the information to medallia for sending the customer feedback survey. system shall also receive the survey status from medallia in crm. external systems"}, {"id": "notify_completion", "x": 10860, "y": 215, "r": 27, "lb": "Customer Notification \u2014 Completion", "t": "28 customer notification \u2014 completion mob_post_to_pre_retl_001.21 system shall send acknowledgement on order completion to customer through the selected mode (email/sms). system shall send notification on order completion to all the msisdns which are available under the qid (e.g. if a customer account with qid has 5 contacts/msisdns active then notification will be sent to all 5 msisdns for the successful activation of any msisdn). external systems"}], PHASES=[{"n": "Initiation", "x": 0}, {"n": "Identification & Verification", "x": 660.0}, {"n": "SIM Swap Setup", "x": 4260.0}, {"n": "Checkout", "x": 7060.0}, {"n": "Fulfillment & Closure", "x": 8260.0}];
const scroll=document.getElementById('scroll'), hl=document.getElementById('hl'),
      q=document.getElementById('q'), sc=document.getElementById('searchCtrl'),
      hits=document.getElementById('hits'), sel=document.getElementById('phaseSel');

/* ---- Jump to phase ---- */
sel.innerHTML='<option value="">Jump to phase…</option>'+
  PHASES.map((p,i)=>`<option value="${p.x}">${i} · ${p.n}</option>`).join('');
sel.onchange=()=>{ if(sel.value!=='') scroll.scrollTo({left:+sel.value,behavior:'smooth'}); };

/* ---- Search ---- */
let matches=[], cur=-1;
const SVGNS='http://www.w3.org/2000/svg';
function ring(n,strong){
  const c=document.createElementNS(SVGNS,'circle');
  c.setAttribute('cx',n.x); c.setAttribute('cy',n.y); c.setAttribute('r',n.r);
  c.setAttribute('fill','none'); c.setAttribute('stroke','#e60000');
  c.setAttribute('stroke-width',strong?4:2.5); c.setAttribute('opacity',strong?1:.55);
  hl.appendChild(c);
}
function paint(){
  hl.textContent='';
  matches.forEach((n,i)=>ring(n,i===cur));
}
function goto_(i){
  if(!matches.length) return;
  cur=(i+matches.length)%matches.length;
  const n=matches[cur];
  scroll.scrollTo({left:Math.max(0,n.x-scroll.clientWidth/2),behavior:'smooth'});
  paint(); hits.textContent=`${cur+1} / ${matches.length}`;
}
function run(){
  const t=q.value.trim().toLowerCase();
  if(t.length<2){ matches=[]; cur=-1; hl.textContent=''; hits.textContent='';
                  sc.classList.remove('no-match'); return; }
  matches=NODES.filter(n=>n.t.includes(t));
  sc.classList.toggle('no-match',matches.length===0);
  if(!matches.length){ hl.textContent=''; hits.textContent='0'; cur=-1; return; }
  cur=-1; goto_(0);
}
let deb; q.addEventListener('input',()=>{clearTimeout(deb);deb=setTimeout(run,180);});
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault(); matches.length?goto_(cur+(e.shiftKey?-1:1)):run();}
  if(e.key==='Escape'){q.value='';run();}
});

/* ---- Paginated PDF via the browser's own print-to-PDF (no external library, works offline) ---- */
function exportPDF(){
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  const SLICE=Math.round(H*1.50);                 // A4-landscape printable aspect
  const n=Math.ceil(W/SLICE);
  const doc=document.createElement('div'); doc.id='printdoc';
  for(let i=0;i<n;i++){
    const pg=document.createElement('div'); pg.className='pg';
    const cap=document.createElement('div'); cap.className='pgcap';
    cap.innerHTML='<b>Mobile MACD — SIM Swap — Process Flow</b>'+
                  '<span>Page '+(i+1)+' of '+n+'</span>';
    const c=el.cloneNode(true);
    const h=c.querySelector('#hl'); if(h) h.textContent='';
    c.removeAttribute('id'); c.removeAttribute('width'); c.removeAttribute('height');
    c.setAttribute('viewBox',(i*SLICE)+' 0 '+SLICE+' '+H);
    pg.appendChild(cap); pg.appendChild(c); doc.appendChild(pg);
  }
  document.body.appendChild(doc);
  document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');doc.remove();
                  window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);
  setTimeout(()=>{window.print(); setTimeout(done,1500);},150);
}

/* ---- Export ---- */
const expBtn=document.getElementById('expBtn'), expMenu=document.getElementById('expMenu');
expBtn.onclick=e=>{e.stopPropagation();expMenu.classList.toggle('open');};
document.addEventListener('click',()=>expMenu.classList.remove('open'));
function svgBlob(){
  const el=document.getElementById('flow').cloneNode(true);
  el.querySelector('#hl').textContent='';
  el.setAttribute('xmlns',SVGNS);
  return new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(el)],
                  {type:'image/svg+xml;charset=utf-8'});
}
function save(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
}
expMenu.onclick=e=>{
  const fmt=e.target.dataset&&e.target.dataset.fmt; if(!fmt) return;
  expMenu.classList.remove('open');
  const base='mobile-macd-sim-swap-process-flow';
  if(fmt==='svg') return save(svgBlob(),base+'.svg');
  if(fmt==='pdf') return exportPDF();
  const el=document.getElementById('flow');
  const W=+el.getAttribute('width'), H=+el.getAttribute('height');
  /* a very wide canvas at 1x can exceed browser canvas limits, so PNG renders at 0.5x */
  const k=0.5, img=new Image(), url=URL.createObjectURL(svgBlob());
  img.onload=()=>{
    const cv=document.createElement('canvas'); cv.width=W*k; cv.height=H*k;
    const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>{save(b,base+'.png');URL.revokeObjectURL(url);},'image/png');
  };
  img.onerror=()=>{alert('PNG export failed in this browser — use Export as SVG.');URL.revokeObjectURL(url);};
  img.src=url;
};
