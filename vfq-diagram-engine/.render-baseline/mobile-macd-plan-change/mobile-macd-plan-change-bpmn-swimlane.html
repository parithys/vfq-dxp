<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent Ecosystem — Business Process Diagram</title>
<style>
:root{
 /* ---- Vodafone Design System tokens ----------------------------------------------
    Variable NAMES are kept as-is (--pg, --sys, --ext, etc.) to avoid rewriting every
    var() reference across this file; only VALUES are remapped. Full rationale for every
    mapping — including which node types use official Vodafone tokens vs. retained or
    derived hues where Vodafone provides no equivalent — is in reference/DESIGN_SYSTEM.md. */
 --ink:#1f1f1f; --ink2:#4a4d4e; --muted:#6f7375; --line:#d8d8d8; --line2:#eeeeee;
 --bg:#ffffff; --panel:#ffffff; --panelalt:#f2f2f2; --surface-warm:#fff1f1;
 --pg:#3860be; --pg-bg:#e7ecf7; --ai:#178a86; --ai-bg:#dfefee;
 --sys:#4a4d4e; --sys-bg:#f2f2f2; --ext:#d46e08; --ext-bg:#f9ecdf;
 --start:#008a00; --end:#ac1811; --dec:#8a5cc9; --dec-bg:#f1ebf9;
 --err:#bd0000; --esc:#f5b400; --val:#2b8a8f;
 --accent:#e60000; --accent-on:#ffffff;
 --charcoal:#25282b; --charcoal-2:#1a1c1e;
 /* Vodafone's own documented standard-easing curve (elevation.motion.standard_ease) — this
    replaced a generic Material-Design "standard" curve (cubic-bezier(.4,0,.2,1)) that had been
    in use here instead; both durations already in play elsewhere in this file (150ms/220ms)
    already match Vodafone's duration_fast_ms/duration_base_ms exactly, so only the curve itself
    needed correcting, not the timings. */
 --ease-standard:cubic-bezier(.2,0,0,1);
 --shadow:0 1px 2px rgba(0,0,0,.05),0 3px 8px rgba(0,0,0,.05);
 --shadow-raised:0 18px 44px rgba(0,0,0,.12);
 --focus-ring:0 0 0 4px rgba(230,0,0,.22);
 /* Vodafone's 4px base spacing scale (spacing.base_scale_px) and radius scale
    (borders_radius), added as reusable tokens for this file's own HTML chrome (header, buttons,
    drawer, legend, export menu) — never applied to the SVG canvas's own layout constants
    (PAD_X/PAD_Y, column/row sizing, connector clearances, node dimensions), which are
    content-geometry, not presentation, and are explicitly out of scope for a visual-design-only
    pass. Several chrome padding/gap values that had drifted slightly off this scale (7px, 11px,
    18px, 10px, 6px) are snapped onto the nearest step below. */
 --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px;
 --space-6:24px; --space-7:32px; --space-8:38px; --space-9:48px;
 --radius-button:2px; --radius-card:6px; --radius-sm:8px; --radius-md:16px; --radius-pill:9999px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Interactions must be constrained to the diagram canvas itself, with the header and the legend
   footer staying fixed and unaffected by them (scroll included — this used to be page-level: a
   tall/narrow model made .diagram-shell GROW to fit all of its content and left the whole page
   to scroll, which dragged the header off the top of the viewport and reduced the legend's own
   position:sticky;bottom:0 to a no-op (nothing above it was ever actually scrolling WITHIN the
   shell for it to stick against). body is now a fixed-viewport flex column instead: header
   (fixed height) + .wrap (flex:1, filling exactly what's left) with overflow:hidden here at the
   body level so the PAGE itself can never scroll. .diagram-shell further down is what actually
   receives the scroll (see its own comment) — the one and only scrollable region now. */
body{height:100vh;overflow:hidden;display:flex;flex-direction:column;
 font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
 color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.015em}
a{color:var(--accent);text-decoration:none}
/* header */
/* Header/diagram gutter alignment: .top and .wrap previously used two different horizontal
   paddings (26px / 12px, later reconciled to 24px each after the tab bar sat between them
   using its own third value) — the header title and the diagram-shell border below it didn't
   line up on either edge, so the diagram looked "inset" relative to the header above it. Both
   now share one CONTENT_GUTTER (24px) so every horizontal edge on the page — header text,
   and the diagram-shell's own left/right border — sits on the same vertical grid line. (A tab
   strip and a toolbar row both used to sit between the two and each needed its own matching
   gutter; both have since been removed entirely, so only .top and .wrap remain in this
   alignment.) */
/* position:relative + z-index above .drawer's (80) is required, not decorative: .drawer is
   `position:fixed;top:0;height:100vh`, so with no stacking context of its own .top (a normal
   in-flow, non-positioned element) would paint BENEATH it whenever the drawer is open — its
   opaque background would cover the Happy Flow/Export button group in the top-right corner,
   and pointer-events would go to the drawer, not the buttons underneath it, making them
   unclickable as well as invisible. Raising .top above the drawer's stacking level means its
   own opaque background instead covers the drawer's top edge where they'd otherwise overlap,
   so the header (and every button in it) always stays fully visible and clickable regardless
   of drawer state. */
/* flex:none — body is now a flex column (see the body{} comment above) and the header must never
   grow or shrink to share space with .wrap; it keeps its own natural content height and .wrap
   absorbs 100% of whatever height is left. */
.top{position:relative;z-index:90;flex:none;background:linear-gradient(180deg,var(--charcoal),var(--charcoal-2));color:#f4f4f4;padding:var(--space-5) var(--space-6) var(--space-4);
 display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
/* Reset, View Details, Happy Flow, and Export all live in the header now, aligned to the
   top-right corner as a group, in that explicit order. Reset originally sat here too (in a
   different position, between Happy Flow and Export) simply re-running the width-first fit; it
   was removed entirely at a time when pan/zoom/drag were all also removed, leaving nothing to
   reset FROM. Wheel-zoom and drag-to-pan have both since been reinstated (see "wheel zoom" and
   "drag-to-pan" further down) WITHOUT bringing Reset back at first — that gap is what this
   button now closes: a single control that unwinds every temporary view change (zoom, pan,
   Happy Flow filter, highlight lock, drawer, View Details mode) back to exactly how the page
   first loaded — see its own click handler, defined alongside View Details further down, for
   the full list. Export used to sit in the diagram toolbar (alongside a Reset button, at the
   end); that toolbar has since been removed entirely (see the ".toolbar" comment further down),
   so this header group is the ONLY place any of these buttons live. flex-shrink:0 keeps the
   group from being compressed if the title is long.

   The group is now a two-row stack (.header-row1/.header-row2), per an explicit "two-row
   structure" requirement for this corner: row 1 keeps the four buttons above unchanged, row 2
   holds the zoom control (-/percentage/+) and the Jump to Phase select that replaced the former
   Actors dropdown (see the removed applyActorFilter()/.actor-dim comments this replaces for that
   feature's own history — it was a multi-select lane/actor visibility filter, unrelated to
   navigation, and is not reused or ported forward here). align-items:flex-end keeps both rows
   right-aligned against the header's own right edge, matching row 1's prior single-row
   alignment. */
.top .header-actions{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.top .header-row1,.top .header-row2{display:flex;align-items:center;gap:8px}
/* Two-line title, explicit visual hierarchy per an explicit requirement: a small uppercase
   "BPMN Swimlane" eyebrow line above the actual diagram title, the latter now the dominant
   element instead of both being fused into one 20px line. The eyebrow reuses the exact
   .kpi span recipe (10.5px/uppercase/.06em tracking/60%-opacity white) already established
   elsewhere in this header for a "small label over bigger content" relationship, rather than
   inventing a new size/colour pairing. */
.top h1{display:flex;flex-direction:column;gap:3px}
.top h1 .h1-eyebrow{font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.top h1 .h1-main{font-size:24px;font-weight:800;color:#fff;line-height:1.25}
/* Every model's meta.title arrives as one "Name — Description" string (e.g. "Trouble Ticket
   Lifecycle — Creation, Assignment, Resolution & Closure"); the shim below (see m.title
   handling further down) splits it on the em dash into this subtitle line and the h1-main
   line above, per an explicit "break the title into two lines, remove the separator"
   requirement. Sized between h1-main (24px/800) and h1-eyebrow (10.5px/uppercase) — smaller
   and lighter than the primary title so the hierarchy reads unambiguously, but still legible
   prose rather than a label. :empty keeps it from reserving an awkward blank line for the rare
   title with no dash at all (nothing to show as a subtitle in that case). */
.top h1 .h1-sub{font-size:14px;font-weight:700;color:rgba(255,255,255,.72);line-height:1.3;margin-top:1px}
.top h1 .h1-sub:empty{display:none}
.kpis{display:flex;gap:var(--space-3);flex-wrap:wrap;margin-top:13px}
.kpi{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:var(--radius-sm);
 padding:var(--space-2) var(--space-3);min-width:96px}
.kpi b{display:block;font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
/* flex:1;min-height:0 — takes exactly the viewport height left over after .top (see body{}).
   min-height:0 overrides flexbox's default min-height:auto, which would otherwise let this
   grow to fit .diagram-shell's content instead of the reverse (the classic flex-child-with-
   scrollable-content trap); with it, .wrap stays capped at its allotted share and the overflow
   is left entirely to .diagram-shell's own scrolling, not this container's.
   display:flex;flex-direction:column so .diagram-section — its only child — inherits the same
   fill-height behaviour down to .diagram-shell (each link in this chain needs its own
   flex:1;min-height:0; skipping one breaks containment for everything below it). */
/* No padding on any side — an explicit "canvas area shall occupy the full available width of
   the viewport, no left/right/top/bottom padding within the canvas area" requirement. .wrap
   used to carry var(--space-5)/var(--space-6) chrome padding around .diagram-section (and so
   around .diagram-shell/the SVG canvas itself, and the legend footer below it); that inset the
   whole canvas from the viewport's own edges on all four sides, which is exactly the
   "unnecessary whitespace around the content" this rules out. .legend-sticky keeps its own
   internal padding (var(--space-3)/var(--space-4), see that rule) independently of this, so its
   text still isn't jammed against the viewport edge even though the canvas itself now is. */
.wrap{padding:0;flex:1;min-height:0;display:flex;flex-direction:column}
/* .toolbar (Flow-type filter buttons + View Labels toggle) has been removed entirely — every
   connector kind is unconditionally visible with no filter UI (see the header-actions comment
   above), and connector labels are now always shown by default with no toggle either (see
   below). The diagram-section has no toolbar row above the canvas any more at all. */
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink2);border-radius:var(--radius-button);
 padding:var(--space-2) var(--space-3);font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2);
 transition:border-color .15s var(--ease-standard),color .15s var(--ease-standard),background .15s var(--ease-standard)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.exportwrap{position:relative;display:inline-block}
.exportmenu{position:absolute;right:0;top:calc(100% + 5px);background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius-card);box-shadow:var(--shadow-raised);display:none;flex-direction:column;min-width:150px;z-index:60;overflow:hidden;padding:var(--space-1)}
.exportmenu.open{display:flex}
.exportmenu button{padding:8px 12px;border:none;background:none;text-align:left;cursor:pointer;font-size:12.5px;
 color:var(--ink);border-radius:4px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.exportmenu button:hover{background:var(--accent);color:#fff}
.exportmenu button:hover .fmt-hint{color:rgba(255,255,255,.75)}
.exportmenu .fmt-hint{font-size:10.5px;color:var(--muted)}
/* Zoom control + Jump to Phase — replace the former Actors dropdown (a multi-select actor/lane
   filter, removed entirely; see the removed applyActorFilter()/.actor-dim comments this replaces
   for that feature's own history). Both are plain, always-visible controls (no absolute-panel
   popover like .exportwrap/.exportmenu above), living in a second header row underneath Reset/
   View Details/Happy Flow/Export per an explicit "two-row structure" requirement for the
   header's right-hand control group. */
.zoomctrl{display:flex;align-items:center;border:1px solid var(--line);background:var(--panel);
 border-radius:var(--radius-button);overflow:hidden}
.zoomctrl .zoombtn{border:none;background:none;color:var(--ink2);font-size:15px;font-weight:700;
 line-height:1;cursor:pointer;padding:var(--space-2) var(--space-3);display:flex;align-items:center;
 justify-content:center;transition:background .15s var(--ease-standard),color .15s var(--ease-standard)}
.zoomctrl .zoombtn:hover{background:var(--panelalt);color:var(--accent)}
.zoomctrl .zoompct{font-size:12px;font-weight:700;color:var(--ink);min-width:40px;text-align:center;
 font-variant-numeric:tabular-nums;padding:0 2px;border-left:1px solid var(--line2);border-right:1px solid var(--line2)}
.jumpphase{display:flex;align-items:center;gap:8px}
.jumpphase-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap}
.phaseselect{border:1px solid var(--line);background:var(--panel);color:var(--ink2);
 border-radius:var(--radius-button);padding:var(--space-2) var(--space-3);font-size:12px;font-weight:600;
 cursor:pointer;min-width:88px}
/* .chip and the Flows filter it labelled have both been removed entirely — every connector
   kind is now unconditionally visible, with no toggle UI at all. */
/* diagram */
/* .diagram-section: pure pass-through of .wrap's fill-height behaviour down to .diagram-shell —
   see .wrap's own comment for why each link in this chain needs its own flex:1;min-height:0. */
.diagram-section{flex:1;min-height:0;display:flex;flex-direction:column}
/* .diagram-shell is now THE scroll boundary — the one and only element interactions (scroll,
   and pan/zoom if either is ever reintroduced) are allowed to affect. It fills exactly whatever
   height .diagram-section hands it (flex:1 again) rather than growing to fit its own content,
   and overflow:auto on BOTH axes means a model too wide, too tall, or both scrolls WITHIN this
   box instead of the page scrolling around it. Sizing is still WIDTH-FIRST — sizeHost()/fit()
   below still compute scale = max(width-fill, height-fill), so the canvas still always consumes
   100% of the horizontal space available and is never letterboxed — the only thing that changed
   is what absorbs a model whose height at that scale exceeds what's visible: previously the
   shell grew and the PAGE scrolled past the header to reach it; now the shell scrolls internally
   and the header/legend, both outside this box, are structurally unable to move. min-height
   keeps the canvas usable even in a very short viewport, matching the old SHELL_MIN_H floor that
   used to be enforced in JS. */
.diagram-shell{position:relative;width:100%;box-sizing:border-box;
 flex:1;min-height:340px;overflow:auto;cursor:grab;user-select:none;-webkit-user-select:none;
 scrollbar-width:auto;scrollbar-color:var(--muted) var(--panelalt)}
/* Force a persistent, always-rendered scrollbar rather than the OS-default auto-hiding
   overlay (macOS/trackpad-driven systems hide overflow:auto's scrollbar entirely until an
   active scroll gesture, and never show it in a static screenshot, a "full page" capture
   tool, or a PDF/PNG export — any of which only ever see the currently-scrolled slice of a
   wide diagram with NO visual indication that more content exists off-screen). Styling
   ::-webkit-scrollbar switches Chromium/Safari out of overlay mode into classic
   always-reserved-space scrollbars; scrollbar-width/-color above does the equivalent for
   Firefox. This is what actually makes horizontal scrolling *discoverable*, not just
   technically present via overflow:auto. */
.diagram-shell::-webkit-scrollbar{width:14px;height:14px}
.diagram-shell::-webkit-scrollbar-track{background:var(--panelalt)}
.diagram-shell::-webkit-scrollbar-thumb{background:var(--muted);border-radius:var(--radius-pill);
 border:3px solid var(--panelalt);background-clip:padding-box}
.diagram-shell::-webkit-scrollbar-thumb:hover{background:var(--ink2)}
.diagram-shell::-webkit-scrollbar-corner{background:var(--panelalt)}
/* .panning (toggled by the drag-to-pan pointerdown/up handlers, further down) forces a
   grabbing cursor everywhere over the shell for the duration of an active drag — including
   over a node, which would otherwise keep showing its own .node{cursor:pointer} since that's a
   more specific selector than the shell's own resting cursor:grab. */
.diagram-shell.panning, .diagram-shell.panning *{cursor:grabbing !important}
#svgHost{width:100%;height:100%;display:block}
/* No frozen rows or columns: the lane gutter (left-hand lane names/hints) and the phase header
   (top row of phase badges) both scroll and pan naturally with the rest of the diagram, same
   as every node and connector — neither pins to an edge while the canvas moves beneath it. A
   prior version duplicated both as separate `position:sticky` HTML overlays layered on top of
   the SVG (true CSS sticky doesn't apply to child shapes inside an <svg> the way it does to
   HTML block elements, so pinning either one meant building an HTML twin of SVG content that
   already existed) — `#svgLaneGutter` and `#svgPhaseHeader`, both drawn once as part of the
   ordinary SVG content, are now simply left visible (no longer hidden behind `opacity:0` in
   favour of an HTML overlay) and there is no more sticky positioning, sync-on-pan/zoom JS, or
   HTML duplication of either one anywhere in this file. Both were already rendered exactly
   this way for exported files (which never had the sticky overlay to begin with); the live
   view now matches that same non-frozen behaviour instead of diverging from it. */
/* The legend footer is intentionally NOT part of this change — it never scales with the
   canvas. It isn't a row or column of the diagram grid at all (unlike the lane gutter and
   phase header above, which ARE literally a frozen column and a frozen row); embedding it in
   the scaled SVG content would let a tall multi-lane diagram's "fit-to-height" scale shrink it
   to a near-illegible sliver (a 22-unit-tall row at 0.67x scale renders ~15px tall).
   #legendLayer (the SVG-drawn version) stays hidden live and is restored for exports, same
   pattern lane-gutter/phase-header used to follow before that change — the difference is the
   legend has a genuine reason to stay fixed at a readable size regardless of scroll, and the
   diagram's own rows/columns don't.
   It is now a plain HTML sibling AFTER .diagram-shell (see the markup), not a child positioned
   inside it — a prior version nested it inside .diagram-shell with position:sticky so it would
   float, pinned, over the bottom of the scrolling canvas. That put it inside the same box whose
   native horizontal/vertical scrollbars are rendered at ITS outer edge, so the scrollbar ended
   up drawn UNDERNEATH the sticky legend instead of between the canvas and the legend — exactly
   backwards from "scrollbar immediately below the canvas, legend below that". Moving it outside
   the scroll container entirely (a flex:none row of its own in .diagram-section, below the
   flex:1 .diagram-shell) fixes both at once: the shell's scrollbar now sits at the shell's own
   bottom edge (immediately below the canvas, nothing else in that box), and the legend is a
   separate, always-visible row below it that scrolling can never cover or be covered by. */
/* Legend readability pass: font bumped 11px -> 12.5px (the smallest text on the whole canvas
   was previously the one piece of UI every reader depends on to decode the diagram), items are
   grouped into labelled clusters (Node types / Connector types) instead of one undifferentiated
   run, each on its OWN row rather than sharing one — a prior version used a flex-row container
   with inline-flex groups, so "Node types" and "Connector types" sat side by side whenever they
   both fit the available width, only stacking once genuinely overflowing; the spec calls for
   always-separate rows regardless of available width, so the container is now a flex COLUMN
   with each group as its own full-width flex row (items within a group still wrap onto
   additional lines if that one group alone needs more room than the canvas has). */
/* flex:none — a fixed-height row of its own after .diagram-shell in the .diagram-section flex
   column (see markup), never sharing space with or sitting inside the scrollable canvas. Kept
   the "legend-sticky" class name for continuity even though it's no longer position:sticky —
   see the comment above this rule for why it moved out of .diagram-shell entirely. */
.legend-sticky{flex:none;display:flex;flex-direction:column;
 gap:var(--space-2);background:rgba(255,255,255,.97);border-top:1px solid #eeeeee;
 padding:var(--space-3) var(--space-4)}
.legend-sticky .lgd-item{display:inline-flex;align-items:center;gap:6px;font:600 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:#333333;white-space:nowrap}
.legend-sticky .lgd-group{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;row-gap:6px;column-gap:16px}
.legend-sticky .lgd-cat{font:800 14px "Inter","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--muted);
 text-transform:uppercase;letter-spacing:.08em;margin-right:2px;white-space:nowrap}
.legend-sticky svg{flex:none}
.node{cursor:pointer}
.node .box{stroke-width:1.5;transition:stroke .15s var(--ease-standard),stroke-width .15s var(--ease-standard),filter .15s var(--ease-standard)}
/* Selection uses the Vodafone brand-red accent (--accent, #e60000) rather than the signal-blue
   identity colour — the identity blue is already used pervasively for 'agent' node fill/stroke
   and portfolio-lane tints, so a selected node in that same hue had low figure/ground contrast
   against its own type colour and against nearby agent nodes. Brand red is reserved on this
   canvas almost exclusively for selection/selected-path emphasis and the header/phase-badge
   accents, so it reads immediately as "the thing that's active" rather than blending into the
   diagram's own colour vocabulary. Stroke width and glow radius are both increased over the
   previous blue treatment for stronger visual prominence at any zoom level.
   NOTE: DESIGN_SYSTEM.md previously documented this as a magenta stroke; that was aspirational
   and never matched the shipped engine (which used --pg blue). Brand-red is now the actual and
   documented behaviour — see DESIGN_SYSTEM.md "Node types" for the corrected spec. */
.node.selected .box{stroke:var(--accent) !important;stroke-width:4px !important;filter:drop-shadow(0 0 6px rgba(230,0,0,.65)) drop-shadow(0 1px 3px rgba(0,0,0,.25))}
.node.selected{opacity:1 !important}
/* Happy Path Playback highlight states — deliberately separate classes/colours from the hover/
   click-lock system above (.dim/.hlpath/.selected, all brand-red) and from the Happy Flow filter
   (which hides content via display:none, not colour). Playback highlights must accumulate and
   persist across hover/lock changes elsewhere on the canvas and must survive until Reset is
   explicitly triggered — reusing the red selection/lock colour or its classes would mean an
   ordinary node hover or a Prev/Next click stomps playback's own state (clearAllHL() only ever
   touches .dim/.hlpath, never .hp-active/.hp-done, so the two systems can never collide).
   hp-done (a node the playback has already stepped through) uses the same green already reserved
   for 'start'-type nodes elsewhere on this canvas, reading as "completed/success". hp-active (the
   single node currently being visited) uses amber/gold with a slow pulse so the current position
   is unambiguous even on a large, hundreds-of-nodes diagram — see the animation further down. */
.node.hp-done .box{stroke:#1e7d34 !important;stroke-width:3px !important;filter:drop-shadow(0 0 5px rgba(30,125,52,.55))}
.node.hp-active .box{stroke:#e6a700 !important;stroke-width:4px !important;animation:hpPulse 1.1s ease-in-out infinite}
@keyframes hpPulse{
 0%,100%{filter:drop-shadow(0 0 4px rgba(230,167,0,.6))}
 50%{filter:drop-shadow(0 0 11px rgba(230,167,0,1))}
}
.edge.hp-done{stroke:#1e7d34 !important;stroke-width:2.6px !important;filter:none !important}
.node text{font-family:"Segoe UI",Arial,sans-serif;pointer-events:none}
/* Minimum 14px font-size across the diagram canvas (nodes, connectors, lane gutter, phase
   headers, legend) for readability — every diagram-canvas text size that was previously below
   14px (node sub-labels at 9.5px, lane hints at 9px, edge labels at 9.5px, phase badge numbers
   at 9px, legend category captions at 9.5px, etc.) is now 14px. This does trade away the prior
   visual hierarchy some of these had (a node's own label and its smaller "sub" caption used to
   read at clearly different sizes; now both read at the same 14px) — that trade-off is the
   explicit, accepted cost of the minimum-size requirement, not an oversight. Node/shape
   dimensions in build_model.py's `sizes` dict were NOT enlarged to compensate: the existing
   measurement-driven wrap/truncate/fold logic (wrapTextPx(), truncatePx()) already adapts
   correctly to whatever font it's given, so nothing overflows a shape's boundary — a small
   node (a circle, a decision diamond) may now truncate its label more aggressively than before
   simply because the same physical space holds less 14px text than it held 9.5-11.5px text.
   That's an inherent, unavoidable consequence of enforcing a larger minimum inside fixed-size
   shapes, not a rendering defect. */
.node .lbl{font-size:14px;font-weight:600;fill:var(--ink)}
/* .node .sub (the reference/requirement-code caption under a node's label) has been removed
   entirely, along with the JS that rendered it — see the NODES.forEach loop. */

   recoloured the drawer along with the canvas. Values match the reference canvas design. */

.edge.data{stroke:#555555;stroke-width:1.5;stroke-dasharray:5 4}
.edge.cond{stroke:#8a8f98;stroke-width:1.6;stroke-dasharray:2 4}

   no paint-order) in favour of italic, regular weight (not the original bold), reading as
   lighter, more unobtrusive annotation — but with the explicit, accepted trade-off that a
   label could now visually cross a connector line or another element behind it with nothing
   separating them. That trade-off was then reversed: the white background is back
   (`paint-order:stroke;stroke:#fff`), restoring legibility against crossed content, while the
   italic/regular-weight/dark-grey styling from the round in between is KEPT — only the
   background was asked to come back, not the original bold weight. The net result is a label
   that reads as lighter/secondary via its typography (italic, not bold) while still being
   fully legible against anything it happens to cross, via the restored white halo. */
.elabel{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;font-style:italic;font-weight:700;fill:#4a4d4e;paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
/* Inactive/background dimming for the hover-isolation interaction. Previously .12 opacity left
   unrelated nodes/edges clearly legible, which read as "everything is still part of the story"
   rather than "this is the isolated path" — the whole point of the interaction. Two changes,
   both required together:
   (1) opacity drops to .05 (near-invisible, never literally 0 so a reader can still tell there
       WAS other content, preserving orientation on a large canvas), and
   (2) a grayscale filter desaturates whatever residual pixels remain, so the faint background
       reads as "greyed-out context" rather than "full-colour content at low volume" — the two
       read very differently even at matched opacity. Never applied to .selected (see rule
       above) or to the active/highlighted path (.hl / .hlpath), which stay at full opacity and
       full colour so the active path has maximum contrast against the greyed-out rest. */

   matching the selection treatment above — instead of merely thickening the edge's own type
   colour, which kept e.g. a pale amber escalation line looking washed out at the original
   weight. A single shared "this is the active thing" colour across both selection (nodes) and
   isolation (edges) is the fix for "poor visual prominence": the reader should never have to
   hunt for which path lit up. Stroke-width is deliberately NOT increased here (an earlier
   version bumped it to 3.5px): since every marker is defined with markerUnits="strokeWidth",
   widening the line also silently scaled up its arrowhead, and both caused a layout shift at
   the moment of hover — explicitly disallowed by a later requirement to keep connector
   thickness and arrowhead size fixed across hover/selected states and rely on colour + glow
   alone. */
.edge.hlpath{stroke:var(--accent) !important;filter:drop-shadow(0 0 3px rgba(230,0,0,.55)) !important}
.lanelabel{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:700;fill:#1a1a1a}
/* .lanehint restored — hints render inline again as additional rotated column(s) after the
   lane name's own column(s), per an explicit "display the sub-headings too" requirement. It
   was removed for a round in between (a vertical-orientation change initially left no room
   for a second element beside the rotated name at all) but that gap has been closed: see the
   lane-gutter rendering loop below for how name and hint columns now share one consistent
   column-layout scheme. Kept at the same 14px minimum every other canvas text respects. */
.lanehint{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;fill:#6f7375}
.leglabel{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:600;fill:#333333}
.legcat{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:800;fill:#6f7375;letter-spacing:.08em}
.phasehdr{font-family:"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:700;fill:#1a1a1a;dominant-baseline:middle}
/* .phasenum removed: the numbered badge circle it styled (a small red circle with the stage's
   1-based index) has been removed entirely from the phase header — stage headings now show
   only their name, per an explicit "remove the numeric prefixes" requirement. */
/* detail drawer */
/* top/height were previously fixed 0/100vh, same as the app header itself (z-index:90, above
   the drawer's own 80) — since both started at the exact same y, the header's opaque background
   painted over the drawer's own top portion (`.dh`, including its × close button), hiding and
   disabling it even though the drawer's SCROLLABLE body (`.db`) below happened to start clear
   of the header by coincidence of the two elements' similar heights. --header-h is set at
   runtime (see syncDrawerTop(), called on load/resize alongside fit()) to the header's actual
   rendered height — not a hardcoded px guess — since that height isn't a fixed constant (a long
   title can wrap to two lines at a narrow viewport, growing the header). The fallback (62px)
   only matters for the brief instant before JS first runs. */
.drawer{position:fixed;top:var(--header-h,62px);right:0;height:calc(100vh - var(--header-h,62px));width:500px;max-width:92vw;background:var(--panel);
 box-shadow:-18px 0 44px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .22s var(--ease-standard);z-index:80;

    transitioning a var()/calc()-driven length here made the browser freeze `top` at its
    initial computed value and never re-resolve it on subsequent --header-h changes, rather
    than animating — a real engine quirk with this specific property/value combination, not a
    style choice. A resize-triggered header-height change is rare and doesn't need animating
    anyway, so top/height simply apply instantly; only the open/close slide stays animated. */
 display:flex;flex-direction:column}
.drawer.open{transform:none}
/* Resize handle — a thin drag strip on the drawer's own left edge (its only free edge; top,
   right and bottom are all screen boundaries) letting a reader widen the panel on demand for
   content that would otherwise wrap or scroll more than necessary (a long Rules & safeguards
   list, a wide Incoming/Outgoing paths box, etc.). Kept as a genuine drag interaction rather
   than a fixed "expanded" toggle state so the reader lands on whatever width actually suits the
   node they're looking at, not one of two preset sizes. 6px hit target (comfortably
   grabbable) with only a 2px visible bar centred in it, so it doesn't read as a stray line down
   the drawer at rest — the full hit target and an accent-coloured bar both light up on hover so
   it's still discoverable. */

 z-index:1;background:transparent}
.drawer-resize-handle::after{content:'';position:absolute;top:0;left:2px;width:2px;height:100%;
 background:transparent;transition:background-color .15s var(--ease-standard)}
.drawer-resize-handle:hover::after,.drawer-resize-handle.dragging::after{background:var(--accent)}

   briefly leaves the handle's own hit-box doesn't flicker the cursor back to normal mid-drag. */

/* Drawer layout/structure reworked to match a supplied reference (stacked header with the type

   every colour is one already defined in this file's own :root token set or an existing literal
   reused verbatim from elsewhere in it (FILL/PHASE_PALETTE/.assum), never a new colour invented

.drawer .dh{padding:var(--space-5);border-bottom:4px solid var(--line);display:flex;flex-direction:column;gap:var(--space-3)}

.dh-navbtn .dh-navbtn-icon{font-size:16px;font-weight:800;line-height:1}

   chips. Borders/text use this file's own existing neutral tokens (--line, --ink/--ink2,

ctive service to the customer.", "controls": ["Only one process can be initiated per transaction."], "slot": 1, "w": 190, "h": 100, "x": 191.0, "y": 1370.0, "cx": 286.0, "cy": 1420.0}, {"id": "tracking_record", "type": "system", "lane": "sys", "phase": 0, "label": "Automatic Tracking Record Creation", "sub": "MOB_POST_PLN_CHG_RETL_001.02", "desc": "As agent initiates the customer onboarding process, System shall create the tracking record automatically for tracking purpose and assign it to the agent.", "controls": ["Mandatory fields for creating the tracking record will be captured during design phase."], "slot": 0, "w": 190, "h": 100, "x": 191.0, "y": 1150.0, "cx": 286.0, "cy": 1200.0}, {"id": "cust_verif_process", "type": "agent", "lane": "agt", "phase": 1, "label": "Customer Verification Process", "sub": "Requirement Name: Customer Veriffication Process", "desc": "Agent shall be able to verify customers' identity either through Physical ID Scanning or by asking security questions.", "controls": [], "slot": 0, "w": 206, "h": 100, "x": 435.0, "y": 430.0, "cx": 538.0, "cy": 480.0}, {"id": "cust_identification", "type": "agent", "lane": "agt", "phase": 1, "label": "Customer Identification", "sub": "CBU_C360_REQ_001.02", "desc": "Agent shall be able to identify the customer by searching: 1. Customer Name 2. Mobile number 3. Account ID 4. Customer Identification number (Qatar ID, passport ID, GCC ID, diplomatic ID).", "controls": ["Customer shall have existing customer account", "List of all the accounts matching to the search will be displayed by the system"], "slot": 1, "w": 206, "h": 60, "x": 435.0, "y": 670.0, "cx": 538.0, "cy": 700.0}, {"id": "verify_customer", "type": "validation", "lane": "agt", "phase": 1, "label": "Verify the Customer (Security Questions)", "sub": "CBU_C360_REQ_001.03", "desc": "Agent shall be able to view the verification questions and answers related to the customer in the screen. Agents shall be able to mark the customer as verified if customer response matches.", "controls": ["All agent role (Retail agent, Telesales, Call center) shall be able to view the verification questions and manually match the answer"], "slot": 2, "w": 176, "h": 100, "x": 450.0, "y": 870.0, "cx": 538.0, "cy": 920.0}, {"id": "id_capture", "type": "system", "lane": "idv", "phase": 1, "label": "ID Capture (IDWise)", "sub": "MOB_POST_ACT_RETL_001.03", "desc": "Agent shall be able to scan the customer's ID using IDWise: a) Front Page b) Back page c) Liveliness (optional if customer agrees).", "controls": ["System (IDWise) shall be able to validate the ID Type and only allow: QID, Passport, Diplomatic ID, GCC ID", "System shall allow to re-scan the ID if the ID-wise fails to capture information at previous attempt."], "slot": 0, "w": 190, "h": 56, "x": 443.0, "y": 2112.0, "cx": 538.0, "cy": 2140.0}, {"id": "display_id_info", "type": "system", "lane": "idv", "phase": 1, "label": "Display Captured ID Information", "sub": "Requirement Name: Display Captured ID Information", "desc": "System shall be able to capture customer information from the scanned ID. Agent shall be able to view scanned ID information in UI. System shall be able to send the scanned ID information to CRM. System shall capture the Expiry Date from ID wise and populate in CRM (as MOI not returning Expiry date).", "controls": [], "outputs": ["ID Type", "ID Number", "First Name", "Last Name", "Date of Birth", "Nationality", "ID Expiry Date"], "slot": 1, "w": 190, "h": 100, "x": 443.0, "y": 2310.0, "cx": 538.0, "cy": 2360.0}, {"id": "moi_validation", "type": "validation", "lane": "idv", "phase": 1, "label": "MOI Validation", "sub": "MOB_POST_ACT_RETL_001.04", "desc": "System shall be able to fetch the Customer information from MOI based on QID, Diplomatic ID and Passport No (from all countries). MOI will return captured fields.", "controls": ["System shall compare the MOI returned fields with ID wise captured fields.", "System shall be able to compare below fields between IDWise and MOI: First Name, Last Name, ID Number and DOB", "If all fields match (100%) then agent shall be allowed to proceed else agent can reject or re-scan (from ID Capture)"], "branches": [{"label": "Fields match (100%)", "to": "nav_customer_360"}, {"label": "Mismatch - reject or re-scan", "to": "id_capture"}], "slot": 2, "w": 176, "h": 70, "x": 450.0, "y": 2545.0, "cx": 538.0, "cy": 2580.0}, {"id": "nav_customer_360", "type": "system", "lane": "sys", "phase": 1, "label": "Navigation to Customer 360", "sub": "CBU_C360_REQ_001.04", "desc": "The agent shall be able to view customer information through the Customer 360 View. Agent shall be able to navigate to the service account for which customer is asking for Plan Change. System shall allow the agent to create order for the requested service by customer (like Post to Pre / Plan change / Pre to post).", "controls": ["System shall navigate to Customer 360 upon successful validation of the customer account"], "slot": 0, "w": 190, "h": 100, "x": 443.0, "y": 1150.0, "cx": 538.0, "cy": 1200.0}, {"id": "initiate_plan_change", "type": "agent", "lane": "agt", "phase": 2, "label": "Initiate Plan Change", "sub": "MOB_POST_PLN_CHG_RETL_001.03", "desc": "Agent should be able to initiate the plan change.", "controls": [], "slot": 0, "w": 206, "h": 60, "x": 687.0, "y": 450.0, "cx": 790.0, "cy": 480.0}, {"id": "blacklist_check", "type": "validation", "lane": "sys", "phase": 2, "label": "Blacklist Check", "sub": "MOB_POST_PLN_CHG_RETL_001.04", "desc": "The system shall perform a blacklist verification for the customer before processing the Plan change request.", "controls": ["Blacklisted customers shall not be eligible for plan change requests.", "The plan change process shall be restricted until the blacklist status is removed or cleared."], "branches": [{"label": "Not blacklisted", "to": "lockin_check"}, {"label": "Blacklisted", "to": "reject_blacklist"}], "slot": 3, "w": 176, "h": 70, "x": 702.0, "y": 1825.0, "cx": 790.0, "cy": 1860.0}, {"id": "reject_blacklist", "type": "error", "lane": "sys", "phase": 2, "label": "Plan Change Restricted (Blacklisted)", "sub": "MOB_POST_PLN_CHG_RETL_001.04", "desc": "Plan change process is restricted until the blacklist status is removed or cleared.", "controls": ["Blacklisted customers shall not be eligible for plan change requests."], "slot": 2, "w": 190, "h": 100, "x": 695.0, "y": 1590.0, "cx": 790.0, "cy": 1640.0}, {"id": "lockin_check", "type": "decision", "lane": "sys", "phase": 2, "label": "Plan Lock-in Check (3-Month)", "sub": "MOB_POST_PLN_CHG_RETL_001.05", "desc": "The system shall verify whether the customer has completed the mandatory 3-month plan lock-in period. If the lock-in period is not completed, the customer must confirm acceptance of the applicable penalty charges.", "controls": ["All postpaid plans are subject to a mandatory 3-month lock-in period."], "branches": [{"label": "Lock-in completed", "to": "upgrade_downgrade_check"}, {"label": "Not completed - customer agrees to penalty", "to": "lockin_penalty_payment"}, {"label": "Not completed - customer declines penalty", "to": "reject_lockin"}], "slot": 1, "w": 150, "h": 100, "x": 715.0, "y": 1370.0, "cx": 790.0, "cy": 1420.0}, {"id": "reject_lockin", "type": "end", "lane": "cust", "phase": 2, "label": "Plan Change Rejected (Lock-in Penalty Declined)", "sub": "MOB_POST_PLN_CHG_RETL_001.05", "desc": "If the customer does not agree to pay the penalty, the plan change request shall be rejected, and the process shall end.", "controls": [], "slot": 0, "w": 100, "h": 100, "x": 740.0, "y": 150.0, "cx": 790.0, "cy": 200.0}, {"id": "lockin_penalty_payment", "type": "agent", "lane": "billing", "phase": 2, "label": "Lock-in Period Penalty Payment", "sub": "Requirement Name: Lock In Period Penalty Payment", "desc": "Agent should be able to collect the payment for lock-in period penalty from customer through WinCash, if customer wants to change the plan within the lock-in period. Agent should be able to proceed further with the next steps after the penalty collection. If customer fails to pay the penalty then the process needs to be stopped at this step.", "controls": [], "branches": [{"label": "Penalty paid", "to": "upgrade_downgrade_check"}, {"label": "Penalty not paid", "to": "reject_penalty_unpaid"}], "slot": 1, "w": 206, "h": 100, "x": 687.0, "y": 3030.0, "cx": 790.0, "cy": 3080.0}, {"id": "reject_penalty_unpaid", "type": "end", "lane": "billing", "phase": 2, "label": "Process Stopped (Penalty Not Paid)", "sub": "Requirement Name: Lock In Period Penalty Payment", "desc": "If customer fails to pay the penalty then the process needs to be stopped at this step.", "controls": [], "slot": 0, "w": 84, "h": 84, "x": 748.0, "y": 2818.0, "cx": 790.0, "cy": 2860.0}, {"id": "upgrade_downgrade_check", "type": "control", "lane": "sys", "phase": 2, "label": "Plan Upgrade/Downgrade Check", "sub": "MOB_POST_PLN_CHG_RETL_001.06", "desc": "System shall compare the price of the new plan with old plan and automatically consider whether it's plan downgrade or upgrade. Agent shall be able to view the penalty charges if any during the Downgrade Plan.", "controls": ["Upgrade Plan: if new plan price is greater than old plan then system should consider this journey as Upgrade Plan and there will not be any penalties to be collected.", "Downgrade Plan: if new plan price is lesser than old plan then system shall consider this journey as Downgrade Plan and penalty to be collected based on the Business rules.", "System should automatically calculate the penalty amount for Plan Downgrade and process it during billing.", "If the Plan price is same as previous plan then it'll be just plan update and no need to consider it as Upgrade or Downgrade."], "slot": 0, "w": 206, "h": 100, "x": 687.0, "y": 1150.0, "cx": 790.0, "cy": 1200.0}, {"id": "cart_creation", "type": "agent", "lane": "sys", "phase": 3, "label": "Cart Creation", "sub": "MOB_POST_PLN_CHG_RETL_001.07", "desc": "Agent shall  "billing", "phase": 4, "label": "Payment Processing", "sub": "MOB_POST_DWN_RETL_001.08", "desc": "Agent shall be able to view the payment summary which will be added to the next bill. Agent shall be able to provide the customer copy of the receipt generated by WinCash (even if customer doesn't need to pay upfront, WinCash will generate receipt for zero payment).", "controls": ["System shall display the payment summary", "System shall be able to capture and process Bill payments (penalty for downgrade plan) to billing system.", "System shall be able to add the penalty details to the next billing cycle", "System shall be able to add the penalty details for the plan downgrade in the bill"], "slot": 0, "w": 190, "h": 56, "x": 1199.0, "y": 2832.0, "cx": 1294.0, "cy": 2860.0}, {"id": "order_submission", "type": "agent", "lane": "agt", "phase": 4, "label": "Order Submission and Processing", "sub": "MOB_POST_DWN_RETL_001.09", "desc": "Agent shall be able to submit the order. Agent shall be able to create Activity in UI with Description of the activity as Free Text field to capture the Order specific details. This Activity will have tooltip or information icon as \"Please note down a comment regarding the actions performed. This will be used by other advisors to better understand the customer's history.\"", "controls": ["System shall submit the order to downstream systems for backend provisioning and Activation", "System shall pass the penalty details to BRM systems for billing process", "System shall send acknowledgement and order confirmation to customer through the selected mode (Email/SMS)."], "slot": 0, "w": 206, "h": 100, "x": 1191.0, "y": 430.0, "cx": 1294.0, "cy": 480.0}, {"id": "notify_submission", "type": "system", "lane": "fulfil", "phase": 4, "label": "Customer Notification - Submission", "sub": "MOB_POST_TO_PRE_RETL_001.19", "desc": "System shall send order submission notification to customer through the selected mode (Email/SMS).", "controls": [], "slot": 0, "w": 190, "h": 100, "x": 1199.0, "y": 3310.0, "cx": 1294.0, "cy": 3360.0}, {"id": "all_orders_view", "type": "system", "lane": "sys", "phase": 4, "label": "All Orders View from Customer 360", "sub": "MOB_POST_ACT_RETL_001.19.2", "desc": "System shall navigate the agent to Customer 360 -> All Orders View after order is submitted to the downstream systems. Agent shall be able to check the recently submitted order and their status.", "controls": [], "slot": 0, "w": 190, "h": 100, "x": 1199.0, "y": 1150.0, "cx": 1294.0, "cy": 1200.0}, {"id": "order_completion", "type": "system", "lane": "fulfil", "phase": 5, "label": "Order Completion", "sub": "MOB_POST_TO_PRE_RETL_001.20", "desc": "System shall get the order completion from downstream systems to CRM once the order is completed (Plan change completed).", "controls": [], "slot": 0, "w": 190, "h": 56, "x": 1451.0, "y": 3332.0, "cx": 1546.0, "cy": 3360.0}, {"id": "tracking_record_update", "type": "system", "lane": "sys", "phase": 5, "label": "Tracking Record Update", "sub": "MOB_POST_ACT_RETL_001.21.1", "desc": "System shall update the ticket with \"Resolved\" status.", "controls": ["System shall update the Order Number in the Tracking record Ticket details.", "System shall update the mandatory fields while making the TT Status Resolved."], "inputs": ["TT Closure Fields - align with TT Closure flow"], "slot": 0, "w": 190, "h": 56, "x": 1451.0, "y": 1172.0, "cx": 1546.0, "cy": 1200.0}, {"id": "feedback_survey", "type": "external", "lane": "fulfil", "phase": 5, "label": "Feedback Survey (Mediallia)", "sub": "MOB_POST_ACT_RETL_001.21.1", "desc": "Once Order is completed, System shall send the information to Medilia for sending the Customer Feedback Survey. System shall also receive the Survey Status from Medilia in CRM.", "controls": ["System shall keep the trouble ticket in Resolved status until the Survey is not completed.", "System shall automatically mark the Trouble ticket as Closed once all order tasks/activities are completed"], "slot": 1, "w": 176, "h": 100, "x": 1458.0, "y": 3530.0, "cx": 1546.0, "cy": 3580.0}, {"id": "notify_completion", "type": "end", "lane": "fulfil", "phase": 5, "label": "Customer Notification - Completion", "sub": "MOB_POST_TO_PRE_RETL_001.21", "desc": "System shall send acknowledgement on order completion to customer through the selected mode (Email/SMS). System shall send notification on order completion to all the MSISDNs which are available under the QID. E.g. if Customer account with QID has 5 contacts/MSISDNs active then notification will be sent to all 5 MSISDNs for the successful activation of any MSISDN.", "controls": [], "slot": 2, "w": 100, "h": 100, "x": 1496.0, "y": 3750.0, "cx": 1546.0, "cy": 3800.0}], "flows": [{"from": "start", "to": "qnomy_ticket", "kind": "seq", "happy": true}, {"from": "qnomy_ticket", "to": "tracking_record", "kind": "seq", "happy": true}, {"from": "tracking_record", "to": "cust_verif_process", "kind": "seq", "happy": true}, {"from": "cust_verif_process", "to": "cust_identification", "kind": "seq", "happy": true}, {"from": "cust_identification", "to": "verify_customer", "kind": "seq", "happy": true}, {"from": "verify_customer", "to": "id_capture", "kind": "seq", "happy": true}, {"from": "id_capture", "to": "display_id_info", "kind": "seq", "happy": true}, {"from": "display_id_info", "to": "moi_validation", "kind": "seq", "happy": true}, {"from": "moi_validation", "to": "nav_customer_360", "kind": "cond", "label": "Fields match (100%)", "happy": true}, {"from": "moi_validation", "to": "id_capture", "kind": "cond", "label": "Mismatch - reject or re-scan", "happy": false}, {"from": "nav_customer_360", "to": "initiate_plan_change", "kind": "seq", "happy": true}, {"from": "initiate_plan_change", "to": "blacklist_check", "kind": "seq", "happy": true}, {"from": "blacklist_check", "to": "lockin_check", "kind": "cond", "label": "Not blacklisted", "happy": true}, {"from": "blacklist_check", "to": "reject_blacklist", "kind": "cond", "label": "Blacklisted", "happy": false}, {"from": "lockin_check", "to": "upgrade_downgrade_check", "kind": "cond", "label": "Lock-in completed", "happy": true}, {"from": "lockin_check", "to": "lockin_penalty_payment", "kind": "cond", "label": "Not completed - customer agrees to penalty", "happy": false}, {"from": "lockin_check", "to": "reject_lockin", "kind": "cond", "label": "Not completed - customer declines penalty", "happy": false}, {"from": "lockin_penalty_payment", "to": "upgrade_downgrade_check", "kind": "cond", "label": "Penalty paid", "happy": false}, {"from": "lockin_penalty_payment", "to": "reject_penalty_unpaid", "kind": "cond", "label": "Penalty not paid", "happy": false}, {"from": "upgrade_downgrade_check", "to": "cart_creation", "kind": "seq", "happy": true}, {"from": "cart_creation", "to": "save_milestone", "kind": "seq", "happy": true}, {"from": "save_milestone", "to": "verify_cart", "kind": "seq", "happy": true}, {"from": "verify_cart", "to": "caf_documents", "kind": "seq", "happy": true}, {"from": "caf_documents", "to": "payment_processing", "kind": "seq", "happy": true}, {"from": "payment_processing", "to": "order_submission", "kind": "seq", "happy": true}, {"from": "order_submission", "to": "notify_submission", "kind": "seq", "happy": true}, {"from": "order_submission", "to": "all_orders_view", "kind": "data", "happy": false}, {"from": "notify_submission", "to": "order_completion", "kind": "seq", "happy": true}, {"from": "order_completion", "to": "tracking_record_update", "kind": "seq", "happy": true}, {"from": "tracking_record_update", "to": "feedback_survey", "kind": "seq", "happy": true}, {"from": "feedback_survey", "to": "notify_completion", "kind": "seq", "happy": true}], "model": {"agents": [], "contracts": [], "connectivity": []}, "deliv": {"bioMatrix": {}}, "biz": {"bio": {"start": {"title": "Customer Visits Retail Store", "does": "Customer visits a retail store requesting a Postpaid Plan Change (upgrade or downgrade).", "needs": "Custo
